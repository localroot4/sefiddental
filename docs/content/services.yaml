    sessions: کامپوزیت معمولاً جلسهٔ کمتری از لمینت
    related: [composite-veneer, ceramic-laminate, orthodontics]
    body:
      - type: content
        text: |-
          ## دیاستم چیست؟
          دیاستم یعنی فاصله‌ای بین دو دندان. این فاصله بیشتر بین دو دندان جلوی بالا دیده می‌شود و از دلیل‌های رایج نارضایتی از لبخند است. گاهی فاصله فقط به ظاهر مربوط است و گاهی نشانهٔ علتی است که باید اول پیدا شود.

          ## چرا بین دندان‌ها فاصله می‌افتد؟
          - اندازهٔ دندان‌ها با فک هماهنگ نیست، یا دندانی کوچک است یا از ابتدا تشکیل نشده است
          - دندان اضافه‌ای در فک هست
          - عادت‌هایی مثل مکیدن انگشت، فشار دادن زبان به دندان‌ها یا مکیدن لب
          - نخ لب بالا (فرنوم) بزرگ است؛ این علت فقط در بخش کوچکی از موارد نقش اصلی را دارد
          - بیماری پیشرفتهٔ لثه دندان‌ها را جابه‌جا کرده است

          در کودکانی که هم دندان شیری و هم دندان دائمی دارند، فاصلهٔ بین دو دندان جلوی بالا اغلب بخشی از رشد طبیعی است.

          ## برای چه کسی مناسب است؟
          - نوجوان یا بزرگسالی که دندان‌های دائمی‌اش درآمده‌اند، از فاصلهٔ بین دندان‌های جلو ناراضی است و دندان و لثهٔ سالم دارد
          - فاصله‌ای که بعد از ارتودنسی، به‌خاطر اندازه یا فرم دندان‌ها، باقی مانده است

          ## سه راه بستن فاصله
          - کامپوزیت: مادهٔ همرنگ دندان در مطب به کنارهٔ دندان‌ها افزوده و شکل داده می‌شود. معمولاً تراش کمتری از لمینت لازم دارد و گاهی بدون تراش انجام می‌شود.
          - لمینت سرامیکی: پوسته‌ای نازک که در لابراتوار ساخته می‌شود و سطح جلوی دندان را می‌پوشاند. برای آن کمی از مینای دندان برداشته می‌شود و این کار برگشت‌پذیر نیست.
          - ارتودنسی: خود دندان‌ها را جابه‌جا می‌کند و برای فاصله‌های بزرگ یا وقتی دندان‌ها درست روی هم جفت نمی‌شوند به کار می‌رود.

          گاهی ترکیبی از این روش‌ها لازم است؛ مثلاً اول ارتودنسی و بعد کامپوزیت برای اصلاح فرم دندان‌ها.

          ## چه وقت کامپوزیت یا لمینت کافی نیست؟
          اگر فاصله بزرگ است یا دندان‌ها درست جفت نمی‌شوند، ممکن است ارتودنسی لازم باشد. اگر علت فاصله بیماری لثه یا یک عادت دهانی است، اول همان علت درمان می‌شود؛ درمان مؤثر از تشخیص علت شروع می‌شود. اگر دندان‌هایتان را روی هم فشار می‌دهید، دندان‌قروچه دارید یا دندان‌های بالا بیش از حد روی دندان‌های پایین را می‌پوشانند، لمینت ممکن است انتخاب خوبی نباشد.
      - type: callout
        tone: info
        text: انتخاب روش بستن فاصله با معاینه و تشخیص دندانپزشک است. هزینهٔ هر روش را پیش از شروع کار از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه و پیدا کردن علت
            text: دندانپزشک دندان‌ها، لثه و جفت شدن دندان‌ها را معاینه می‌کند، دربارهٔ عادت‌ها و سابقهٔ درمان شما می‌پرسد و در صورت نیاز عکس رادیوگرافی می‌گیرد.
          - title: درمان مشکلات دیگر
            text: اگر پوسیدگی یا بیماری لثه باشد، پیش از بستن فاصله درمان می‌شود.
          - title: انتخاب روش
            text: بسته به اندازه و علت فاصله، کامپوزیت، لمینت، ارتودنسی یا ترکیبی از آن‌ها پیشنهاد می‌شود.
          - title: انتخاب رنگ
            text: در کامپوزیت و لمینت، رنگی انتخاب می‌شود که با دندان‌های طبیعی شما هماهنگ باشد.
          - title: بستن فاصله
            text: در کامپوزیت، ماده روی کنارهٔ دندان شکل می‌گیرد، با نور مخصوص سخت می‌شود و پرداخت می‌شود. لمینت معمولاً بیش از یک جلسه لازم دارد، چون در لابراتوار ساخته می‌شود. ارتودنسی ثابت معمولاً یک تا دو سال طول می‌کشد و جلسه‌های کنترل معمولاً هر ۶ تا ۸ هفته است.
          - title: بررسی جفت شدن دندان‌ها
            text: پس از کار، جفت شدن دندان‌ها هنگام بستن دهان بررسی می‌شود. اگر بعداً حس کردید دندان‌ها درست روی هم نمی‌نشینند، به دندانپزشک بگویید.
      - type: content
        text: |-
          ## بعد از بستن فاصله
          - ناخن نجوید و اجسام یا خوراکی‌های خیلی سفت را با دندان‌های جلو گاز نزنید.
          - قهوه، چای و نوشیدنی‌های پررنگ ممکن است کامپوزیت یا لمینت را رنگی کنند.
          - روزی دو بار با خمیردندان فلورایددار مسواک بزنید و هر روز بین دندان‌ها را تمیز کنید. زیر یا کنار کامپوزیت و لمینت هم ممکن است پوسیدگی ایجاد شود.
          - در ورزش‌هایی که خطر ضربه به دهان دارند، محافظ دهان بگذارید.
          - بعد از ارتودنسی، نگهدارنده را همان‌طور که دندانپزشک گفته استفاده کنید تا دندان‌ها به جای قبلی برنگردند.

          ## خطرها و محدودیت‌ها
          - کامپوزیت با گذشت زمان ممکن است در لبه‌ها رنگ بگیرد، سطحش زبر یا ساییده شود، لب‌پر شود یا جدا شود. بیشتر این تغییرها با پرداخت یا ترمیم دوباره درست می‌شوند و معاینهٔ منظم لازم است.
          - لمینت ممکن است لب‌پر شود، بشکند یا جدا شود و به چسباندن دوباره یا تعویض نیاز پیدا کند.
          - مینایی که برای لمینت برداشته می‌شود، برنمی‌گردد.
          - بعد از گذاشتن یا تنظیم ارتودنسی، دندان‌ها ممکن است چند روز درد کنند.
          - خطرهای [ارتودنسی](/خدمات/ارتودنسی) در صفحهٔ همان درمان آمده است.
    faqs:
      - question: آیا فاصلهٔ بین دندان‌های جلوی کودکم باید درمان شود؟
        answer: >-
          در کودکانی که هم دندان شیری و هم دندان دائمی دارند، این فاصله اغلب
          بخشی از رشد طبیعی است. برای جابه‌جا کردن دندان‌ها معمولاً تا رویش
          دندان‌های نیش دائمی صبر می‌شود، مگر فاصله خیلی بزرگ باشد. معاینه نشان
          می‌دهد علتی مثل دندان اضافه یا یک عادت دهانی در کار هست یا نه.
      - question: کدام روش برای بستن فاصلهٔ دندان‌های من مناسب است؟
        answer: >-
          به اندازه و علت فاصله، جفت شدن دندان‌ها و انتظار شما بستگی دارد.
          کامپوزیت راهی کم‌تهاجمی است. لمینت سطح جلوی دندان را می‌پوشاند و به
          برداشتن کمی از مینا نیاز دارد. وقتی فاصله بزرگ است یا دندان‌ها درست
          جفت نمی‌شوند، ارتودنسی خود دندان‌ها را جابه‌جا می‌کند. انتخاب با معاینه
          و تشخیص دندانپزشک است.
      - question: آیا برای بستن فاصله با کامپوزیت، دندان تراشیده می‌شود؟
        answer: >-
          کامپوزیت معمولاً تراش کمتری از لمینت لازم دارد و گاهی بدون تراش روی
          دندان قرار می‌گیرد. لمینت سرامیکی به برداشتن کمی از مینای دندان نیاز
          دارد و این کار برگشت‌پذیر نیست.
      - question: آیا بستن فاصله درد دارد؟
        answer: >-
          کامپوزیت اغلب تراش کمی دارد یا تراش ندارد. اگر تراش لازم باشد،
          دندانپزشک دربارهٔ بی‌حسی موضعی توضیح می‌دهد. بعد از گذاشتن یا تنظیم
          ارتودنسی، دندان‌ها ممکن است چند روز درد کنند و غذای نرم کمک می‌کند.
      - question: آیا فاصله بعد از درمان دوباره باز می‌شود؟
        answer: >-
          بعد از ارتودنسی، اگر نگهدارنده طبق دستور استفاده نشود، دندان‌ها ممکن
          است به جای قبلی برگردند. اگر علتی مثل بیماری لثه یا یک عادت دهانی
          درمان نشود، نتیجه هم پایدار نمی‌ماند. کامپوزیت و لمینت هم با گذشت زمان
          ممکن است به پرداخت، ترمیم یا تعویض نیاز پیدا کنند.
      - question: بین دندان‌هایم تازه فاصله افتاده است؛ چه کنم؟
        answer: >-
          جابه‌جا شدن دندان‌ها در بزرگسالی می‌تواند از نشانه‌های بیماری پیشرفتهٔ
          لثه باشد. اگر لثه‌تان خونریزی دارد، ورم کرده یا دندانی لق شده است،
          زودتر برای معاینه نوبت بگیرید. در این حالت اول لثه درمان می‌شود و بعد
          دربارهٔ بستن فاصله تصمیم گرفته می‌شود.
      - question: هزینهٔ بستن دیاستم چقدر است؟
        answer: >-
          هزینه به روش درمان، اندازهٔ فاصله و تعداد دندان‌ها بستگی دارد و پس از
          معاینه مشخص می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
