  - key: gum-surgery
    category: surgery-replacement
    nav_label: جراحی لثه
    h1: جراحی لثه
    seo_title: جراحی لثه و درمان تحلیل لثه
    slug: جراحی-لثه
    booking_group: other
    priority: 3
    search_terms: [جراحی لثه, درمان بیماری لثه, تحلیل لثه, جراحی فلپ لثه]
    summary: جراحی لثه برای بیماری لثه، وقتی جرم‌گیری عمقی و درمان‌های ساده‌تر کافی نیست.
    seo_description: >-
      جراحی لثه برای بیماری پیشرفتهٔ لثه، وقتی جرم‌گیری عمقی کافی نیست:
      نشانه‌ها، مراحل، مراقبت بعد از جراحی و نکته‌های تحلیل لثه در کلینیک
      دندانپزشکی سفید.
    related: [scaling, gum-lift, implant]
    body:
      - type: content
        text: |-
          ## جراحی لثه چیست؟
          بیماری لثه با پلاک شروع می‌شود؛ لایهٔ چسبنده‌ای از باکتری که مدام روی دندان‌ها تشکیل می‌شود. اگر پلاک خوب پاک نشود، لثه ملتهب می‌شود و از دندان فاصله می‌گیرد. به این فضای بین لثه و دندان «پاکت لثه» می‌گویند. پلاکی که در پاکت گیر می‌افتد با مسواک پاک نمی‌شود.

          درمان معمولاً با جرم‌گیری عمقی زیر لثه شروع می‌شود. اگر بعد از آن پاکت‌ها هنوز عمیق باشند و بیماری کنترل نشود، جراحی لثه یکی از راه‌های بعدی است. جراحی فلپ یکی از جراحی‌های رایج برای درمان پاکت لثه است. در این جراحی، لثه کنار زده می‌شود تا دندانپزشک به ریشهٔ دندان و ته پاکت دسترسی داشته باشد و آن را کامل تمیز کند.

          ## برای چه کسی مناسب است؟
          - بیماری پیشرفتهٔ لثه (پریودنتیت) که پاکت‌های عمیق ایجاد کرده است
          - پاکت‌هایی که بعد از جرم‌گیری عمقی و مراقبت درست در خانه، هنوز عمیق مانده‌اند
          - بیماری لثه‌ای که با درمان‌های ساده‌تر کنترل نشده است

          این نشانه‌ها می‌توانند از بیماری لثه خبر بدهند: خونریزی لثه هنگام مسواک زدن، لثهٔ قرمز و متورم، کنار رفتن لثه از دندان، بوی بد دهان که از بین نمی‌رود و لق شدن دندان‌ها. بیماری لثه اغلب درد ندارد، پس معاینهٔ منظم مهم است.

          ## تحلیل لثه از کجا شروع می‌شود؟
          تحلیل لثه یعنی لثه از روی دندان کنار برود. بیماری لثه یکی از علت‌های آن است. مسواک زدن خیلی محکم یا با مسواک سفت هم می‌تواند به دندان آسیب بزند و لثه را تحریک کند. با مسواک نرم و فشار ملایم مسواک بزنید.

          درمان تحلیل لثه از علت آن شروع می‌شود. اگر بیماری لثه باشد، اول همان درمان می‌شود. دندانپزشک پس از معاینه می‌گوید چه درمانی برای شما مناسب است.

          ## چه وقت جراحی لثه لازم نیست یا کافی نیست؟
          بیماری لثه در مرحلهٔ اول، یعنی التهاب لثه، معمولاً با [جرم‌گیری](/خدمات/جرم-گیری) در مطب و مسواک و نخ دندان روزانه برطرف می‌شود و به جراحی نیاز ندارد.

          جراحی به‌تنهایی بیماری لثه را برای همیشه درمان نمی‌کند. بدون مراقبت روزانه در خانه و معاینهٔ منظم، بیماری ممکن است برگردد. اگر دندانی بخش زیادی از تکیه‌گاه خود را از دست داده باشد، گاهی کشیدن آن بهتر از نگه داشتنش است. در این حالت دندانپزشک راه‌های جایگزینی مثل [ایمپلنت دندان](/خدمات/ایمپلنت-دندان) را توضیح می‌دهد.

          اگر هدف شما اصلاح لبخند لثه‌ای است، صفحهٔ [لیفت لثه](/خدمات/لیفت-لثه) را ببینید.
      - type: callout
        tone: info
        text: انتخاب درمان لثه، از جرم‌گیری عمقی تا جراحی، با معاینه و تشخیص دندانپزشک است. پیش از جراحی، بیماری‌ها و داروهایتان را به دندانپزشک بگویید، به‌خصوص اگر داروی رقیق‌کنندهٔ خون مصرف می‌کنید یا سیگار می‌کشید. داروی رقیق‌کنندهٔ خون را خودسرانه قطع نکنید. دندانپزشک روش کار را توضیح می‌دهد و به پرسش‌های شما پاسخ می‌دهد.
      - type: steps
        items:
          - title: معاینهٔ لثه
            text: دندانپزشک لثه‌ها را معاینه و عمق پاکت‌ها را اندازه می‌گیرد. در صورت نیاز عکس رادیوگرافی هم گرفته می‌شود تا وضعیت استخوان دور دندان‌ها مشخص شود.
          - title: جرم‌گیری عمقی
            text: پلاک و جرم بالا و زیر لثه تا ته پاکت پاک و سطح ریشه صاف می‌شود تا به چسبیدن دوبارهٔ لثه به دندان کمک کند. ممکن است بیش از یک جلسه و بی‌حسی موضعی لازم باشد.
          - title: ارزیابی دوباره
            text: بعد از چند هفته، که لثه فرصت بهبود پیدا کرده است، پاکت‌ها دوباره اندازه گرفته می‌شوند. اگر هنوز عمیق باشند، درمان بیشتر یا جراحی بررسی می‌شود.
          - title: جراحی
            text: در جراحی فلپ، لثه کنار زده می‌شود و ریشهٔ دندان و ته پاکت تمیز می‌شود.
          - title: کنترل و نگهداری
            text: بعد از درمان، جلسه‌های کنترل و جرم‌گیری منظم برنامه‌ریزی می‌شود. فاصلهٔ این جلسه‌ها برای هر کس جداگانه تعیین می‌شود.
      - type: content
        text: |-
          ## بعد از جراحی لثه
          دستور مراقبتی را که دندانپزشک می‌دهد دقیق دنبال کنید. در روزهای اول درد، ناراحتی و کمی خونریزی ممکن است. دندانپزشک ممکن است برای کنترل درد یا پیشگیری از عفونت، دارو یا دهانشویه تجویز کند.

          - سیگار نکشید. سیگار بعد از جراحی در دهان خطر عفونت را بیشتر می‌کند و یکی از عوامل خطر بیماری لثه است.
          - ناحیهٔ جراحی را همان‌طور که دندانپزشک می‌گوید تمیز کنید.
          - به جلسه‌های کنترل بیایید تا بهبود لثه و عمق پاکت‌ها بررسی شود.

          برای اینکه بیماری برنگردد، روزی دو بار با مسواک نرم مسواک بزنید و هر روز بین دندان‌ها را با نخ دندان یا مسواک بین‌دندانی تمیز کنید.

          ## خطرها و عوارض
          - درد، ناراحتی و خونریزی در روزهای اول بعد از جراحی
          - حساسیت دندان‌ها در دورهٔ بهبود بعد از جرم‌گیری عمقی، که معمولاً با تمیز کردن خوب پلاک در خانه کم می‌شود
          - عفونت، مثل هر جراحی دیگر در دهان
          - پایین رفتن لثه: بعد از جراحی، لثه ممکن است پایین‌تر از قبل قرار بگیرد. دندان‌ها بلندتر به نظر می‌رسند، فاصلهٔ بین آن‌ها بیشتر دیده می‌شود و ریشه ممکن است به سرما حساس شود. در دندان‌های جلوی بالا، این تغییر در لبخند دیده می‌شود و دندانپزشک پیش از جراحی آن را با شما بررسی می‌کند.
          - برگشت بیماری لثه، اگر مراقبت روزانه و معاینهٔ منظم ادامه پیدا نکند

          اگر خونریزی بند نمی‌آید، یا درد و ورم شدید است یا بیشتر می‌شود و مسکن کمکی نمی‌کند، با کلینیک تماس بگیرید.
    faqs:
      - question: آیا برای بیماری لثه همیشه جراحی لازم است؟
        answer: >-
          نه. التهاب لثه در مرحلهٔ اول معمولاً با جرم‌گیری در مطب و مسواک و
          نخ دندان روزانه برطرف می‌شود. در بیماری پیشرفته‌تر، درمان معمولاً با
          جرم‌گیری عمقی زیر لثه شروع می‌شود. جراحی وقتی بررسی می‌شود که این
          درمان‌ها بیماری را کنترل نکنند.
      - question: آیا جراحی لثه درد دارد؟
        answer: >-
          پیش از جراحی، دندانپزشک روش کار و بی‌حسی را توضیح می‌دهد و به
          پرسش‌های شما پاسخ می‌دهد. بعد از جراحی، درد و ناراحتی در روزهای اول
          ممکن است. دربارهٔ داروی مسکن از دندانپزشک بپرسید. اگر درد به‌جای کم
          شدن بیشتر شد، با کلینیک تماس بگیرید.
      - question: تحلیل لثه چیست و چطور درمان می‌شود؟
        answer: >-
          تحلیل لثه یعنی لثه از روی دندان کنار برود. بیماری لثه یکی از
          علت‌های آن است و مسواک زدن خیلی محکم یا با مسواک سفت هم لثه را تحریک
          می‌کند. درمان از علت شروع می‌شود و دندانپزشک پس از معاینه می‌گوید چه
          درمانی برای شما مناسب است.
      - question: فرق جراحی لثه با لیفت لثه چیست؟
        answer: >-
          جراحی لثه برای درمان بیماری لثه و پاکت‌های عمیق است. لیفت لثه یک
          درمان زیبایی است، برای وقتی که لثه هنگام لبخند بیش از حد دیده
          می‌شود. دندانپزشک پس از معاینه می‌گوید کدام برای شما مناسب است.
      - question: بعد از جراحی لثه چه مراقبتی لازم است؟
        answer: >-
          دستور مراقبت دندانپزشک را دقیق دنبال کنید و دارو یا دهانشویه‌ای را
          که تجویز می‌شود طبق دستور مصرف کنید. سیگار نکشید. به جلسه‌های کنترل
          بیایید تا بهبود لثه بررسی شود.
      - question: آیا بیماری لثه بعد از درمان برمی‌گردد؟
        answer: >-
          ممکن است برگردد. برای پیشگیری، روزی دو بار با مسواک نرم مسواک بزنید،
          هر روز بین دندان‌ها را تمیز کنید، از دخانیات دوری کنید و طبق برنامهٔ
          دندانپزشک برای معاینه و جرم‌گیری بیایید.
      - question: سیگار چه اثری بر بیماری لثه دارد؟
        answer: >-
          سیگار و دیگر دخانیات خطر بیماری لثه را بیشتر می‌کنند. بعد از جراحی
          در دهان هم سیگار خطر عفونت را بیشتر می‌کند. ترک سیگار بخشی از درمان
          بیماری لثه است.
      - question: هزینهٔ جراحی لثه چقدر است؟
        answer: >-
          هزینه به وسعت درمان و تعداد ناحیه‌هایی که جراحی لازم دارند بستگی
          دارد و پس از معاینه مشخص می‌شود. پیش از شروع کار، هزینه را از پذیرش
          بپرسید.
