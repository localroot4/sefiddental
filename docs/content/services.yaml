    body:
      - type: content
        text: |-
          ## کشیدن دندان چیست؟
          کشیدن دندان یعنی بیرون آوردن دندانی که نمی‌شود یا نباید آن را نگه داشت. علت آن معمولاً بیماری دندان یا لثه، ضربه یا کمبود جا در فک است. پیش از کشیدن، ناحیه با بی‌حسی موضعی بی‌حس می‌شود.

          ## چه وقت کشیدن دندان لازم می‌شود؟
          - پوسیدگی یا عفونتی که دندان را نمی‌شود با درمان ریشه نگه داشت
          - بیماری پیشرفتهٔ لثه که دندان را لق کرده است
          - دندان شکسته‌ای که ترمیم آن ممکن نیست
          - کمبود جا در فک، وقتی برنامهٔ ارتودنسی کشیدن دندان را لازم بداند
          - دندان عقلی که جای کافی برای رویش ندارد و مشکل ایجاد کرده است

          ## چه وقت کشیدن دندان راه مناسب یا کافی نیست؟
          کشیدن همیشه تنها راه نیست. دندان عفونی را گاهی می‌شود با [درمان ریشه](/خدمات/درمان-ریشه) نگه داشت. دندانپزشک پس از معاینه و عکس رادیوگرافی می‌گوید کدام راه برای شما مناسب است.

          اگر دندان عقل نهفته باشد یا لثه روی آن را پوشانده باشد، ممکن است کشیدن ساده کافی نباشد و جراحی لازم شود. دندانپزشک ممکن است این جراحی را انجام دهد یا شما را به جراح دهان ارجاع دهد. صفحهٔ [جراحی دندان عقل و فک](/خدمات/جراحی-دندان-عقل-و-فک) را ببینید.

          کشیدن، جای خالی دندان را پر نمی‌کند. بعد از کشیدن، دربارهٔ جایگزینی دندان با دندانپزشک صحبت کنید. [ایمپلنت دندان](/خدمات/ایمپلنت-دندان) یکی از راه‌هاست.
      - type: callout
        tone: info
        text: اگر داروی ضدانعقاد (رقیق‌کنندهٔ خون) مصرف می‌کنید، پیش از کشیدن دندان به دندانپزشک بگویید، چون این داروها خطر خونریزی را بیشتر می‌کنند. دارو را خودسرانه قطع نکنید؛ تصمیم دربارهٔ آن با پزشک شماست. اگر داروی پوکی استخوان مثل آلندرونات مصرف می‌کنید یا پرتودرمانی سر و گردن داشته‌اید، این را هم به دندانپزشک بگویید، چون در موارد نادر کشیدن دندان ممکن است به استخوان فک آسیب بزند.
      - type: steps
        items:
          - title: معاینه و عکس
            text: دندانپزشک دندان را معاینه می‌کند و در صورت نیاز عکس رادیوگرافی می‌گیرد تا وضعیت دندان و ریشه‌ها مشخص شود. داروهایی را که مصرف می‌کنید به او بگویید.
          - title: بی‌حسی
            text: ناحیهٔ اطراف دندان با بی‌حسی موضعی بی‌حس می‌شود.
          - title: کشیدن دندان
            text: دندان از حفرهٔ خود بیرون آورده می‌شود. گاهی، مثل بعضی دندان‌های عقل، دندان برای کشیدن چند تکه می‌شود و در صورت نیاز لثه بخیه می‌شود.
          - title: بند آمدن خونریزی
            text: برای بند آمدن خونریزی، روی محل فشار داده می‌شود. لختهٔ خونی که در حفره شکل می‌گیرد به بهبود زخم کمک می‌کند.
          - title: دستور مراقبت
            text: دندانپزشک می‌گوید در روزهای بعد چه کنید و چه دارویی برای درد مصرف کنید.
      - type: content
        text: |-
          ## بعد از کشیدن دندان
          لختهٔ خونی که در حفرهٔ دندان شکل می‌گیرد برای بهبود لازم است. در روزهای اول کاری نکنید که این لخته جابه‌جا شود.

          - تا ۲۴ ساعت با نی ننوشید.
          - دهان را محکم نشویید. اگر در چند روز اول شستن دهان لازم است، آرام بشویید.
          - سیگار نکشید. سیگار بهبود را کند می‌کند و خطر عفونت را بیشتر می‌کند.
          - غذای نرم بخورید و از غذای سفت و ترد و چیزهایی مثل آجیل و دانه که در زخم گیر می‌کنند پرهیز کنید.
          - نوشیدنی الکلی و نوشیدنی خیلی داغ ننوشید.
          - دندان‌های دیگر را مثل همیشه مسواک بزنید و نخ بکشید. در چند روز اول، دندان‌های کنار محل کشیدن را تمیز نکنید تا لخته جابه‌جا نشود.
          - برای کم کردن ورم، دستمال سرد یا کیسهٔ یخ روی صورت بگذارید. اگر ورم شدید است یا بیشتر می‌شود، با کلینیک تماس بگیرید.
          - دربارهٔ داروی مسکن از دندانپزشک بپرسید.

          کمی خونریزی طبیعی است. اگر خونریزی ادامه داشت، یک تکه گاز یا پارچهٔ تمیز را دست‌کم ۱۰ دقیقه روی محل فشار دهید.

          ## خطرها و عوارض
          - خشکی حفره (درای ساکت): اگر لخته از جای خود جدا شود و استخوان و عصب زیر آن بی‌پوشش بماند، حفره دردناک می‌شود. در این حالت با کلینیک تماس بگیرید.
          - عفونت، که ممکن است به آنتی‌بیوتیک نیاز داشته باشد.
          - آسیب به عصب نزدیک دندان، بیشتر در کشیدن دندان عقل، که باعث بی‌حسی یا گزگز زبان، لب یا چانه می‌شود. این حالت معمولاً بهتر می‌شود، ولی ممکن است چند هفته یا چند ماه طول بکشد. در موارد کم، ممکن است ماندگار باشد. آسیب عصب زبان ممکن است حس چشایی را هم تغییر دهد.
          - خونریزی طولانی، به‌خصوص اگر داروی ضدانعقاد مصرف می‌کنید.

          ## چه وقت با کلینیک تماس بگیرید؟
          - خونریزی بند نمی‌آید.
          - درد و ورم شدید است یا بیشتر می‌شود و مسکن کمکی نمی‌کند.
          - درد با مزهٔ بد در دهان، تب یا حال ناخوش همراه است.
          - بی‌حسی یا گزگز زبان، لب یا چانه پس از تمام شدن اثر بی‌حسی ادامه دارد.

          اگر کلینیک بسته است و خونریزی بند نمی‌آید، به اورژانس نزدیک‌ترین بیمارستان بروید.

          ## کشیدن دندان شیری
          اگر دندان شیری زودتر از موعد کشیده شود، دندان‌های دیگر ممکن است به جای خالی بیایند و بعداً برای دندان دائمی جای کافی نماند. دندانپزشک ممکن است برای حفظ این جا فضانگهدار پیشنهاد کند. برای درمان دندان کودکان، صفحهٔ [دندانپزشکی کودکان](/خدمات/دندانپزشکی-کودکان) را ببینید.
      - type: callout
        tone: warning
        text: اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید. اگر دور چشم یا گردن ورم کرده است، دهانتان به‌سختی باز می‌شود یا داخل دهان خیلی ورم کرده است، همین حالا به اورژانس بیمارستان بروید.
    faqs:
      - question: آیا کشیدن دندان درد دارد؟
        answer: >-
          پیش از کشیدن، ناحیه با بی‌حسی موضعی بی‌حس می‌شود. بعد از رفتن بی‌حسی،
          درد و ورم در چند روز اول طبیعی است و معمولاً بعد از یکی دو روز رو به
          بهبود می‌رود. دربارهٔ داروی مسکن از دندانپزشک بپرسید.
      - question: بعد از کشیدن دندان چه بخورم؟
        answer: >-
          غذای نرم یا مایع بخورید تا جویدن راحت‌تر شود. از غذای سفت و ترد و
          چیزهایی مثل آجیل و دانه که در زخم گیر می‌کنند پرهیز کنید. تا ۲۴ ساعت
          با نی ننوشید و نوشیدنی خیلی داغ نخورید.
      - question: خونریزی بعد از کشیدن دندان طبیعی است؟
        answer: >-
          کمی خونریزی طبیعی است. اگر ادامه داشت، یک تکه گاز یا پارچهٔ تمیز را
          دست‌کم ۱۰ دقیقه روی محل فشار دهید. اگر خونریزی بند نیامد، با کلینیک
          تماس بگیرید.
      - question: خشکی حفره چیست و چطور از آن پیشگیری کنم؟
        answer: >-
          خشکی حفره وقتی پیش می‌آید که لختهٔ خون از حفرهٔ دندان جدا شود و
          استخوان و عصب بی‌پوشش بمانند. این حالت دردناک است و باید با کلینیک
          تماس بگیرید. درمان آن ممکن است تمیز کردن حفره و گذاشتن پانسمان دارویی
          باشد. برای پیشگیری، سیگار نکشید، با نی ننوشید و دهان را محکم نشویید.
      - question: آیا به‌جای کشیدن می‌شود دندان را نگه داشت؟
        answer: >-
          گاهی بله. دندان عفونی را گاهی می‌شود با درمان ریشه نگه داشت.
          دندانپزشک پس از معاینه و عکس رادیوگرافی می‌گوید نگه داشتن دندان ممکن
          است یا کشیدن آن.
      - question: کشیدن دندان شیری کودک چه نکته‌ای دارد؟
        answer: >-
          اگر دندان شیری زودتر از موعد از دست برود، دندان‌های دیگر ممکن است به
          جای خالی بیایند و برای دندان دائمی جا کم شود. دندانپزشک ممکن است برای
          حفظ این جا فضانگهدار پیشنهاد کند.
      - question: اگر داروی رقیق‌کنندهٔ خون مصرف می‌کنم چه کنم؟
        answer: >-
          پیش از کشیدن دندان به دندانپزشک بگویید، چون این داروها خطر خونریزی را
          بیشتر می‌کنند. دارو را خودسرانه قطع نکنید؛ تصمیم دربارهٔ آن با پزشک
          شماست.
      - question: هزینهٔ کشیدن دندان چقدر است؟
        answer: >-
          هزینه به دندان و شرایط آن بستگی دارد و پس از معاینه مشخص می‌شود. پیش
          از شروع کار، هزینه را از پذیرش بپرسید.
