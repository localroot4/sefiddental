# Installed by deploy/vps/provision.sh into /etc/postgresql/<version>/main/conf.d/.
# IPv4 loopback only: DATABASE_URL and the sshd PermitOpen use 127.0.0.1. Conservative memory
# for 4 GB shared with the app (MemoryMax=2G) and nginx.
listen_addresses = '127.0.0.1'
password_encryption = scram-sha-256
max_connections = 50
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
timezone = 'UTC'
log_timezone = 'UTC'
