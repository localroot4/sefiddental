    search_terms: [روکش دندان, روکش زیرکونیا, قیمت روکش دندان, روکش سرامیکی, روکش دندان جنوب تهران]
    summary: پوششی که کل تاج دندان ضعیف یا ترمیم‌شده را می‌پوشاند و از آن محافظت می‌کند.
    seo_description: >-
      روکش دندان در کلینیک دندانپزشکی سفید: چه وقت لازم است، جنس‌های رایج
      روکش، مراحل تراش و قالب‌گیری، روکش موقت و مراقبت بعد از آن. خانی‌آباد
      نو، جنوب تهران.
    sessions: معمولاً دو جلسه یا بیشتر
    anesthesia: بی‌حسی موضعی، در صورت نیاز هنگام تراش
    recovery: حساسیت به سرما، گرما یا گاز گرفتن شایع و معمولاً خفیف است
    related: [root-canal, inlay-onlay, restoration]
    body:
      - type: content
        text: |-
          ## روکش دندان چیست؟
          روکش کلاهکی است که بخش بیرون از لثهٔ دندان (تاج دندان) را از همه طرف می‌پوشاند و روی آن ثابت می‌شود. روکش شکل و اندازهٔ دندان را برمی‌گرداند، دندان را محکم‌تر می‌کند و ظاهر آن را بهتر می‌کند. برای گذاشتن روکش، دندان تراش داده و شکل داده می‌شود تا روکش روی آن جا بگیرد.

          ## برای چه کسی مناسب است؟
          - دندانی که ترمیم بزرگی دارد و دندان کافی برای نگه داشتن ترمیم در آن نمانده است
          - دندان ضعیفی که ممکن است بشکند، یا دندانی که شکسته یا پوسیده است
          - دندانی که درمان ریشه شده و دندانپزشک روکش را برای محافظت از آن لازم می‌داند
          - دندانی که رنگ یا شکل آن خیلی تغییر کرده است و راه‌های ساده‌تر کافی نیست
          - پوشاندن ایمپلنت، یعنی پایه‌ای که در استخوان فک قرار می‌گیرد و روکش روی آن ثابت می‌شود

          ## چه وقت روکش لازم نیست یا کافی نیست؟
          برای روکش، دندان بیشتری از ترمیم معمولی تراش داده می‌شود. اگر آسیب دندان کوچک باشد، [ترمیم دندان](/خدمات/ترمیم-دندان) ممکن است کافی باشد. اگر آسیب از ترمیم معمولی بزرگ‌تر باشد ولی روکش کامل لازم نباشد، [اینله و آنله](/خدمات/اینله-و-آنله)، که فقط بخشی از دندان را می‌پوشاند، هم یک راه است.

          اگر فقط رنگ یا شکل دندان مشکل دارد، راه‌هایی که دندان را کمتر تراش می‌دهند یا تراش نمی‌دهند، مثل [بلیچینگ](/خدمات/بلیچینگ-دندان)، [کامپوزیت دندان](/خدمات/کامپوزیت-دندان) یا [لمینت سرامیکی](/خدمات/لمینت-سرامیکی)، ممکن است کافی باشد.

          روکش، التهاب یا عفونت عصب دندان را درمان نمی‌کند. اگر عصب دندان آسیب جبران‌ناپذیر دیده یا عفونی باشد، معمولاً اول [درمان ریشه](/خدمات/درمان-ریشه) لازم است و بعد روکش. دندانپزشک پس از معاینه و در صورت نیاز عکس رادیوگرافی، راه مناسب را پیشنهاد می‌کند.

          ## جنس روکش
          روکش‌ها از جنس‌های مختلفی ساخته می‌شوند: فلز، سرامیک یا پرسلن، و سرامیک روی فلز. روکش‌های تمام‌سرامیک هم انواع مختلفی دارند، از جمله زیرکونیا. هر جنس ویژگی‌ها و محدودیت‌های خودش را دارد؛ مثلاً سرامیک همرنگ دندان است، ولی ممکن است بشکند یا لب‌پر شود. دندانپزشک با توجه به جای دندان، نیرویی که هنگام جویدن به آن وارد می‌شود و ظاهر آن، جنس مناسب را پیشنهاد می‌کند. جنس مناسب برای دندان خودتان و هزینهٔ آن را در جلسهٔ معاینه بپرسید.
      - type: callout
        tone: info
        text: انتخاب روکش و جنس آن با معاینه و تشخیص دندانپزشک است. هزینه را پیش از شروع کار از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک دندان را معاینه می‌کند و اگر لازم بداند، عکس رادیوگرافی می‌گیرد تا آسیب‌هایی که در معاینه دیده نمی‌شوند هم پیدا شوند.
          - title: بی‌حسی
            text: اگر لازم باشد، دندان با بی‌حسی موضعی بی‌حس می‌شود. دندانپزشک پیش از شروع کار مطمئن می‌شود بی‌حسی کافی است.
          - title: آماده کردن دندان
            text: دندان تراش داده و شکل داده می‌شود تا روکش روی آن جا بگیرد.
          - title: قالب‌گیری
            text: از دندان قالب گرفته می‌شود تا روکش بر اساس آن در لابراتوار ساخته شود.
          - title: روکش موقت
            text: ساخت روکش در لابراتوار زمان می‌برد. تا آماده شدن روکش دائمی، معمولاً یک روکش موقت روی دندان قرار می‌گیرد.
          - title: گذاشتن روکش دائمی
            text: در جلسهٔ بعد، روکش موقت برداشته می‌شود و روکش دائمی روی دندان ثابت می‌شود.
      - type: content
        text: |-
          ## بعد از روکش
          تا بی‌حسی کامل از بین نرفته است، غذا نجوید تا لب و گونه‌تان را گاز نگیرید.

          در دورهٔ روکش موقت و بعد از ثابت شدن روکش دائمی، دندان ممکن است به سرما و گرما حساس باشد. در یک پژوهش، حدود نیمی از بیماران در سه ماه اول دست‌کم یک بار حساسیت گزارش کردند، ولی شدت آن به‌طور میانگین کم بود. اگر حساسیت ادامه پیدا کرد یا بیشتر شد، به دندانپزشک بگویید.

          دندان زیر روکش هم ممکن است پوسیده شود. دو بار در روز با خمیردندان فلورایددار مسواک بزنید، هر روز بین دندان‌ها را تمیز کنید و برای معاینه‌های منظم بیایید.

          ## خطرها و محدودیت‌ها
          هیچ روکشی همیشگی نیست. در مرور پژوهش‌ها، بیش از ۹۰ درصد روکش‌ها پنج سال بعد هنوز در دهان بودند. این مشکلات ممکن است پیش بیاید:
          - پوسیدگی، که در یک مرور پژوهش‌ها شایع‌ترین مشکل زیستی بود
          - شکستن سرامیک روکش، که شایع‌ترین مشکل فنی بود، یا لب‌پریدگی آن
          - لق شدن یا افتادن روکش
          - شکستن دندان یا ریشه
          - آسیب عصب دندان، که ممکن است بعدها درمان ریشه لازم کند

          ## چه وقت با کلینیک تماس بگیرید؟
          - روکش موقت یا دائمی لق شده، افتاده یا شکسته است.
          - حساسیت یا درد ادامه پیدا می‌کند یا بیشتر می‌شود.
    faqs:
      - question: روکش دندان چند جلسه طول می‌کشد؟
        answer: >-
          معمولاً دست‌کم دو جلسه. در جلسهٔ اول دندان آماده می‌شود، از آن قالب
          گرفته می‌شود و معمولاً روکش موقت روی آن قرار می‌گیرد. ساخت روکش در
          لابراتوار زمان می‌برد و روکش دائمی در جلسهٔ بعد روی دندان ثابت
          می‌شود. اگر پیش از روکش درمان ریشه لازم باشد، جلسه‌های بیشتری لازم
          است.
      - question: آیا روکش کردن دندان درد دارد؟
        answer: >-
          برای تراش دندان، در صورت نیاز از بی‌حسی موضعی استفاده می‌شود و
          دندانپزشک پیش از شروع کار مطمئن می‌شود بی‌حسی کافی است. بعد از آن،
          ممکن است دندان به سرما، گرما یا هنگام گاز گرفتن حساس شود، که معمولاً
          خفیف است. اگر درد یا حساسیت
          ادامه پیدا کرد، با کلینیک تماس بگیرید.
      - question: روکش دندان چقدر دوام دارد؟
        answer: >-
          هیچ روکشی همیشگی نیست. در مرور پژوهش‌ها، بیش از ۹۰ درصد روکش‌ها پنج
          سال بعد هنوز در دهان بودند. دوام روکش به جای دندان، جنس روکش و مراقبت
          شما بستگی دارد. مسواک زدن دو بار در روز، تمیز کردن بین دندان‌ها و
          معاینهٔ منظم به سالم ماندن آن کمک می‌کند.
      - question: آیا دندان زیر روکش هم پوسیده می‌شود؟
        answer: >-
          ممکن است. روکش خود دندان را از پوسیدگی ایمن نمی‌کند و در یک مرور
          پژوهش‌ها، پوسیدگی شایع‌ترین مشکل زیستی روکش‌ها بود. مسواک زدن دو بار
          در روز با خمیردندان فلورایددار و تمیز کردن روزانهٔ بین دندان‌ها به
          پیشگیری از پوسیدگی کمک می‌کند و معاینهٔ منظم کمک می‌کند پوسیدگی زود
          پیدا شود.
      - question: جنس روکش را چطور انتخاب کنیم؟
        answer: >-
          روکش ممکن است از فلز، سرامیک یا سرامیک روی فلز باشد. هر جنس ویژگی‌ها
          و محدودیت‌های خودش را دارد. دندانپزشک با توجه به جای دندان، نیروی
          جویدن و ظاهر آن، جنس مناسب را پیشنهاد می‌کند. انتخاب نهایی با معاینه
          و تشخیص دندانپزشک و گفت‌وگو با شماست.
      - question: اگر روکش لق شد یا افتاد چه کنم؟
        answer: >-
          لق شدن یا افتادن روکش از مشکلات شناخته‌شدهٔ روکش‌هاست. با کلینیک
          تماس بگیرید تا دندانپزشک روکش و دندان زیر آن را ببیند.
      - question: هزینهٔ روکش دندان چقدر است؟
        answer: >-
          هزینه به جنس روکش، وضعیت دندان و درمان‌هایی که پیش از آن لازم است
          بستگی دارد و پس از معاینه مشخص می‌شود. پیش از شروع کار، هزینه را از
          پذیرش بپرسید.
