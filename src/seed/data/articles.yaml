  - slug: تفاوت-روکش-زیرکونیا-و-سرامیکی
    title: تفاوت روکش زیرکونیا و سرامیکی در استحکام، ظاهر و کاربرد
    seo_title: تفاوت روکش زیرکونیا و سرامیکی
    seo_description: >-
      روکش زیرکونیا یا سرامیکی؟ تفاوت این دو جنس را در استحکام، ظاهر، کاربرد در
      دندان‌های جلو و عقب، مشکلات شایع و ماندگاری در یک جدول ساده ببینید.
    excerpt: >-
      زیرکونیا و سرامیک شیشه‌ای دو جنس پرکاربرد برای روکش‌های همرنگ دندان هستند. این
      مقاله تفاوت آن‌ها را در استحکام، ظاهر، کاربرد، مشکلات شایع و ماندگاری ساده
      توضیح می‌دهد تا با پرسش‌های روشن‌تری به معاینه بیایید.
    category: حفظ-دندان-طبیعی
    tags: [مقایسه-درمان-ها, ماندگاری-درمان]
    primary_service: crown
    is_medical: true
    body:
      - type: content
        text: |-
          روکش پوششی است که کل تاج دندان را می‌پوشاند و شکل و اندازهٔ آن را برمی‌گرداند. روکش می‌تواند دندان را محکم‌تر و ظاهرش را بهتر کند. روکش‌ها از جنس‌های مختلفی ساخته می‌شوند و این جنس‌ها در استحکام، ظاهر، دوام و هزینه با هم فرق دارند.

          اگر دندانپزشک برای دندانتان روکش پیشنهاد کرده است، شاید بپرسید روکش زیرکونیا بهتر است یا سرامیکی. این مقاله تفاوت‌ها را ساده کنار هم می‌گذارد تا با پرسش‌های روشن‌تری به معاینه بیایید. انتخاب جنس روکش با معاینه و تشخیص دندانپزشک است.

          ## روکش برای چه دندانی لازم می‌شود؟
          [روکش دندان](/خدمات/روکش-دندان) ممکن است در این حالت‌ها لازم شود:
          - دندان پرکردگی بزرگی دارد و بافت سالم کافی برای نگه داشتن پرکردگی نمانده است.
          - دندان ضعیف است و ممکن است بشکند، یا شکسته، پوسیده یا آسیب‌دیده است.
          - رنگ دندان تغییر کرده یا فرم آن نامناسب است.
          - روی ایمپلنت دندان، روکش جای تاج دندان را می‌گیرد.

          برای گذاشتن روکش، دندان تراش داده می‌شود تا روکش روی آن بنشیند. ساختن روکش در لابراتوار دندان‌سازی زمان می‌برد؛ برای همین ممکن است تا آماده شدن آن، روکش موقت روی دندان بگذارند.

          ## «روکش سرامیکی» دقیقاً یعنی چه؟
          در دندانپزشکی، پرسلن، سرامیک‌های شیشه‌ای و زیرکونیا همه از خانوادهٔ سرامیک‌ها هستند. پس زیرکونیا هم نوعی سرامیک است و عبارت «روکش سرامیکی» ممکن است برای چند نوع روکش به کار برود. در این مقاله، این سه نام را این‌طور به کار می‌بریم:
          - زیرکونیا: سرامیکی سفیدرنگ و بسیار محکم. روکش زیرکونیا ممکن است یکپارچه باشد، یعنی تمامش از زیرکونیا ساخته شود. ممکن است لایه‌دار هم باشد، یعنی پایه‌ای از زیرکونیا که رویش لایه‌ای از پرسلن یا سرامیک شیشه‌ای می‌گذارند.
          - سرامیک شیشه‌ای: پرسلن و سرامیک‌هایی مثل لیتیوم دی‌سیلیکات که در ساختارشان شیشه دارند و از زیرکونیا شفاف‌ترند.
          - متال‌سرامیک: روکشی با پایهٔ فلزی که روی آن پرسلن قرار می‌گیرد.

          روکش زیرکونیا و روکش سرامیک شیشه‌ای هر دو تمام‌سرامیک‌اند، یعنی فلز ندارند.
      - type: table
        caption: مقایسهٔ کلی روکش زیرکونیا و روکش سرامیک شیشه‌ای
        head: [ویژگی, زیرکونیا, سرامیک شیشه‌ای]
        rows:
          - [
              استحکام,
              استحکام بسیار زیادی دارد,
              کمتر از زیرکونیا؛ لیتیوم دی‌سیلیکات از بقیهٔ سرامیک‌های شیشه‌ای محکم‌تر است,
            ]
          - [
              ظاهر,
              سفید و کدرتر؛ برای ظاهر طبیعی‌تر گاهی رویش لایهٔ پرسلن می‌گذارند. انواع شفاف‌تر زیرکونیا استحکام کمتری دارند,
              شفاف‌تر؛ لیتیوم دی‌سیلیکات از هر نوع زیرکونیا شفاف‌تر است,
            ]
          - [
              کاربرد رایج,
              در یک نظرسنجی انجمن دندانپزشکی آمریکا از دندانپزشکان، بیشتر آن‌ها برای روکش دندان‌های عقب از آن استفاده می‌کردند؛ برای دندان‌های جلو هم به کار می‌رود,
              بیشتر برای دندان‌های جلو؛ لیتیوم دی‌سیلیکات در دندان‌های عقب هم به کار رفته است,
            ]
          - [
              مشکلات شایع,
              لب‌پریدگی و شکستن، بیشتر در نوع لایه‌دار؛ جدا شدن روکش از دندان هم گزارش شده است,
              شکستن و لب‌پریدگی,
            ]
          - [
              در دندان‌های عقب,
              در یک مرور نظام‌مند، ماندگاری آن در دندان‌های عقب کمتر از دندان‌های جلو بود,
              پرسلن در دندان‌های عقب ماندگاری کمتری داشت؛ در لیتیوم دی‌سیلیکات تفاوت معناداری میان جلو و عقب دیده نشد,
            ]
          - [
              ماندگاری در پژوهش‌ها,
              تا ۵ سال در محدودهٔ روکش‌های پرسلنی و متال‌سرامیک بوده است؛ شواهد بلندمدت کم است,
              در یک مرور نظام‌مند، ماندگاری ۵ سالهٔ روکش‌های لیتیوم دی‌سیلیکات شبیه روکش‌های متال‌سرامیک بود؛ پرسلن‌های ضعیف‌تر ماندگاری کمتری داشتند,
            ]
          - [
              سازگاری با بدن,
              سازگاری زیادی با بدن دارد و در منابع با حساسیت یا آلرژی مرتبط دانسته نشده است,
              سازگاری زیادی با بدن دارد,
            ]
      - type: callout
        tone: info
        text: این مقاله اطلاعات کلی دربارهٔ جنس روکش‌ها می‌دهد و جای معاینه را نمی‌گیرد. انتخاب جنس روکش با معاینه و تشخیص دندانپزشک است. جنس روکش پیشنهادی را از دندانپزشک و هزینهٔ آن را پیش از شروع کار از پذیرش بپرسید.
      - type: content
        text: |-
          ## کدام جنس برای کدام دندان؟
          جنس‌های روکش در ترکیب، استحکام، روش ساخت و کاربرد با هم فرق دارند. دندانپزشک این تفاوت‌ها را کنار وضعیت دندان شما می‌گذارد و بعد جنس مناسب را پیشنهاد می‌کند. چند نکتهٔ کلی:
          - دندان‌های عقب: در پژوهش‌ها، روکش‌های تمام‌سرامیک در دندان‌های عقب، به‌ویژه آسیاها، بیشتر از دندان‌های جلو شکسته‌اند. برای همین استحکام جنس روکش در این دندان‌ها اهمیت بیشتری دارد.
          - دندان‌های جلو: سرامیک شیشه‌ای از زیرکونیا شفاف‌تر است. پرسلن‌های ضعیف‌تر بهتر است فقط در دندان‌های جلو به کار بروند.
          - دندان مقابل: سرامیک‌ها سخت‌اند و ممکن است دندان مقابل را بسایند. در پژوهش‌ها، سطح صاف و پرداخت‌شدهٔ زیرکونیا دندان مقابل را کمتر از پرسلن روکش‌های متال‌سرامیک ساییده است. این نکته هم در انتخاب جنس اثر دارد.

          ## روکش متال‌سرامیک چه تفاوتی دارد؟
          در روکش متال‌سرامیک، پایهٔ فلزی به پرسلن رویی استحکام می‌دهد. در یک مرور نظام‌مند، ماندگاری ۵ سالهٔ بیشتر انواع روکش تمام‌سرامیک شبیه روکش‌های متال‌سرامیک بود. پرسلن‌های ضعیف‌تر ماندگاری کمتری داشتند. در همان مرور، روکش‌های زیرکونیا بیشتر از روکش‌های متال‌سرامیک به‌خاطر شکستن لایهٔ سرامیک رویی از دست رفتند و بیشتر از جای خود جدا شدند. نویسندگان این مرور نتیجه گرفتند که روکش زیرکونیا به‌خاطر مشکلات فنی زیاد نباید انتخاب اول باشد. این مرور پژوهش‌های منتشرشده تا سال ۲۰۱۳ را بررسی کرد. در دو گزارش ۵ سالهٔ بعدی از لابراتوارهای دندان‌سازی، روکش زیرکونیای یکپارچه کمتر از نوع لایه‌دار شکسته بود.

          بیشتر واکنش‌های حساسیتی به روکش‌ها از فلزهای غیرقیمتی است و نیکل یکی از شایع‌ترین عامل‌های حساسیت است. اگر به فلزی مثل نیکل حساسیت دارید، پیش از درمان به دندانپزشک بگویید.

          ## عددهای ماندگاری را چطور بخوانید؟
          در صفحهٔ اطلاعات علمی انجمن دندانپزشکی آمریکا آمده است که زیرکونیا هنوز جنسی در حال پیشرفت است و شواهد ماندگاری بلندمدت آن کم است. در پژوهش‌های مختلف، حدود ۹۱ تا ۹۹ درصد روکش‌های زیرکونیا پس از ۵ سال هنوز در دهان بودند. در یک پژوهش، این عدد پس از ۱۰ سال به حدود ۶۷ درصد رسید و در دندان‌های آسیا تا حدود ۳۹ درصد پایین آمد.

          برای لیتیوم دی‌سیلیکات، در یک پژوهش کوچک روی ۱۰۴ روکش، حدود ۹۷ درصد روکش‌ها پس از ۵ سال و حدود ۹۵ درصد پس از ۸ سال هنوز در دهان بودند. شایع‌ترین مشکل روکش‌های تمام‌سرامیک، شکستن و لب‌پریدگی بوده است.

          این عددها از پژوهش‌های مختلف آمده‌اند و نمی‌شود آن‌ها را مستقیم با هم مقایسه کرد. آن‌ها نتیجهٔ همان پژوهش‌ها هستند، نه قولی دربارهٔ دندان شما.

          ماندگاری روکش فقط به جنس آن بستگی ندارد و عامل‌های دیگری هم در آن اثر دارند. برای هر نوع روکش، دندان تراش داده می‌شود و بخشی از بافت آن برداشته می‌شود. خطرهای روکش، مثل پوسیدگی دور لبهٔ روکش، حساسیت بعد از درمان و آسیب عصب دندان، در صفحهٔ [روکش دندان](/خدمات/روکش-دندان) آمده است.

          ## مراقبت بعد از گذاشتن روکش
          از دندان روکش‌شده هم مثل بقیهٔ دندان‌ها مراقبت کنید:
          - روزی دو بار با مسواک نرم و خمیردندان فلورایددار مسواک بزنید.
          - روزی یک بار بین دندان‌ها را با نخ دندان، برس‌های کوچک بین‌دندانی یا دستگاه شست‌وشوی بین دندان با آب (واترفلاسر) تمیز کنید.
          - برای معاینهٔ دوره‌ای به دندانپزشک مراجعه کنید.
          - اگر روکش لب پرید، ترک خورد، لق شد یا افتاد، با کلینیک تماس بگیرید.

          برای نکته‌های بیشتر، از جمله مراقبت از روکش موقت، [راهنمای مراقبت بعد از درمان](/راهنمای-بیمار/مراقبت-بعد-از-درمان) را بخوانید. اگر بار اول است که به کلینیک می‌آیید، [راهنمای اولین مراجعه](/راهنمای-بیمار/اولین-مراجعه) را بخوانید تا بدانید در معاینه چه پیش می‌آید.
    faqs:
      - question: روکش زیرکونیا بهتر است یا سرامیکی؟
        answer: >-
          هیچ‌کدام برای همهٔ دندان‌ها بهتر نیست. زیرکونیا استحکام بیشتری دارد و بیشتر
          برای دندان‌های عقب به کار رفته است. در یک مرور نظام‌مند، ماندگاری روکش
          زیرکونیا در دندان‌های عقب کمتر از دندان‌های جلو بود. هر دو جنس ممکن است لب
          بپرند یا بشکنند. سرامیک شیشه‌ای شفاف‌تر است و بیشتر برای دندان‌های جلو به کار
          می‌رود. انتخاب با معاینه و تشخیص دندانپزشک است.
      - question: آیا روکش زیرکونیا طبیعی به نظر می‌رسد؟
        answer: >-
          زیرکونیا سفیدرنگ است، اما از سرامیک شیشه‌ای کدرتر است. برای ظاهر طبیعی‌تر،
          گاهی روی پایهٔ زیرکونیا لایه‌ای از پرسلن یا سرامیک شیشه‌ای می‌گذارند.
          انواع شفاف‌تر زیرکونیا هم هست، اما استحکام کمتری دارند.
      - question: آیا روکش زیرکونیا می‌شکند؟
        answer: >-
          ممکن است. در پژوهش‌ها، لب‌پریدگی و شکستن از مشکلات شایع روکش زیرکونیا بوده و
          در نوع لایه‌دار بیشتر گزارش شده است. در یک نظرسنجی، حدود نیمی از دندانپزشکان
          جدا شدن روکش از دندان را شایع‌ترین مشکل روکش زیرکونیا دانستند. اگر روکش لب
          پرید، شکست یا لق شد، با کلینیک تماس بگیرید.
      - question: آیا ممکن است به جنس روکش حساسیت داشته باشم؟
        answer: >-
          واکنش به جنس‌های دندانی کم است. سرامیک‌های دندانی سازگاری زیادی با بدن دارند
          و زیرکونیا در منابع با حساسیت یا آلرژی مرتبط دانسته نشده است. بیشتر واکنش‌ها
          به روکش‌ها از فلزهای غیرقیمتی است. اگر به فلزی مثل نیکل حساسیت دارید، پیش از
          درمان به دندانپزشک بگویید.
