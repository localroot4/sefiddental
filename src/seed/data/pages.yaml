  - key: guide-aftercare
    slug: مراقبت-بعد-از-درمان
    title: مراقبت‌های بعد از درمان
    seo_title: مراقبت بعد از درمان دندان
    seo_description: >-
      مراقبت بعد از درمان دندان: نکته‌های کلی بعد از ترمیم، درمان ریشه، کشیدن دندان،
      جرم‌گیری، روکش و لمینت؛ چه چیزی طبیعی است و چه زمانی با کلینیک تماس بگیرید.
    lead: نکته‌های کلی مراقبت بعد از درمان‌های رایج. دستور دندانپزشک خودتان همیشه مقدم است.
    blocks:
      - type: content
        text: |-
          این راهنما نکته‌های کلی مراقبت بعد از درمان‌های رایج دندانپزشکی را توضیح می‌دهد. دستوری که دندانپزشک خودتان بعد از درمان می‌دهد همیشه مقدم است. اگر با این نکته‌ها فرق داشت، دستور دندانپزشک را دنبال کنید. اگر دستوری را فراموش کردید یا مطمئن نیستید، با کلینیک تماس بگیرید.

          بیشتر این درمان‌ها با بی‌حسی موضعی انجام می‌شوند. بعد از آن، ممکن است تا چند ساعت فک و صورت بی‌حس بماند و هنگام رفتن بی‌حسی، کمی گزگز حس کنید. تا بی‌حسی کامل از بین نرفته است، غذا نجوید و نوشیدنی داغ ننوشید، چون ممکن است لب، گونه یا زبانتان را گاز بگیرید یا بسوزانید و متوجه نشوید. اگر کودکتان درمان شده است، مراقب باشید لب یا گونهٔ بی‌حسش را نجود.

          ## ترمیم دندان (پر کردن)
          بعد از ترمیم، این نکته‌ها را رعایت کنید:
          - اگر دندان ترمیم‌شده به سرما یا گرما حساس بود، به دندانپزشک بگویید. حساسیت دلیل‌های مختلفی دارد و درمانش به دلیل آن بستگی دارد.
          - اگر درد دندان بیش از دو روز ماند، با مسکن آرام نشد یا هنگام گاز گرفتن درد داشتید، با کلینیک تماس بگیرید.
          - اگر ترمیم لق شد یا شکست، با کلینیک تماس بگیرید.
          - روزی دو بار با خمیردندان فلورایددار مسواک بزنید، هر روز با نخ دندان بین دندان‌ها را تمیز کنید و برای معاینه‌های دوره‌ای بیایید.

          دربارهٔ خود این درمان، صفحهٔ [ترمیم دندان](/خدمات/ترمیم-دندان) را بخوانید.

          ## درمان ریشه (عصب‌کشی)
          بعد از درمان ریشه، این نکته‌ها را رعایت کنید:
          - دندان و اطراف آن ممکن است چند روز حساس باشد. اگر اطراف دندان کمی متورم و دردناک است، معمولاً طی حدود دو هفته بهتر می‌شود.
          - اگر درد دارید، مسکنی مثل استامینوفن یا ایبوپروفن را طبق مقدار روی بسته بخورید. ایبوپروفن برای همه مناسب نیست؛ اگر باردارید، آسم یا زخم معده دارید، بیماری کلیه، کبد یا قلب دارید یا داروی رقیق‌کنندهٔ خون مصرف می‌کنید، پیش از مصرف از پزشک یا داروساز بپرسید. دربارهٔ راه‌های کم کردن ناراحتی با دندانپزشک صحبت کنید.
          - اگر دندانپزشک آنتی‌بیوتیک داده است، آن را طبق دستور مصرف کنید و اگر با مصرف آن مشکلی داشتید، به دندانپزشک خبر دهید.
          - مراقب باشید ضربه‌ای به دهانتان نخورد. دندانی که درمان ریشه شده ممکن است از دندان سالم ضعیف‌تر باشد؛ تا گذاشتن ترمیم دائم یا روکش، با آن دندان چیز سفت نجوید.
          - روی دندان ممکن است ترمیم موقت باشد. ترمیم دائم یا روکش را هر چه زودتر، در نوبتی که دندانپزشک می‌دهد، انجام دهید تا دندان از آسیب بیشتر محافظت شود. جلسه‌های پیگیری را از دست ندهید.
          - اگر درد یا ورم با مسکن آرام نشد یا به‌جای کم شدن بیشتر شد، با کلینیک تماس بگیرید.

          دربارهٔ مراحل این درمان، صفحهٔ [درمان ریشه](/خدمات/درمان-ریشه) را بخوانید.

          ## کشیدن دندان
          بعد از کشیدن دندان، کمی خونریزی طبیعی است. در جای دندان لخته‌ای از خون تشکیل می‌شود که به بهبود زخم کمک می‌کند. از هر کاری که جلوی بهبود طبیعی را بگیرد دوری کنید. این قدم‌ها کمک می‌کنند:
      - type: steps
        items:
          - title: خونریزی را با فشار کنترل کنید
            text: >-
              اگر محل کشیدن خونریزی داشت، یک پارچهٔ تمیز یا پنبه را دست‌کم ۱۰ دقیقه
              روی آن فشار دهید.
          - title: از لخته محافظت کنید
            text: >-
              دهان را با فشار نشویید، سیگار نکشید و تا ۲۴ ساعت با نی ننوشید. اگر در چند روز
              اول لازم شد دهان را بشویید، آرام بشویید؛ مثلاً با آب نمک ولرم.
          - title: غذای نرم بخورید
            text: >-
              رژیمی را که دندانپزشک گفته است دنبال کنید. تا وقتی جویدن راحت شود، غذای نرم
              یا مایع بخورید. غذای سفت و ترد، آجیل و دانه‌ها را نخورید و نوشیدنی الکلی یا
              خیلی داغ ننوشید.
          - title: بقیهٔ دندان‌ها را تمیز نگه دارید
            text: >-
              دندان‌های دیگر را مثل همیشه مسواک بزنید و نخ بکشید. در روزهای اول، طبق دستور
              دندانپزشک، دندان‌های کنار محل کشیدن را تمیز نکنید تا به لخته آسیب نرسد.
          - title: ورم و درد را جدی بگیرید
            text: >-
              اگر صورتتان ورم کرد، پارچهٔ سرد یا کیسهٔ یخ روی آن بگذارید و زود به کلینیک
              خبر دهید. دربارهٔ مسکن مناسب از دندانپزشک بپرسید.
      - type: content
        text: |-
          گاهی لختهٔ جای دندان درست تشکیل نمی‌شود یا پیش از بهبود لثه از جای خود جدا می‌شود و استخوان و عصب زیر آن بی‌پوشش می‌ماند. به این حالت دردناک «خشکی حفره» می‌گویند. اگر درد بعد از کشیدن دندان به‌جای کم شدن شدیدتر شد، با کلینیک تماس بگیرید. درمان ممکن است شامل تمیز کردن محل و گذاشتن پانسمان دارویی باشد. سیگار و دخانیات بهبود زخم را کند می‌کنند و خطر عفونت را بیشتر می‌کنند.

          دربارهٔ خود این درمان، صفحهٔ [کشیدن دندان](/خدمات/کشیدن-دندان) را بخوانید.

          ## جرم‌گیری
          در جرم‌گیری، پلاک و جرمی که روی دندان‌ها جمع شده است با دقت تمیز می‌شود. بعد از آن ممکن است دندان‌ها مدتی به سرما و گرما حساس باشند. اگر جرم‌گیری عمیق زیر لثه هم انجام شده باشد، ممکن است یکی دو روز درد داشته باشید و دندان‌ها تا حدود یک هفته حساس باشند. لثه هم ممکن است متورم و حساس باشد و خون بیاید.
          - اگر دندانپزشک قرص یا دهان‌شویه داده است، طبق دستور مصرف کنید.
          - دست‌کم روزی دو بار با مسواک نرم و خمیردندان فلورایددار مسواک بزنید. بعد از مسواک، کف خمیردندان را تف کنید و دهان را با آب نشویید.
          - هر روز بین دندان‌ها را با نخ دندان یا مسواک بین‌دندانی تمیز کنید.
          - سیگار نکشید.
          - اگر دندانپزشک برای بررسی لثه نوبت بعدی داده است، به آن بیایید.

          دربارهٔ خود این درمان، صفحهٔ [جرم‌گیری](/خدمات/جرم-گیری) را بخوانید.

          ## روکش و لمینت
          ساختن روکش دائم زمان می‌برد؛ برای همین ممکن است تا آماده شدن آن، روکش موقت داشته باشید. دربارهٔ غذا خوردن با روکش موقت، دستور دندانپزشک را دنبال کنید. اگر روکش موقت یا دائم لق شد یا افتاد، با کلینیک تماس بگیرید. از دندان روکش‌شده هم مثل بقیهٔ دندان‌ها مراقبت کنید: روزی دو بار مسواک با خمیردندان فلورایددار، تمیز کردن روزانهٔ بین دندان‌ها و معاینهٔ دوره‌ای.

          عادت کردن به لمینت ممکن است چند روز طول بکشد. اگر بعد از گذاشتن لمینت، دندان‌ها هنگام بستن دهان درست روی هم ننشستند، به دندانپزشک بگویید تا آن را اصلاح کند. برای مراقبت از لمینت:
          - ناخن نجوید و اشیا یا خوراکی‌های سفت را گاز نزنید.
          - در ورزش یا کاری که ممکن است به دهان ضربه بزند، محافظ دهان بگذارید.
          - چای، قهوه و خوراکی‌های رنگی ممکن است رنگ لمینت را تغییر دهند؛ در مصرف آن‌ها احتیاط کنید.
          - روزی دو بار با خمیردندان فلورایددار مسواک بزنید و هر روز بین دندان‌ها را تمیز کنید. زیر لمینت یا اطراف آن هم ممکن است پوسیدگی ایجاد شود.
          - لمینت ممکن است با گذشت زمان لب‌پر شود، ترک بخورد، ساییده یا لق شود. در این صورت با کلینیک تماس بگیرید تا دندانپزشک آن را دوباره بچسباند، تعمیر یا تعویض کند.

          دربارهٔ این درمان‌ها، صفحه‌های [روکش دندان](/خدمات/روکش-دندان)، [لمینت سرامیکی](/خدمات/لمینت-سرامیکی) و [کامپوزیت دندان](/خدمات/کامپوزیت-دندان) را بخوانید.

          ## چه زمانی با کلینیک تماس بگیرید؟
          بعد از درمان، در این حالت‌ها با کلینیک تماس بگیرید:
          - خونریزی کم بعد از کشیدن دندان با فشار بند نمی‌آید و ادامه دارد.
          - درد یا ورم شدید است یا به‌جای کم شدن بیشتر می‌شود و مسکن کمکی نمی‌کند.
          - درد با مزهٔ بد در دهان، تب یا احساس ناخوشی همراه است.
          - ترمیم، روکش (موقت یا دائم) یا لمینت لق شده، افتاده یا شکسته است.
          - بی‌حسی یا گزگز لب، چانه یا زبان ساعت‌ها بعد از درمان هنوز از بین نرفته است.

          اگر ورم صورت به چشم یا گردن رسیده است، حرف زدن یا باز کردن دهان سخت شده است، یا خونریزی دهان زیاد است و با ۱۵ دقیقه فشار مداوم بند نمی‌آید، منتظر تماس با کلینیک نمانید و به اورژانس نزدیک‌ترین بیمارستان بروید. اگر ورم با تب، لرز یا حال عمومی بد همراه است، همین امروز باید معاینه شوید؛ اگر کلینیک بسته است، به اورژانس بیمارستان بروید.

          اگر درد شدید دارید، صفحهٔ [درد شدید دندان دارید؟](/اورژانس) را ببینید.
      - type: callout
        tone: warning
        text: اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید.
      - type: faq
        items:
          - question: دستور دندانپزشک با این راهنما فرق دارد؛ کدام را انجام دهم؟
            answer: >-
              دستور دندانپزشک خودتان را. او درمان شما و وضعیت دهانتان را می‌شناسد و این
              راهنما فقط نکته‌های کلی است. اگر دستوری را فراموش کردید یا مطمئن نیستید، با
              کلینیک تماس بگیرید.
          - question: بعد از درمان کی می‌توانم غذا بخورم؟
            answer: >-
              وقتی بی‌حسی کامل از بین رفت. تا آن موقع غذا نجوید و نوشیدنی داغ ننوشید، چون
              ممکن است لب، گونه یا زبانتان را گاز بگیرید یا بسوزانید و متوجه نشوید. بعد از
              کشیدن دندان، رژیمی را که دندانپزشک گفته است دنبال کنید و تا وقتی جویدن راحت
              شود، غذای نرم بخورید.
          - question: بعد از کشیدن دندان می‌توانم سیگار بکشم؟
            answer: >-
              نه. در دورهٔ بهبود سیگار نکشید. سیگار خطر عفونت را بیشتر می‌کند و بهبود زخم را
              کند می‌کند. دربارهٔ مدت آن از دندانپزشک بپرسید.
          - question: درد و حساسیت بعد از درمان طبیعی است؟
            answer: >-
              بعد از بعضی درمان‌ها ممکن است کمی درد یا حساسیت پیش بیاید. بعد از درمان ریشه،
              دندان ممکن است چند روز حساس باشد. بعد از جرم‌گیری هم دندان‌ها ممکن است مدتی
              حساس باشند و بعد از جرم‌گیری عمیق زیر لثه، این حساسیت ممکن است تا حدود یک هفته
              بماند. اگر درد به‌جای کم شدن بیشتر شد یا با مسکن آرام نشد، با
              کلینیک تماس بگیرید.
          - question: برای درد بعد از درمان چه مسکنی بخورم؟
            answer: >-
              مسکن‌هایی مثل استامینوفن یا ایبوپروفن معمولاً به کار می‌روند. مقدار روی بسته را
              رعایت کنید؛ مقدار بیشتر اثر بهتری ندارد و می‌تواند خطرناک باشد. ایبوپروفن برای
              همه مناسب نیست، از جمله در بارداری، آسم، زخم معده، بیماری کلیه، کبد یا قلب و
              مصرف داروی رقیق‌کنندهٔ خون؛ در این حالت‌ها یا اگر مطمئن نیستید، از دندانپزشک یا
              داروساز بپرسید. به کودکان زیر ۱۶ سال آسپرین ندهید.
