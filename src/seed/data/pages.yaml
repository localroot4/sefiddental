  - key: guide-dental-fear
    slug: ترس-از-دندانپزشکی
    title: ترس از دندانپزشکی و راه‌های کنترل آن
    seo_title: ترس از دندانپزشکی
    seo_description: >-
      ترس از دندانپزشکی رایج است و راه کنترل دارد. بخوانید پیش از نوبت به پذیرش چه
      بگویید، چطور برای توقف علامتی قرار بگذارید و با تنفس آرام استرس را کم کنید.
    lead: >-
      اگر از دندانپزشکی می‌ترسید، تنها نیستید. این راهنما می‌گوید چه چیزهایی
      کمک می‌کند و پیش از نوبت به پذیرش چه بگویید.
    # Phase 6 copy (G2): general strategies from the sources below. No sedation or nitrous-oxide
    # line until the clinic answers (gap 59), and no promise of a longer or talk-only first visit.
    blocks:
      - type: content
        text: |-
          ترس از دندانپزشکی رایج است. بعضی‌ها از درد می‌ترسند، بعضی از صدای دستگاه‌ها و بعضی از یک تجربهٔ بد قبلی. این ترس ممکن است پیش از نوبت، در طول درمان یا بعد از آن پیدا شود. دلیلش هر چه باشد، وقتی دندانپزشک آن را بداند، بهتر می‌تواند کار را با شرایط شما هماهنگ کند.

          ## چرا نوبت را عقب نیندازید؟
          ترس گاهی باعث می‌شود مراجعه را عقب بیندازید. هرچه مراجعه دیرتر شود، خطر مشکلات دندانی بیشتر می‌شود و نوبت‌های بعدی هم سخت‌تر می‌شوند. معاینهٔ منظم کمک می‌کند مشکل زود پیدا شود، وقتی درمانش معمولاً ساده‌تر است.

          اگر درد شدید یا ورم دارید، منتظر کم شدن ترس نمانید و صفحهٔ [درد شدید دندان](/اورژانس) را ببینید. اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید.

          ## پیش از نوبت به پذیرش چه بگویید؟
          وقتی نوبت می‌گیرید، به پذیرش بگویید که از دندانپزشکی می‌ترسید. اگر با فرم سایت نوبت می‌گیرید، «توضیح بیشتر» را باز کنید و آن را همان‌جا بنویسید. این‌ها را هم بگویید:
          - چه چیزی بیشتر نگرانتان می‌کند: درد، آمپول بی‌حسی، صدای دستگاه یا چیز دیگر
          - اگر قبلاً در دندانپزشکی تجربهٔ بدی داشته‌اید
          - اگر می‌خواهید پیش از هر کار، دربارهٔ آن توضیح بشنوید

          روز نوبت، ترستان را دوباره به دندانپزشک یادآوری کنید. از او بپرسید چه روش‌هایی برای کنار آمدن با ترس پیشنهاد می‌کند.
      - type: steps
        items:
          - title: چند روز پیش از نوبت
            text: >-
              هر روز دست‌کم پنج دقیقه تنفس آرام را تمرین کنید. نفس را آرام از بینی
              بکشید و آرام از دهان بیرون بدهید. اگر کمک می‌کند، در دم و بازدم تا پنج
              بشمارید. به خودتان فشار نیاورید. این تمرین اگر مرتب انجام شود، بیشترین
              فایده را دارد.
          - title: در سالن انتظار
            text: >-
              نفس‌هایتان را بشمارید. آرام دم بگیرید و تا پنج بشمارید؛ بعد آرام بازدم
              کنید و باز تا پنج بشمارید. این کار را پنج بار تکرار کنید.
          - title: پیش از شروع کار
            text: >-
              با دندانپزشک برای توقف یک علامت قرار بگذارید، مثلاً بالا بردن دست. پیش از
              شروع، آن را یک بار تمرین کنید. وقتی وسیله در دهانتان است، فقط دستتان را
              بالا ببرید و سرتان را ناگهان تکان ندهید. اگر می‌خواهید بدانید چه کاری
              انجام می‌شود، بپرسید؛ گاهی دانستن آن، ترس از ناشناخته را کم می‌کند.
          - title: در طول درمان
            text: >-
              اگر با وجود بی‌حسی درد حس کردید، به دندانپزشک بگویید. در استراحت‌های
              کوتاه، دوباره نفس‌هایتان را بشمارید.
      - type: content
        text: |-
          ## چه چیزهای دیگری کمک می‌کند؟
          - هدفون: اگر صدای دستگاه‌ها آزارتان می‌دهد، هدفون بیاورید و موسیقی یا کتاب صوتی گوش کنید. پیش از شروع، با دندانپزشک هماهنگ کنید.
          - مشغول کردن دست‌ها: یک توپ ضداسترس یا شیء کوچک دیگری را در دست فشار دهید.
          - تصور یک جای آرام: خودتان را در جایی آرام، مثل ساحل یا باغ، تصور کنید.
          - شل کردن عضله‌ها: بدن را بخش‌به‌بخش شل کنید؛ از پیشانی شروع کنید، بعد گونه‌ها و گردن، و تا انگشت‌های پا پایین بروید.

          ## اگر ترس خیلی شدید است
          ترس خیلی شدید از دندانپزشکی می‌تواند نوعی فوبیا باشد. فوبیا ممکن است با اضطراب شدید، سرگیجه، تپش قلب، تنگی قفسهٔ سینه یا لرزش همراه باشد.

          روش‌های رفتاری، مثل آشنا شدن قدم‌به‌قدم با محیط و کار دندانپزشکی، از راه‌های شناخته‌شدهٔ کنترل ترس از دندانپزشکی هستند. این روش‌ها عارضه‌ای ندارند یا عارضهٔ آن‌ها ناچیز است. این‌که کدام روش برای شما مناسب است، به شدت ترس، شرایط شما و نوع درمان بستگی دارد. یکی از این روش‌ها «بگو، نشان بده، انجام بده» است: در این روش، دندانپزشک پیش از هر کار می‌گوید چه می‌کند، وسیله را نشان می‌دهد تا با صدا و حس آن آشنا شوید و بعد کار را انجام می‌دهد. از دندانپزشک بپرسید آیا می‌شود کار را از مرحله‌های ساده‌تر شروع کرد و قدم‌به‌قدم، در چند جلسه، پیش برد.

          اگر ترس، درمان دندان‌ها یا زندگی روزمره‌تان را مختل کرده است، با پزشک یا روان‌شناس هم صحبت کنید. روان‌درمانی، مثل درمان شناختی‌رفتاری، برای کنترل فوبیا به کار می‌رود. اگر این روش‌ها برای شما کافی نبود، از دندانپزشک بپرسید چه راه‌های دیگری برای درمان شما وجود دارد.
      - type: faq
        items:
          - question: ترس از دندانپزشکی طبیعی است؟
            answer: >-
              بله، این ترس رایج است. ممکن است پیش از نوبت، در طول درمان یا بعد از آن
              پیدا شود. آن را به دندانپزشک بگویید؛ وقتی نگرانی شما را بداند، بهتر
              می‌تواند کار را با شرایط شما هماهنگ کند.
          - question: پیش از نوبت به پذیرش چه بگویم؟
            answer: >-
              بگویید که از دندانپزشکی می‌ترسید و چه چیزی بیشتر نگرانتان می‌کند. اگر
              تجربهٔ بدی داشته‌اید، آن را هم بگویید. روز نوبت، دوباره به دندانپزشک
              یادآوری کنید.
          - question: اگر وسط کار به استراحت نیاز داشتم، چه کنم؟
            answer: >-
              پیش از شروع، با دندانپزشک برای توقف یک علامت قرار بگذارید، مثلاً بالا بردن
              دست، و آن را یک بار تمرین کنید. هر وقت به استراحت نیاز داشتید، همین علامت
              را نشان بدهید.
          - question: از درد می‌ترسم؛ چه کنم؟
            answer: >-
              پیش از شروع کار، دربارهٔ درد با دندانپزشک صحبت کنید تا بداند چطور با شما
              هماهنگ شود. اگر با وجود بی‌حسی درد حس کردید، خجالت نکشید و بگویید.
          - question: تمرین تنفس واقعاً کمک می‌کند؟
            answer: >-
              تنفس آرام و عمیق به شل شدن عضله‌ها کمک می‌کند و یکی از روش‌های آرام کردن
              خود در استرس و اضطراب است. اگر آن را مرتب تمرین کنید، بیشترین فایده را
              دارد.
          - question: اگر ترسم خیلی شدید باشد چه؟
            answer: >-
              اگر ترس، درمان دندان‌ها یا زندگی روزمره‌تان را مختل کرده است، با پزشک یا
              روان‌شناس صحبت کنید. روان‌درمانی، مثل درمان شناختی‌رفتاری، برای کنترل
              فوبیا به کار می‌رود. با دندانپزشک هم دربارهٔ شروع قدم‌به‌قدم صحبت کنید. اگر
              این روش‌ها برای شما کافی نبود، از دندانپزشک بپرسید چه راه‌های دیگری برای
              درمان شما وجود دارد.
