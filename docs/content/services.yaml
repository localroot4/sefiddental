  - key: orthodontics
    category: orthodontics
    nav_label: ارتودنسی
    h1: ارتودنسی
    seo_title: ارتودنسی کودکان و بزرگسالان
    slug: ارتودنسی
    booking_group: ortho
    priority: 2
    search_terms: [ارتودنسی, ارتودنسی بزرگسالان, قیمت ارتودنسی, ارتودنسی جنوب تهران, ارتودنسی ثابت]
    summary: مرتب کردن دندان‌ها و اصلاح جفت شدن آن‌ها، برای کودکان و بزرگسالان.
    seo_description: >-
      ارتودنسی کودکان و بزرگسالان در کلینیک دندانپزشکی سفید: برای چه کسی
      مناسب است، مراحل و مدت معمول ارتودنسی ثابت، مراقبت از براکت، خطرها و
      نگهدارنده.
    sessions: جلسه‌های کنترل معمولاً هر ۶ تا ۸ هفته
    duration: ارتودنسی ثابت معمولاً یک تا دو سال
    recovery: درد دندان‌ها معمولاً چند روز پس از نصب یا تنظیم
    related: [diastema, pediatric, scaling]
    body:
      - type: content
        text: |-
          ## ارتودنسی چیست؟
          ارتودنسی دندان‌های نامرتب را مرتب و جفت شدن دندان‌های بالا و پایین را اصلاح می‌کند. هدف آن یک جفت شدن سالم است: دندان‌های مرتبی که درست روی دندان‌های فک مقابل قرار می‌گیرند و گاز گرفتن، جویدن و صحبت کردن را راحت‌تر می‌کنند.

          ## برای چه کسی مناسب است؟
          - دندان‌هایی که خیلی به هم فشرده‌اند یا بیرون زده‌اند
          - فاصلهٔ زیاد بین دندان‌ها
          - دندان‌های بالا و پایینی که درست روی هم قرار نمی‌گیرند
          - وقتی جای دندان‌ها جویدن یا تمیز کردن آن‌ها را سخت کرده است

          ارتودنسی فقط برای کودکان و نوجوانان نیست و بزرگسالان هم ارتودنسی می‌کنند. در کودکان، بیشتر درمان‌ها بعد از رویش دندان‌های دائمی شروع می‌شود، ولی بعضی مشکلات زودتر بررسی می‌شوند. برای نمونه، دندان‌های جلوی بالا که بیرون زده‌اند بیشتر در معرض ضربه و آسیب‌اند. درمان زودتر، حدود ۷ تا ۱۱ سالگی، می‌تواند این آسیب را کم کند، اما معمولاً در نوجوانی مرحلهٔ دوم درمان هم لازم است و جز این، مزیت دیگری بر درمان در نوجوانی ندارد.

          ## دستگاه ارتودنسی چگونه کار می‌کند؟
          در ارتودنسی ثابت، براکت‌های کوچکی روی دندان‌ها چسبانده می‌شوند و یک سیم آن‌ها را به هم وصل می‌کند. سیم فشار کمی به دندان‌ها می‌آورد و آن‌ها را به‌مرور جابه‌جا می‌کند. براکت‌ها تا پایان درمان روی دندان می‌مانند.

          دستگاه متحرک را خود بیمار درمی‌آورد و دوباره می‌گذارد. این دستگاه‌ها برای بعضی مشکلات، به‌خصوص در کودکانی که هنوز در حال رشدند، به کار می‌روند و نتیجهٔ آن‌ها به همکاری بیمار و پوشیدن منظم طبق دستور بستگی دارد. اینکه کدام نوع برای شما مناسب است، با معاینه و تشخیص دندانپزشک مشخص می‌شود.

          ## چه وقت ارتودنسی به‌تنهایی کافی نیست؟
          گاهی علت مشکل اندازه یا جای فک‌هاست، مثل بعضی موارد جلو بودن فک پایین. در این حالت ارتودنسی به‌تنهایی ممکن است کافی نباشد و در بزرگسالی جراحی فک هم لازم شود. دندانپزشک پس از معاینه راه درمان را توضیح می‌دهد.

          ارتودنسی جای مراقبت از دندان و لثه را نمی‌گیرد. در طول درمان، معاینه‌های دوره‌ای دندانپزشکی را ادامه دهید. بعد از برداشتن براکت‌ها هم، بدون نگهدارنده، دندان‌ها تمایل دارند به جای قبلی خود برگردند.

          اگر فقط فاصلهٔ بین دندان‌های جلو شما را آزار می‌دهد، صفحهٔ [بستن دیاستم](/خدمات/بستن-دیاستم) را هم ببینید.
      - type: callout
        tone: info
        text: انتخاب نوع دستگاه و زمان شروع درمان با معاینه و تشخیص دندانپزشک است. اگر قبلاً به دندان‌های جلو ضربه خورده یا آسیب دیده‌اند، پیش از شروع درمان به دندانپزشک بگویید؛ ممکن است این دندان‌ها در طول ارتودنسی به درمان بیشتری نیاز داشته باشند.
      - type: steps
        items:
          - title: معاینه و بررسی
            text: دندانپزشک دندان‌ها و فک‌ها را معاینه می‌کند و در صورت نیاز عکس رادیوگرافی و عکس از دندان‌ها می‌گیرد.
          - title: برنامهٔ درمان
            text: نوع دستگاه، زمان شروع و مدت تقریبی درمان برای شما توضیح داده می‌شود.
          - title: نصب دستگاه
            text: در ارتودنسی ثابت، براکت‌ها روی دندان‌ها چسبانده و با سیم به هم وصل می‌شوند.
          - title: جلسه‌های کنترل
            text: معمولاً هر ۶ تا ۸ هفته یک جلسه برای بررسی و تنظیم دستگاه لازم است.
          - title: برداشتن و نگهدارنده
            text: در پایان درمان، براکت‌ها برداشته می‌شوند و نگهدارنده جلوی برگشت دندان‌ها به جای قبلی را می‌گیرد. مدت استفاده از آن را دندانپزشک می‌گوید.
      - type: content
        text: |-
          ## مراقبت در طول درمان
          - صبح، شب و بعد از غذا با خمیردندان فلورایددار مسواک بزنید.
          - هر روز بین دندان‌ها و زیر سیم را با مسواک بین‌دندانی تمیز کنید.
          - غذا و نوشیدنی شیرین را کم کنید.
          - از غذای سفت، ترد یا چسبنده پرهیز کنید، چون ممکن است دستگاه را بشکند. خرد کردن غذا به تکه‌های کوچک کمک می‌کند.
          - آدامس نجوید.
          - معاینه‌های دوره‌ای دندانپزشکی را در طول درمان ادامه دهید.

          ## نگهدارنده بعد از درمان
          نگهدارنده ممکن است ثابت باشد، یعنی سیم نازکی که پشت دندان‌ها چسبانده می‌شود، یا متحرک، که معمولاً از سیم یا پلاستیک شفاف ساخته می‌شود. بدون نگهدارنده، دندان‌ها تمایل دارند به جای قبلی خود برگردند. مدت و شیوهٔ استفاده از آن را دندانپزشک تعیین می‌کند.

          ## خطرها و عوارض
          - درد دندان‌ها تا چند روز بعد از نصب یا تنظیم دستگاه. غذای نرم و مسکن کمک می‌کند.
          - لکه‌های سفید یا قهوه‌ای روی دندان: براکت تمیز کردن دندان را سخت‌تر می‌کند و پلاکی که دور آن می‌ماند می‌تواند به پوسیدگی اولیه برسد. مسواک زدن دقیق با خمیردندان فلورایددار مهم است.
          - برگشت دندان‌ها به جای قبلی، اگر نگهدارنده طبق دستور استفاده نشود.
          - شکستن براکت یا سیم با غذای سفت یا چسبنده.
          - کوتاه شدن ریشهٔ دندان (تحلیل ریشه): حرکت دادن دندان‌ها ممکن است بخشی از ریشه را کوتاه کند. این کوتاه شدن معمولاً کم است، علامتی ندارد و در عکس رادیوگرافی دیده می‌شود.

          ## چه وقت با کلینیک تماس بگیرید؟
          - درد دندان‌ها بیش از چند روز بعد از نصب یا تنظیم ادامه پیدا کرده است.
          - لثه‌ها خیلی قرمز، متورم یا دردناک شده‌اند.
          - دستگاه شکسته است.
          - نگهدارنده شل شده، جدا شده یا شکسته است.
    faqs:
      - question: آیا بزرگسالان هم می‌توانند ارتودنسی کنند؟
        answer: >-
          بله. ارتودنسی فقط برای کودکان و نوجوانان نیست و بسیاری از بزرگسالان
          هم برای مشکلات قدیمی دندان‌هایشان ارتودنسی می‌کنند. نوع و مدت درمان
          پس از معاینه مشخص می‌شود.
      - question: درمان ارتودنسی چقدر طول می‌کشد؟
        answer: >-
          به مشکل دندان‌ها و نوع دستگاه بستگی دارد. ارتودنسی ثابت معمولاً یک تا
          دو سال روی دندان می‌ماند و بعد از آن نگهدارنده لازم است. مدت درمان شما
          پس از معاینه مشخص می‌شود.
      - question: آیا ارتودنسی درد دارد؟
        answer: >-
          بعد از نصب دستگاه و بعد از هر تنظیم، دندان‌ها ممکن است چند روز
          دردناک باشند. در این مدت غذای نرم بخورید و در صورت نیاز مسکن مصرف
          کنید. اگر درد بیش از چند روز ادامه داشت، با کلینیک تماس بگیرید.
      - question: از چه سنی کودک را برای ارتودنسی ببریم؟
        answer: >-
          بیشتر درمان‌های ارتودنسی بعد از رویش دندان‌های دائمی شروع می‌شود. اما
          بعضی مشکلات، مثل بیرون‌زدگی دندان‌های جلوی بالا، بهتر است زودتر بررسی
          شوند، چون این دندان‌ها بیشتر در معرض آسیب‌اند. درمان زودتر، حدود ۷ تا
          ۱۱ سالگی، معمولاً دو مرحله دارد و مزیت آن کم کردن خطر آسیب به
          دندان‌های جلوست. در معاینه‌های دوره‌ای،
          دندانپزشک رشد دندان‌ها و فک کودک را هم بررسی می‌کند.
      - question: چرا بعد از ارتودنسی نگهدارنده لازم است؟
        answer: >-
          بدون نگهدارنده، دندان‌ها تمایل دارند به جای قبلی خود برگردند.
          نگهدارنده ممکن است ثابت باشد یا متحرک. مدت و شیوهٔ استفاده از آن را
          دندانپزشک تعیین می‌کند.
      - question: با ارتودنسی ثابت چه چیزهایی نخورم؟
        answer: >-
          غذای سفت، ترد و چسبنده ممکن است براکت یا سیم را بشکند. آدامس نجوید و
          غذا و نوشیدنی شیرین را کم کنید. خرد کردن غذا به تکه‌های کوچک کمک
          می‌کند.
      - question: هزینهٔ ارتودنسی چقدر است؟
        answer: >-
          هزینه به پیچیدگی مشکل دندان‌ها و نوع دستگاه بستگی دارد و پس از معاینه
          مشخص می‌شود. پیش از شروع درمان، هزینه را از پذیرش بپرسید.
