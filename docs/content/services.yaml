  - key: composite-veneer
    category: cosmetic
    nav_label: کامپوزیت دندان
    h1: کامپوزیت دندان (ونیر کامپوزیت)
    seo_title: کامپوزیت دندان؛ مراحل و هزینه
    slug: کامپوزیت-دندان
    booking_group: cosmetic
    priority: 1
    search_terms: [کامپوزیت دندان, ونیر کامپوزیت, قیمت کامپوزیت دندان, ماندگاری کامپوزیت, کامپوزیت دندان جنوب تهران]
    summary: لایهٔ کامپوزیت همرنگ دندان که در مطب روی سطح دندان شکل می‌گیرد تا رنگ، فرم یا شکستگی‌های کوچک اصلاح شود.
    seo_description: >-
      کامپوزیت دندان (ونیر کامپوزیت) در کلینیک دندانپزشکی سفید: برای چه کسی
      مناسب است، مراحل کار، مراقبت و ماندگاری کامپوزیت. خانی‌آباد نو، جنوب
      تهران.
    recovery: ممکن است چند روز طول بکشد تا به کامپوزیت عادت کنید
    related: [ceramic-laminate, restoration, diastema]
    body:
      - type: content
        text: |-
          ## کامپوزیت دندان چیست؟
          در ونیر کامپوزیت، دندانپزشک مادهٔ ترمیمی همرنگ دندان را روی سطح دندان می‌چسباند، آن را شکل می‌دهد و با نور مخصوص سخت می‌کند. کار در مطب و روی خود دندان انجام می‌شود و به ساخت در لابراتوار نیاز ندارد. برای همین ممکن است تراش کمتر و جلسه‌های کمتری از لمینت سرامیکی لازم داشته باشد.

          ## برای چه کسی مناسب است؟
          - لب‌پریدگی یا شکستگی دندان
          - تغییر رنگ دندان
          - دندان کج یا بدفرم
          - فاصلهٔ بین دندان‌ها

          ## چه وقت کامپوزیت کافی نیست؟
          - کامپوزیت در برابر لک و سایش به اندازهٔ لمینت سرامیکی مقاوم نیست. اگر رنگ پایدارتری می‌خواهید، [لمینت سرامیکی](/خدمات/لمینت-سرامیکی) هم گزینه‌ای است.
          - اگر پوسیدگی یا بیماری لثه دارید، اول باید درمان شود.
          - اگر دندان‌قروچه دارید یا دندان‌های بالا بیش از اندازه روی دندان‌های پایین را می‌پوشانند، ونیر ممکن است انتخاب مناسبی نباشد.
          - اگر دندان شکستگی بزرگی دارد، ممکن است روکش یا درمان دیگری لازم باشد.
          - کامپوزیت جای دندان را عوض نمی‌کند. اگر دندان‌ها خیلی نامرتب‌اند، [ارتودنسی](/خدمات/ارتودنسی) ممکن است انتخاب مناسب‌تری باشد.

          انتخاب درمان با معاینه و تشخیص دندانپزشک است.
      - type: callout
        tone: info
        text: ونیر کامپوزیت برگشت‌پذیر نیست، چون سطح دندان برای چسباندن آن آماده و گاهی کمی تراشیده می‌شود. پیش از تصمیم، انتظارات و نگرانی‌هایتان را با دندانپزشک در میان بگذارید.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک سلامت دندان‌ها و لثه را بررسی می‌کند. اگر پوسیدگی یا بیماری لثه باشد، اول همان درمان می‌شود.
          - title: انتخاب رنگ
            text: رنگ کامپوزیت با کمک دندانپزشک انتخاب می‌شود تا با دندان‌های طبیعی شما هماهنگ باشد.
          - title: آماده‌سازی دندان
            text: سطح دندان برای چسبیدن کامپوزیت آماده می‌شود.
          - title: شکل‌دهی
            text: کامپوزیت روی دندان چسبانده و با دقت شکل داده می‌شود. نور مخصوص آن را سخت می‌کند تا به دندان بچسبد.
          - title: پرداخت
            text: سطح کامپوزیت صاف و پرداخت می‌شود تا شبیه دندان طبیعی شود.
      - type: content
        text: |-
          ## بعد از کامپوزیت
          ممکن است چند روز طول بکشد تا به کامپوزیت عادت کنید. اگر هنگام بستن دهان دندان‌ها درست روی هم نمی‌نشینند، به دندانپزشک بگویید تا آن را اصلاح کند.

          - ناخن نجوید و چیزهای سفت یا خوراکی‌های خیلی سفت را گاز نگیرید.
          - اگر ورزشی می‌کنید که ممکن است به دهان ضربه بزند، محافظ دهان بگذارید.
          - کامپوزیت زودتر از لمینت سرامیکی رنگ می‌گیرد. در مصرف قهوه و چای احتیاط کنید.
          - دو بار در روز با خمیردندان فلورایددار مسواک بزنید و هر روز بین دندان‌ها را تمیز کنید.

          ## خطرها و عوارض
          - کامپوزیت ممکن است با گذشت زمان لب‌پر شود، ترک بخورد، ساییده یا لق شود. ترمیم آن معمولاً ساده‌تر از لمینت سرامیکی است.
          - رنگ کامپوزیت ممکن است با گذشت زمان تغییر کند و با بلیچینگ روشن نمی‌شود.
          - زیر و اطراف کامپوزیت هم ممکن است پوسیدگی ایجاد شود.
    faqs:
      - question: ماندگاری کامپوزیت دندان چقدر است؟
        answer: >-
          کامپوزیت همیشگی نیست و ممکن است با گذشت زمان لب‌پر شود، ساییده شود
          یا رنگ بگیرد. در عوض، ترمیم آن ساده‌تر است. پژوهش‌ها نشان می‌دهند
          عادت‌های خود شما بیشترین اثر را بر ماندگاری کامپوزیت دارد. گاز نگرفتن
          چیزهای سفت و مسواک و نخ دندان منظم به عمر آن کمک می‌کند.
      - question: آیا برای کامپوزیت دندان تراشیده می‌شود؟
        answer: >-
          سطح دندان برای چسبیدن کامپوزیت آماده می‌شود. ونیر کامپوزیت ممکن است
          تراش کمتری از لمینت سرامیکی لازم داشته باشد. مقدار آن برای دندان شما
          پس از معاینه مشخص می‌شود.
      - question: کامپوزیت دندان چند جلسه است؟
        answer: >-
          کامپوزیت در مطب و روی خود دندان ساخته می‌شود و به لابراتوار نیاز
          ندارد. تعداد جلسه‌های شما به تعداد دندان‌ها بستگی دارد و پس از معاینه
          مشخص می‌شود.
      - question: آیا کامپوزیت دندان رنگ می‌گیرد؟
        answer: >-
          کامپوزیت با گذشت زمان ممکن است رنگ بگیرد. قهوه و چای هم ممکن است آن
          را لک کنند. رنگ کامپوزیت با بلیچینگ عوض نمی‌شود. اگر به
          سفید کردن دندان‌ها هم فکر می‌کنید، پیش از انتخاب رنگ کامپوزیت به
          دندانپزشک بگویید.
      - question: اگر کامپوزیت بشکند یا لب‌پر شود چه کنم؟
        answer: >-
          با کلینیک تماس بگیرید و نوبت معاینه بگیرید. دندانپزشک بسته به آسیب،
          کامپوزیت را ترمیم یا عوض می‌کند.
      - question: آیا کامپوزیت برای همه مناسب است؟
        answer: >-
          نه. اگر پوسیدگی یا بیماری لثه دارید، اول باید درمان شود. برای کسی که
          دندان‌قروچه دارد یا دندان‌های بالایش بیش از اندازه روی دندان‌های پایین
          را می‌پوشانند، ونیر ممکن است انتخاب مناسبی نباشد. انتخاب درمان با
          معاینه و تشخیص دندانپزشک است.
      - question: قیمت کامپوزیت دندان چقدر است؟
        answer: >-
          هزینه به تعداد دندان‌ها و کار لازم بستگی دارد و پس از معاینه مشخص
          می‌شود. کامپوزیت معمولاً هزینهٔ کمتری از لمینت سرامیکی دارد. پیش از
          شروع کار، هزینه را از پذیرش بپرسید.
