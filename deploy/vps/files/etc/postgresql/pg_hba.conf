# Installed by deploy/vps/provision.sh into /etc/postgresql/<version>/main/pg_hba.conf.
# TYPE  DATABASE  USER      ADDRESS        METHOD
# The postgres superuser and same-named system users over the local socket (backups use this).
local   all       postgres                 peer
local   all       all                      peer
# The app and the deploy tunnel: role sefid, database sefid, loopback, password.
host    sefid     sefid     127.0.0.1/32   scram-sha-256
