  - key: inlay-onlay
    category: restorative
    nav_label: اینله و آنله
    h1: اینله و آنله
    seo_title: اینله و آنله دندان
    slug: اینله-و-آنله
    booking_group: restore
    priority: 3
    search_terms: [اینله و آنله, اینله دندان, آنله دندان]
    summary: ترمیمی که بیرون از دهان ساخته و روی دندان چسبانده می‌شود، برای آسیب بزرگ دندان‌های عقب وقتی روکش کامل لازم نیست.
    seo_description: >-
      اینله و آنله دندان در کلینیک دندانپزشکی سفید: فرق آن با پر کردن و روکش،
      مراحل کار، مراقبت بعد از آن و خطرها. خانی‌آباد نو، جنوب تهران.
    sessions: معمولاً دو جلسه
    anesthesia: بی‌حسی موضعی، در صورت نیاز
    recovery: گاهی حساسیت دندان در فاصلهٔ دو جلسه و چند روز بعد از چسباندن
    related: [restoration, crown, root-canal]
    body:
      - type: content
        text: |-
          ## اینله و آنله چیست؟
          اینله و آنله ترمیم‌هایی هستند که بیرون از دهان ساخته می‌شوند. دندانپزشک بخش پوسیده یا آسیب‌دیده را برمی‌دارد، دندان را آماده می‌کند و از آن قالب می‌گیرد. ترمیم بر اساس این قالب ساخته و در جلسهٔ بعد با چسب یا سمان مخصوص روی دندان محکم می‌شود.

          اینله داخل حفرهٔ دندان و بین برجستگی‌های سطح جونده (کاسپ‌ها) قرار می‌گیرد. آنله یک یا چند کاسپ را هم می‌پوشاند، اما برخلاف روکش، همهٔ سطح بیرونی دندان را نمی‌پوشاند.

          اینله و آنله ممکن است از سرامیک، کامپوزیت یا آلیاژ طلا ساخته شوند. سرامیک و کامپوزیت همرنگ دندان‌اند. سرامیک ممکن است بشکند یا لب‌پر شود. کامپوزیت ممکن است با گذشت زمان ساییده شود یا تغییر رنگ دهد. طلا بادوام است، اما همرنگ دندان نیست. سرامیک و کامپوزیت برای جایی که فشار جویدن خیلی زیاد است همیشه مناسب نیستند؛ اگر دندان‌قروچه دارید یا دندان‌هایتان را به هم فشار می‌دهید، این را به دندانپزشک بگویید. دندانپزشک پس از معاینه، دربارهٔ مادهٔ مناسب دندان شما با شما گفت‌وگو می‌کند.

          ## برای چه کسی مناسب است؟
          اینله و آنله بیشتر برای دندان‌های عقب به کار می‌روند، وقتی بخش بزرگی از دندان با پوسیدگی یا شکستگی از دست رفته است. برای این دندان‌ها چند راه هست: ترمیم مستقیم با کامپوزیت، اینله و آنله، یا روکش. مرور مطالعه‌ها نشان می‌دهد برای پوسیدگی بزرگ دندان‌های عقب، هم ترمیم مستقیم و هم ترمیم ساخته‌شده بیرون از دهان به کار می‌روند و هنوز روشن نیست کدام برتر است.

          یکی از مزیت‌های اینله و آنله این است که تراش دندان برای آن‌ها کمتر از روکش کامل است و بخش بیشتری از دندان خودتان می‌ماند.

          ## چه وقت اینله و آنله کافی نیست؟
          اگر پوسیدگی به مغز دندان (پالپ) رسیده باشد، ممکن است اول [درمان ریشه](/خدمات/درمان-ریشه) لازم شود. اگر بخش بیشتری از دندان شکسته یا آسیب دیده باشد، [روکش دندان](/خدمات/روکش-دندان) که همهٔ تاج دندان را می‌پوشاند، گزینهٔ دیگری است. اگر آسیب کوچک باشد، [ترمیم دندان](/خدمات/ترمیم-دندان) معمولاً کافی است.
      - type: callout
        tone: info
        text: انتخاب میان ترمیم مستقیم، اینله و آنله یا روکش با معاینه و تشخیص دندانپزشک است. هزینه پس از معاینه مشخص می‌شود؛ پیش از شروع کار آن را از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک دندان را معاینه می‌کند و اگر لازم بداند، عکس رادیوگرافی می‌گیرد تا آسیب‌هایی که در معاینه دیده نمی‌شوند هم پیدا شوند.
          - title: آماده کردن دندان
            text: اگر لازم باشد، دندان با بی‌حسی موضعی بی‌حس می‌شود. سپس بخش پوسیده یا آسیب‌دیده برداشته و دندان برای اینله یا آنله شکل داده می‌شود.
          - title: قالب‌گیری و ترمیم موقت
            text: از دندان قالب گرفته می‌شود تا اینله یا آنله بر اساس آن ساخته شود. تا جلسهٔ بعد، ترمیم موقت روی دندان می‌ماند.
          - title: امتحان و تنظیم
            text: در جلسهٔ دوم، ترمیم موقت برداشته می‌شود و اینله یا آنله روی دندان امتحان و در صورت نیاز تنظیم می‌شود.
          - title: چسباندن
            text: اینله یا آنله با چسب یا سمان مخصوص روی دندان محکم می‌شود.
      - type: content
        text: |-
          ## بین دو جلسه و بعد از آن
          - تا وقتی بی‌حسی از بین نرفته است، غذا نجوید تا لب و گونه‌تان را گاز نگیرید.
          - در فاصلهٔ دو جلسه و چند روز بعد از چسباندن، دندان ممکن است به سرما و گرما حساس باشد.
          - اگر ترمیم موقت افتاد یا شکست، با کلینیک تماس بگیرید.
          - اگر بعد از چسباندن، هنگام بستن دهان، اینله یا آنله بلندتر از دندان‌های دیگر حس شد، با کلینیک تماس بگیرید.
          - روزی دو بار با خمیردندان فلورایددار مسواک بزنید، هر روز بین دندان‌ها را با نخ دندان یا مسواک بین‌دندانی تمیز کنید و معاینه‌های منظم را ادامه دهید.

          ## خطرها و محدودیت‌ها
          هیچ ترمیمی همیشگی نیست. مطالعه‌ها دوام خوبی برای اینله‌ها و آنله‌های سرامیکی نشان می‌دهند، اما این مشکلات ممکن است پیش بیاید:
          - شکستن یا لب‌پریدگی ترمیم، که شایع‌ترین علت از کار افتادن آن است
          - مشکل عصب دندان، که ممکن است درمان ریشه لازم کند
          - پوسیدگی دوباره در لبهٔ ترمیم
          - جدا شدن ترمیم از دندان
    faqs:
      - question: فرق اینله و آنله چیست؟
        answer: >-
          اینله داخل حفرهٔ دندان و بین برجستگی‌های سطح جونده قرار می‌گیرد. آنله
          یک یا چند برجستگی سطح جونده را هم می‌پوشاند. هر دو بیرون از دهان ساخته
          می‌شوند و هیچ‌کدام مثل روکش همهٔ سطح بیرونی دندان را نمی‌پوشانند.
      - question: اینله و آنله با پر کردن معمولی چه فرقی دارد؟
        answer: >-
          در پر کردن معمولی، مادهٔ ترمیمی مستقیم در دهان روی دندان شکل می‌گیرد و
          کار معمولاً در یک جلسه تمام می‌شود. اینله و آنله بیرون از دهان ساخته
          می‌شوند و معمولاً دو جلسه لازم دارند. برای پوسیدگی بزرگ دندان‌های عقب
          هر دو راه به کار می‌روند و انتخاب با معاینه و تشخیص دندانپزشک است.
      - question: آنله بهتر است یا روکش؟
        answer: >-
          هیچ‌کدام برای همه بهتر نیست. آنله بخشی از سطح جونده را می‌پوشاند و
          تراش کمتری از روکش لازم دارد. روکش همهٔ تاج دندان را می‌پوشاند. اینکه
          کدام برای دندان شما مناسب است، با معاینه و تشخیص دندانپزشک مشخص
          می‌شود.
      - question: اینله و آنله چند جلسه است؟
        answer: >-
          معمولاً دو جلسه. در جلسهٔ اول دندان آماده می‌شود، از آن قالب گرفته
          می‌شود و ترمیم موقت روی آن قرار می‌گیرد. در جلسهٔ دوم اینله یا آنله
          امتحان، تنظیم و روی دندان چسبانده می‌شود.
      - question: آیا اینله و آنله درد دارد؟
        answer: >-
          اگر لازم باشد، دندان با بی‌حسی موضعی بی‌حس می‌شود و دندانپزشک پیش از
          شروع کار مطمئن می‌شود بی‌حسی کافی است. در فاصلهٔ دو جلسه، دندان ممکن
          است به سرما و گرما حساس باشد. اگر درد شدید شد یا ادامه پیدا کرد، با
          کلینیک تماس بگیرید.
      - question: اینله و آنله از چه ماده‌ای ساخته می‌شود؟
        answer: >-
          در دندانپزشکی، اینله و آنله از سرامیک، کامپوزیت یا آلیاژ طلا ساخته
          می‌شوند. سرامیک و کامپوزیت همرنگ دندان‌اند. کامپوزیت ممکن است با گذشت
          زمان ساییده شود یا تغییر رنگ دهد. طلا بادوام است، اما همرنگ دندان
          نیست. اینکه کدام ماده برای دندان شما مناسب است، با معاینه و تشخیص
          دندانپزشک مشخص می‌شود؛ پیش از شروع کار بپرسید کدام ماده پیشنهاد می‌شود.
      - question: اینله و آنله چقدر دوام دارد؟
        answer: >-
          هیچ ترمیمی همیشگی نیست. در مطالعه‌ها، بیشتر اینله‌ها و آنله‌های سرامیکی
          پس از ده سال هنوز سر جای خود بوده‌اند. شکستن ترمیم، پوسیدگی دوباره در
          لبهٔ آن و جدا شدن از دندان از علت‌های از کار افتادن آن است. مسواک، نخ
          دندان و معاینهٔ منظم به سالم ماندن آن کمک می‌کند.
      - question: هزینهٔ اینله و آنله چقدر است؟
        answer: >-
          هزینه به ماده، اندازهٔ ترمیم و تعداد دندان‌ها بستگی دارد و پس از معاینه
          مشخص می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
