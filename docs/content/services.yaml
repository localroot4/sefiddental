categories:
  - key: cosmetic
    title: خدمات زیبایی دندان
    nav_label: زیبایی
    slug: زیبایی
    accent: warm          # category icon accent only, never UI chrome
    icon: sparkle         # Phosphor duotone name; CategoryIcon allowlist
    order: 1
    seo_title: دندانپزشکی زیبایی
    seo_description: >-
      دندانپزشکی زیبایی در کلینیک سفید، خانی‌آباد نو: لمینت سرامیکی، کامپوزیت، بلیچینگ، بستن دیاستم، لیفت لثه و طراحی لبخند. مراحل و خطرهای هر درمان را بخوانید.
    summary: درمان‌هایی برای رنگ، فرم و هماهنگی دندان‌ها و لبخند.
    intro: |-
      درمان‌های زیبایی برای تغییر رنگ، فرم یا فاصلهٔ دندان‌ها و نمای لثه در لبخند هستند. صفحهٔ هر خدمت توضیح می‌دهد آن درمان چیست، برای چه کسی مناسب است، چه مراحلی دارد، بعد از آن چه مراقبتی لازم است و چه خطرهایی دارد.

      برای انتخاب، اول ببینید از چه چیزی در لبخندتان راضی نیستید: رنگ دندان‌ها، شکل آن‌ها، فاصلهٔ بینشان یا لثه‌ای که هنگام لبخند زیاد دیده می‌شود. همین را در نوبت معاینه به دندانپزشک بگویید. دندانپزشک سلامت دندان‌ها و لثه را بررسی می‌کند و گزینه‌های مناسب دهان شما را با مزایا و محدودیت‌هایشان توضیح می‌دهد. انتخاب درمان با معاینه و تشخیص دندانپزشک است و هزینه هم پس از معاینه مشخص می‌شود.

      اگر نمی‌دانید از کجا شروع کنید، در فرم رزرو، گزینهٔ معاینه را انتخاب کنید. پذیرش در ساعات کاری با شما تماس می‌گیرد.
    faqs:
      # Article-owned term («لمینت یا کامپوزیت», keyword map 3): kept to two sentences (H28).
      - question: لمینت سرامیکی یا کامپوزیت، کدام برای من مناسب است؟
        answer: >-
          هر کدام مزایا و محدودیت‌های خودش را دارد و انتخاب با معاینه و تشخیص
          دندانپزشک است. صفحه‌های لمینت سرامیکی و کامپوزیت دندان مراحل، مراقبت
          و خطرهای هر کدام را توضیح می‌دهند.
      - question: پیش از درمان زیبایی چه چیزهایی را به دندانپزشک بگویم؟
        answer: >-
          بگویید چه چیزی را می‌خواهید تغییر دهید و چه چیزی برایتان مهم است. اگر
          دندان‌قروچه دارید، دارویی مصرف می‌کنید یا قبلاً درمان زیبایی داشته‌اید،
          این را هم بگویید. دندانپزشک پس از معاینه گزینه‌های مناسب را توضیح
          می‌دهد و تصمیم نهایی از میان آن‌ها با خودتان است.
      - question: درمان زیبایی چند جلسه طول می‌کشد؟
        answer: >-
          به نوع درمان و وضعیت دندان‌های شما بستگی دارد. تعداد جلسه‌ها پس از
          معاینه مشخص می‌شود و صفحهٔ هر خدمت مراحل کار آن را توضیح می‌دهد.
  - key: surgery-replacement
    title: جراحی و جایگزینی دندان
    nav_label: جراحی و جایگزینی دندان
    slug: جراحی-و-جایگزینی-دندان
    accent: brand
    icon: bandaids
    order: 2
    seo_title: جراحی و جایگزینی دندان
    seo_description: >-
      ایمپلنت، اوردنچر، کشیدن دندان، جراحی دندان عقل و جراحی لثه در کلینیک دندانپزشکی سفید، جنوب تهران. ببینید هر درمان چه مراحلی، مراقبتی و خطرهایی دارد.
    summary: ایمپلنت، اوردنچر، کشیدن دندان و جراحی‌های دهان و لثه.
    intro: |-
      خدمات این گروه دو دسته‌اند: جایگزینی دندان از دست رفته، مثل ایمپلنت و اوردنچر، و درمان‌هایی که با جراحی در دهان انجام می‌شوند، مثل کشیدن دندان و جراحی لثه. صفحهٔ هر خدمت توضیح می‌دهد آن درمان چیست، برای چه کسی مناسب است، چه مراحلی دارد، بعد از آن چه مراقبتی لازم است و چه خطرهایی دارد.

      در نوبت معاینه، دندانپزشک وضعیت دهان شما را بررسی می‌کند و دربارهٔ داروها و بیماری‌هایتان می‌پرسد. سپس روش کار، دورهٔ درمان و راه‌های دیگر را توضیح می‌دهد. انتخاب درمان با معاینه و تشخیص دندانپزشک است و هزینه هم پس از معاینه مشخص می‌شود.

      اگر نمی‌دانید کدام خدمت را لازم دارید، در فرم رزرو، گزینهٔ معاینه را انتخاب کنید. پذیرش در ساعات کاری با شما تماس می‌گیرد.
    faqs:
      - question: برای دندان‌های از دست رفته چه راه‌هایی هست؟
        answer: >-
          در این گروه، صفحه‌های ایمپلنت و اوردنچر دو راه جایگزینی دندان را
          توضیح می‌دهند و می‌گویند هر کدام برای چه کسی مناسب است. دندانپزشک پس
          از معاینه راه‌های دیگر را هم توضیح می‌دهد و انتخاب با معاینه و تشخیص
          دندانپزشک است.
      - question: پیش از جراحی چه چیزهایی را به دندانپزشک بگویم؟
        answer: >-
          داروهایی که مصرف می‌کنید، بیماری‌هایتان و حساسیت‌های دارویی را بگویید
          و فهرست داروهایتان را همراه بیاورید. اگر از درد یا خود جراحی نگران
          هستید، این را هم بگویید تا دندانپزشک روش کار را پیش از شروع توضیح دهد.
      - question: بعد از جراحی، اگر نگران شدم چه کنم؟
        answer: >-
          دستور مراقبتی را که دندانپزشک می‌دهد دقیق دنبال کنید. اگر پرسشی دارید
          یا نگران حال خود هستید، در ساعات کاری با کلینیک تماس بگیرید. اگر
          خونریزی با دست‌کم ۱۰ دقیقه فشار مداوم بند نمی‌آید، با کلینیک تماس
          بگیرید و اگر کلینیک بسته است، به اورژانس نزدیک‌ترین بیمارستان بروید.
          اگر ورم صورت به چشم یا گردن رسیده است، یا نفس کشیدن، قورت دادن، حرف
          زدن یا باز کردن دهان سخت شده است، با اورژانس ۱۱۵ تماس بگیرید یا به
          اورژانس نزدیک‌ترین بیمارستان بروید.
  - key: restorative
    title: درمان و نگهداری دندان
    nav_label: درمان و نگهداری
    slug: درمان-دندان
    accent: green
    icon: tooth
    order: 3
    seo_title: درمان و نگهداری دندان
    seo_description: >-
      ترمیم دندان در سه سطح، درمان ریشه، روکش، اینله و آنله و جرم‌گیری در کلینیک دندانپزشکی سفید، خانی‌آباد نو. مراحل، مراقبت و خطرهای هر درمان را بخوانید.
    summary: ترمیم، روکش، درمان ریشه، جرم‌گیری و اینله و آنله، برای نگه داشتن دندان‌های خودتان.
    intro: |-
      هدف خدمات این گروه نگه داشتن دندان‌های خودتان است: ترمیم دندان، روکش، اینله و آنله، درمان ریشه و جرم‌گیری. صفحهٔ هر خدمت توضیح می‌دهد آن درمان چیست، برای چه کسی مناسب است، چه مراحلی دارد، بعد از آن چه مراقبتی لازم است و چه خطرهایی دارد.

      اگر دندانتان درد دارد، شکسته یا به سرما و گرما حساس شده است، نوبت معاینه بگیرید. اگر درد شدید یا ورم صورت دارید، منتظر نوبت عادی نمانید و در ساعات کاری با کلینیک تماس بگیرید. اگر کلینیک بسته است و ورم بیشتر می‌شود، به اورژانس نزدیک‌ترین بیمارستان بروید. دندانپزشک پس از معاینه می‌گوید کدام درمان لازم است و راه‌های دیگر را هم توضیح می‌دهد. انتخاب درمان با معاینه و تشخیص دندانپزشک است و هزینه هم پس از معاینه مشخص می‌شود. در فرم رزرو، گزینهٔ معاینه را انتخاب کنید تا پذیرش در ساعات کاری با شما تماس بگیرد.

      ترمیم دندان در کلینیک سفید سه سطح دارد: معمولی، VIP و CIP. صفحهٔ ترمیم دندان تفاوت سطح‌ها را توضیح می‌دهد.
    faqs:
      # Article-owned term («ماندگاری پر کردن دندان», keyword map 3): kept to two sentences (H28).
      - question: ترمیم دندان چقدر دوام دارد؟
        answer: >-
          دوام ترمیم برای هر دندان فرق دارد و صفحهٔ ترمیم دندان می‌گوید چه
          چیزهایی بر آن اثر دارد. دندانپزشک پس از معاینه دربارهٔ ترمیم شما و
          مراقبت از آن توضیح می‌دهد.
      - question: از کجا بدانم ترمیم، روکش یا درمان ریشه لازم دارم؟
        answer: >-
          این تصمیم با معاینه و تشخیص دندانپزشک است. به دندانپزشک بگویید درد
          یا حساسیت از چه زمانی شروع شده و با چه چیزی بیشتر می‌شود؛ این
          اطلاعات به تشخیص کمک می‌کند.
      - question: کدام سطح ترمیم را انتخاب کنم؟
        answer: >-
          صفحهٔ ترمیم دندان تفاوت سه سطح معمولی، VIP و CIP را توضیح می‌دهد.
          دندانپزشک پس از معاینه می‌گوید کدام سطح‌ها برای دندان شما ممکن است و
          تفاوت آن‌ها را توضیح می‌دهد؛ انتخاب میان آن‌ها با خودتان است.
          هزینهٔ هر سطح را پیش از شروع کار از پذیرش بپرسید.
      - question: اگر دندانم درد شدید دارد چه کنم؟
        answer: >-
          در ساعات کاری با کلینیک تماس بگیرید؛ برای بیمارانی که درد شدید دارند،
          در صورت امکان همان روز نوبت می‌دهیم. اگر ورم صورت به چشم یا گردن رسیده
          است، یا نفس کشیدن، قورت دادن، حرف زدن یا باز کردن دهان سخت شده است،
          با اورژانس ۱۱۵ تماس بگیرید یا به اورژانس نزدیک‌ترین بیمارستان بروید.
          صفحهٔ «درد شدید دندان» نشانه‌های خطر را فهرست می‌کند و فرم درخواست
          فوری دارد.
