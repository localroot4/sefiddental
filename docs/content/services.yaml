  # ---- restorative ----
  - key: restoration
    category: restorative
    nav_label: ترمیم دندان
    h1: "ترمیم دندان در سه سطح: معمولی، VIP و CIP"
    seo_title: ترمیم دندان؛ معمولی، VIP و CIP
    slug: ترمیم-دندان
    alias: /vip
    booking_group: restore
    priority: 1
    search_terms: [ترمیم دندان, پر کردن دندان, ترمیم همرنگ دندان, کامپوزیت ترمیمی, ترمیم VIP, قیمت پر کردن دندان]
    summary: ترمیم پوسیدگی یا شکستگی دندان در سه سطح معمولی، VIP و CIP، که در مواد و دقت کار با هم فرق دارند.
    seo_description: >-
      ترمیم دندان در کلینیک دندانپزشکی سفید در سه سطح معمولی، VIP و CIP:
      تفاوت مواد و دقت هر سطح، مراحل کار و مراقبت بعد از ترمیم. خانی‌آباد نو،
      جنوب تهران.
    sessions: معمولاً یک جلسه
    anesthesia: بی‌حسی موضعی، در صورت نیاز
    recovery: بازگشت به کار روزمره در همان روز
    related: [crown, inlay-onlay, root-canal]
    body:
      - type: content
        text: |-
          ## ترمیم دندان چیست؟
          وقتی بخشی از دندان با پوسیدگی یا شکستگی از دست می‌رود، دندانپزشک بخش آسیب‌دیده را برمی‌دارد و جای آن را با مادهٔ ترمیمی پر می‌کند. ترمیم، شکل و کار دندان را برمی‌گرداند و جلوی پیشرفت پوسیدگی را می‌گیرد.

          ## برای چه کسی مناسب است؟
          - پوسیدگی کوچک تا متوسط که هنوز به عصب نرسیده است
          - لب‌پریدگی یا شکستگی کوچک دندان
          - ترمیم قدیمی که شکسته، لق شده یا دور آن پوسیده است

          ## چه وقت ترمیم کافی نیست؟
          اگر پوسیدگی به عصب رسیده باشد، اول درمان ریشه لازم است. اگر بخش بزرگی از دندان از دست رفته باشد، اینله و آنله یا روکش از دندان بهتر محافظت می‌کند. دندانپزشک پس از معاینه و در صورت نیاز عکس رادیوگرافی، راه مناسب را پیشنهاد می‌کند.
      - type: callout
        tone: info
        text: انتخاب سطح ترمیم با معاینه و تشخیص دندانپزشک است. هزینهٔ هر سطح را پیش از شروع کار از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک دندان را معاینه می‌کند و در صورت نیاز عکس رادیوگرافی می‌گیرد تا عمق پوسیدگی مشخص شود.
          - title: بی‌حسی
            text: اگر لازم باشد، دندان با بی‌حسی موضعی بی‌حس می‌شود.
          - title: برداشتن پوسیدگی
            text: بخش پوسیده یا شکسته برداشته و دندان برای ترمیم آماده می‌شود.
          - title: ترمیم و شکل‌دهی
            text: مادهٔ ترمیمی جای بخش برداشته‌شده را پر می‌کند و فرم دندان ساخته می‌شود. در سطح CIP رنگ ترمیم هم با رنگ‌آمیزی و کاراکتردهی به دندان‌های کناری نزدیک می‌شود.
          - title: تنظیم و پرداخت
            text: جفت شدن دندان‌ها هنگام بستن دهان بررسی و سطح ترمیم صاف و پرداخت می‌شود.
      - type: content
        text: |-
          ## بعد از ترمیم
          تا وقتی بی‌حسی از بین نرفته است، غذا نجوید تا لب و گونه‌تان را گاز نگیرید. حساسیت کم به سرما در چند روز اول ممکن است و معمولاً خودبه‌خود کم می‌شود.

          اگر هنگام بستن دهان، ترمیم بلندتر از دندان‌های دیگر حس شد یا درد ادامه پیدا کرد، با کلینیک تماس بگیرید.
    faqs:
      - question: فرق سطح معمولی، VIP و CIP چیست؟
        answer: >-
          سطح‌ها در مواد و دقت کار فرق دارند. سطح معمولی ترمیم استاندارد با
          مواد متداول است. در VIP مواد درجه‌یک به کار می‌رود و فرم و سطح ترمیم
          با دقت بیشتری ساخته می‌شود. CIP همهٔ ویژگی‌های VIP را دارد، به‌علاوهٔ
          رنگ‌آمیزی و کاراکتردهی تا رنگ ترمیم به دندان‌های کناری نزدیک‌تر شود.
      - question: آیا ترمیم دندان درد دارد؟
        answer: >-
          اگر پوسیدگی عمیق باشد، دندان با بی‌حسی موضعی بی‌حس می‌شود. بعد از
          ترمیم، حساسیت کم به سرما در چند روز اول ممکن است و معمولاً خودبه‌خود
          کم می‌شود.
      - question: ترمیم دندان چند جلسه است؟
        answer: >-
          بیشتر ترمیم‌ها در یک جلسه انجام می‌شوند. اگر چند دندان ترمیم لازم
          داشته باشند، دندانپزشک کار را در چند جلسه برنامه‌ریزی می‌کند.
      - question: بعد از ترمیم کی می‌توانم غذا بخورم؟
        answer: >-
          وقتی بی‌حسی کامل از بین رفت. تا آن موقع غذا نجوید تا لب و گونه‌تان را
          گاز نگیرید. اگر ترمیم شما نکتهٔ دیگری لازم داشته باشد، دندانپزشک
          همان روز می‌گوید.
      - question: ترمیم چقدر دوام دارد؟
        answer: >-
          به اندازه و جای ترمیم، مواد آن و مراقبت شما بستگی دارد. مسواک زدن دو
          بار در روز، نخ دندان و معاینهٔ منظم عمر ترمیم را بیشتر می‌کند.
      - question: هزینهٔ ترمیم دندان چقدر است؟
        answer: >-
          هزینه به سطح ترمیم، اندازهٔ آن و تعداد دندان‌ها بستگی دارد و پس از
          معاینه مشخص می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
