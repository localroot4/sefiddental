  - key: oral-surgery
    category: surgery-replacement
    nav_label: جراحی دندان عقل
    h1: جراحی دندان عقل
    seo_title: جراحی دندان عقل
    slug: جراحی-دندان-عقل-و-فک
    booking_group: other
    priority: 3
    scope_to_verify: wisdom-tooth surgery and jaw surgery (gap 27)
    search_terms: [جراحی دندان عقل, جراحی دندان عقل نهفته, کشیدن دندان عقل]
    summary: اگر دندان عقل درد دارد یا کامل بیرون نیامده است، معاینه و عکس رادیوگرافی نشان می‌دهد پیگیری کافی است، کشیدن ساده لازم است یا جراحی.
    seo_description: >-
      جراحی دندان عقل نهفته: چه وقت لازم است و چه وقت نه، مراحل و بی‌حسی،
      مراقبت بعد از جراحی، عوارضی مثل خشکی حفره و زمان تماس با کلینیک.
    related: [extraction, gum-surgery, implant]
    body:
      - type: content
        text: |-
          ## جراحی دندان عقل چیست؟
          دندان‌های عقل آخرین دندان‌هایی هستند که در عقب دهان بیرون می‌آیند، معمولاً در اواخر نوجوانی یا اوایل بیست‌سالگی. اگر جای کافی نباشد، دندان عقل ممکن است نهفته بماند، یعنی در استخوان فک یا زیر لثه گیر کند، یا فقط بخشی از آن بیرون بیاید.

          بیرون آوردن چنین دندانی همیشه با کشیدن ساده ممکن نیست. در جراحی دندان عقل، اگر لثه روی دندان را پوشانده باشد، لثه باز می‌شود و دندان یک‌تکه یا در چند تکه بیرون آورده می‌شود.

          ## برای چه کسی مناسب است؟
          دندان عقلی که جای کافی برای بیرون آمدن ندارد ممکن است این مشکلات را ایجاد کند:

          - درد و ورم
          - عفونت لثهٔ اطراف دندان عقل
          - گیر کردن غذا
          - پوسیدگی دندان
          - بیماری لثه
          - کیست، یعنی جمع شدن مایع در اطراف دندان
          - آبسه دندان

          اگر یکی از این مشکلات را دارید، دندانپزشک دهان را معاینه می‌کند و با عکس رادیوگرافی جای دندان عقل را بررسی می‌کند. سپس دربارهٔ راه درمان با هم تصمیم می‌گیرید.

          ## چه وقت جراحی لازم نیست؟
          دندان عقلی که مشکلی ایجاد نکرده است معمولاً در جای خود می‌ماند و در معاینه‌های منظم بررسی می‌شود، چون ممکن است بعدها مشکل ایجاد کند.

          اینکه کشیدن ساده کافی است یا جراحی لازم است، به جای دندان عقل و وضعیت آن بستگی دارد. دندانپزشک این را پس از معاینه و عکس رادیوگرافی می‌گوید. دربارهٔ کشیدن ساده، صفحهٔ [کشیدن دندان](/خدمات/کشیدن-دندان) را ببینید.

          بسته به وضعیت دندان، دندانپزشک ممکن است دندان عقل را خودش بیرون بیاورد یا شما را برای جراحی به بیمارستان یا مرکز دیگری ارجاع دهد. این صفحه دربارهٔ جراحی دندان عقل است. اگر برای مشکل دیگری در فک مراجعه می‌کنید، دندانپزشک پس از معاینه می‌گوید چه درمانی لازم است.
      - type: callout
        tone: info
        text: انتخاب درمان با معاینه و تشخیص دندانپزشک است. پیش از جراحی، بیماری‌ها، داروها و حساسیت‌های دارویی‌تان را به دندانپزشک بگویید. اگر داروی ضدانعقاد (رقیق‌کنندهٔ خون) مصرف می‌کنید، بگویید، چون این داروها خونریزی را بیشتر می‌کنند. دارو را خودسرانه قطع نکنید؛ تصمیم دربارهٔ آن با پزشک شماست. داروی پوکی استخوان و پرتودرمانی سر و گردن را هم بگویید؛ به‌ندرت جراحی ممکن است به استخوان فک آسیب بزند.
      - type: steps
        items:
          - title: معاینه و عکس
            text: دندانپزشک دهان را معاینه می‌کند و با عکس رادیوگرافی جای دندان عقل و وضعیت آن را بررسی می‌کند. دربارهٔ بیماری‌ها و داروهایتان هم می‌پرسد.
          - title: بی‌حسی
            text: لثهٔ اطراف دندان معمولاً با تزریق بی‌حسی موضعی بی‌حس می‌شود. دندانپزشک پیش از شروع مطمئن می‌شود بی‌حسی کافی است.
          - title: بیرون آوردن دندان
            text: اگر لثه روی دندان را پوشانده باشد، لثه باز می‌شود. جای دندان کمی گشاد می‌شود و دندان یک‌تکه یا در دو یا سه تکه بیرون آورده می‌شود. این کار اغلب چند دقیقه طول می‌کشد.
          - title: بخیه
            text: در صورت نیاز، لثه بخیه می‌شود. دندانپزشک می‌گوید بخیه‌ها خودشان جذب می‌شوند یا برای کشیدن آن‌ها باید مراجعه کنید.
          - title: دستور مراقبت
            text: روی زخم لختهٔ خون شکل می‌گیرد که به بهبود کمک می‌کند. دندانپزشک می‌گوید در روزهای بعد چه کنید و چه مسکنی مصرف کنید.
      - type: content
        text: |-
          ## بعد از جراحی دندان عقل
          معمولاً از روز بعد می‌توانید به کارهای روزمره برگردید. اگر بیرون آوردن دندان دشوارتر بوده است، ممکن است یک تا سه روز استراحت لازم باشد.

          تا دو هفته بعد از جراحی، این حالت‌ها معمول است:

          - درد و ورم، که معمولاً پس از یکی دو روز رو به بهبود می‌رود
          - کبودی روی گونه
          - درد و خشکی فک
          - ناراحتی هنگام جویدن و بلعیدن

          برای بهبود بهتر:

          - مسکن را طبق دستور دندانپزشک مصرف کنید.
          - تا وقتی جویدن راحت‌تر شود، غذای نرم یا آبکی بخورید.
          - زخم را با شستن آرام دهان با دهان‌شویه یا آب نمک ولرم تمیز نگه دارید.
          - دندان‌های دیگر را با دقت مسواک بزنید، ولی به محل زخم نزنید تا بخیه و لختهٔ خون آسیب نبینند.
          - تا ۲۴ ساعت با نی ننوشید.
          - غذای سفت و ترد و چیزهایی مثل آجیل و دانه که در زخم گیر می‌کنند نخورید.
          - سیگار نکشید. سیگار خطر عفونت را بیشتر می‌کند.
          - نوشیدنی الکلی و نوشیدنی خیلی داغ ننوشید.

          اگر خونریزی داشتید، یک تکه پارچهٔ تمیز یا پنبه را دست‌کم ۱۰ دقیقه روی محل فشار دهید.

          ## خطرها و عوارض
          جراحی دندان عقل معمولاً کار ساده‌ای است، اما مثل هر جراحی ممکن است عارضه داشته باشد. دندانپزشک پیش از جراحی خطرها را برایتان توضیح می‌دهد.

          - خشکی حفره: لختهٔ خون روی حفره درست شکل نمی‌گیرد یا پیش از بهبود لثه جدا می‌شود و حفره دردناک می‌شود. در این حالت با کلینیک تماس بگیرید.
          - عفونت، که ممکن است به آنتی‌بیوتیک نیاز داشته باشد.
          - آسیب به عصب‌های نزدیک دندان که باعث بی‌حسی یا گزگز زبان، لب یا چانه می‌شود. این حالت معمولاً بهتر می‌شود، ولی ممکن است چند هفته یا چند ماه طول بکشد. در موارد کم، ممکن است ماندگار باشد. آسیب عصب زبان ممکن است حس چشایی را هم تغییر دهد.

          ## چه وقت با کلینیک تماس بگیرید؟
          - خونریزی بند نمی‌آید.
          - درد و ورم شدید است یا بیشتر می‌شود و مسکن کمکی نمی‌کند.
          - درد با مزهٔ بد در دهان، تب یا حال ناخوش همراه است.
          - بی‌حسی یا گزگز زبان، لب یا چانه پس از تمام شدن اثر بی‌حسی ادامه دارد.

          اگر کلینیک بسته است و خونریزی بند نمی‌آید، به اورژانس نزدیک‌ترین بیمارستان بروید.
      - type: callout
        tone: warning
        text: اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید. اگر دور چشم یا گردن ورم کرده است، دهانتان به‌سختی باز می‌شود یا داخل دهان خیلی ورم کرده است، همین حالا به اورژانس بیمارستان بروید.
    faqs:
      - question: آیا جراحی دندان عقل درد دارد؟
        answer: >-
          لثهٔ اطراف دندان معمولاً با بی‌حسی موضعی بی‌حس می‌شود و دندانپزشک
          پیش از شروع مطمئن می‌شود بی‌حسی کافی است. بعد از جراحی، درد و ورم
          معمول است و معمولاً پس از یکی دو روز رو به بهبود می‌رود. مسکن را طبق
          دستور دندانپزشک مصرف کنید.
      - question: از کجا بدانم کشیدن ساده کافی است یا جراحی لازم است؟
        answer: >-
          دندانپزشک دهان را معاینه می‌کند و با عکس رادیوگرافی جای دندان عقل را
          می‌بیند. اگر دندان نهفته باشد یا لثه روی آن را پوشانده باشد، ممکن است
          جراحی لازم شود. انتخاب درمان با معاینه و تشخیص دندانپزشک است.
      - question: جراحی دندان عقل چقدر طول می‌کشد؟
        answer: >-
          اغلب چند دقیقه طول می‌کشد و معمولاً بیشتر از ۴۰ دقیقه نمی‌شود. زمان جراحی شما به
          جای دندان و وضعیت آن بستگی دارد و دندانپزشک پس از معاینه آن را
          توضیح می‌دهد.
      - question: بعد از جراحی دندان عقل کی می‌توانم سر کار بروم؟
        answer: >-
          معمولاً از روز بعد. اگر بیرون آوردن دندان دشوارتر بوده باشد، ممکن است
          یک تا سه روز استراحت لازم باشد. درد، ورم و خشکی فک ممکن است تا دو
          هفته ادامه پیدا کند و کم‌کم بهتر شود.
      - question: بعد از جراحی دندان عقل چه بخورم؟
        answer: >-
          تا وقتی جویدن راحت‌تر شود، غذای نرم یا آبکی بخورید. غذای سفت و ترد و
          چیزهایی مثل آجیل و دانه که در زخم گیر می‌کنند نخورید. نوشیدنی الکلی و
          نوشیدنی خیلی داغ ننوشید و تا ۲۴ ساعت با نی ننوشید.
      - question: آیا جراحی دندان عقل به عصب آسیب می‌زند؟
        answer: >-
          گاهی. آسیب به عصب‌های نزدیک دندان ممکن است باعث بی‌حسی یا گزگز زبان،
          لب یا چانه شود. این حالت معمولاً بهتر می‌شود، ولی ممکن است چند هفته یا
          چند ماه طول بکشد. در موارد کم، ممکن است ماندگار باشد. آسیب عصب زبان
          ممکن است حس چشایی را هم تغییر دهد. دندانپزشک پیش از جراحی خطرها را برایتان توضیح
          می‌دهد.
      - question: هزینهٔ جراحی دندان عقل چقدر است؟
        answer: >-
          هزینه به جای دندان، وضعیت آن و دشواری جراحی بستگی دارد و پس از معاینه
          مشخص می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
