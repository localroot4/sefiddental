  - key: overdenture
    category: surgery-replacement
    nav_label: اوردنچر
    h1: اوردنچر (دندان مصنوعی متکی به ایمپلنت)
    seo_title: اوردنچر؛ دندان مصنوعی روی ایمپلنت
    slug: اوردنچر
    booking_group: implant
    priority: 3
    search_terms: [اوردنچر, دندان مصنوعی روی ایمپلنت, قیمت اوردنچر]
    summary: دندان مصنوعی متحرکی که روی چند ایمپلنت محکم می‌شود و هنگام غذا خوردن و صحبت کردن کمتر جابه‌جا می‌شود.
    seo_description: >-
      اوردنچر یا دندان مصنوعی متکی به ایمپلنت در کلینیک دندانپزشکی سفید:
      برای چه کسی مناسب است، مراحل درمان، مراقبت روزانه، عوارض و دوام
      اوردنچر.
    sessions: معمولاً چند جلسه در طول چند ماه
    duration: معمولاً چند ماه تا گذاشتن اوردنچر نهایی
    recovery: جوش خوردن ایمپلنت معمولاً چند ماه؛ عادت به اوردنچر چند هفته
    related: [implant, extraction, scaling]
    body:
      - type: content
        text: |-
          ## اوردنچر چیست؟
          در این صفحه، منظور از اوردنچر دندان مصنوعی متحرکی است که روی چند [ایمپلنت دندان](/خدمات/ایمپلنت-دندان) محکم می‌شود. ایمپلنت‌ها پایه‌هایی هستند که با جراحی در استخوان فک قرار می‌گیرند. قطعه‌های اتصال، ایمپلنت‌ها را به سطح زیرین دندان مصنوعی وصل می‌کنند و آن را سر جایش نگه می‌دارند.

          دندان مصنوعی معمولی روی لثه قرار می‌گیرد. با بالا رفتن سن، لثه و استخوان فک ممکن است تحلیل بروند و دندان مصنوعی لق شود. در اوردنچر، ایمپلنت‌ها تکیه‌گاه دندان مصنوعی‌اند و به ثابت ماندن آن کمک می‌کنند. اوردنچر را می‌توانید برای تمیز کردن بیرون بیاورید.

          ## برای چه کسی مناسب است؟
          - همهٔ دندان‌های فک بالا یا پایین را از دست داده‌اید.
          - دندان مصنوعی فعلی‌تان لق است یا هنگام غذا خوردن و صحبت کردن جابه‌جا می‌شود.
          - دندان مصنوعی‌تان ناراحت است و می‌خواهید جایگزین دیگری را بررسی کنید.

          از دست دادن دندان‌ها جویدن غذا را سخت می‌کند و ممکن است باعث افتادگی عضلات صورت شود.

          ## چه وقت اوردنچر مناسب نیست؟
          اوردنچر به ایمپلنت نیاز دارد، پس شرط‌های ایمپلنت دربارهٔ آن هم صدق می‌کند. برای ایمپلنت، سلامت عمومی شما از سنتان مهم‌تر است.

          - بیماری‌های مزمن مثل دیابت یا سرطان خون ممکن است بهبود بعد از جراحی را مختل کنند.
          - مصرف دخانیات بهبود را کند می‌کند.
          - اگر استخوان فک برای نگه داشتن ایمپلنت کافی نباشد، ممکن است افزایش حجم استخوان لازم شود. این کار خودش یک جراحی است و ممکن است عارضه داشته باشد.

          اوردنچر متحرک است. اگر جایگزینی ثابت می‌خواهید، دربارهٔ راه‌های دیگر با دندانپزشک صحبت کنید.
      - type: callout
        tone: info
        text: انتخاب درمان با معاینه و تشخیص دندانپزشک است. پیش از جراحی، بیماری‌ها، داروها و حساسیت‌های دارویی‌تان را به دندانپزشک بگویید. اگر داروی پوکی استخوان مصرف می‌کنید یا پرتودرمانی سر و گردن داشته‌اید، این را هم بگویید، چون در موارد نادر جراحی ایمپلنت ممکن است به استخوان فک آسیب بزند. اگر سیگار می‌کشید، آن را هم بگویید.
      - type: steps
        items:
          - title: معاینه و بررسی استخوان
            text: دندانپزشک دهان، لثه و استخوان فک را معاینه می‌کند و عکس رادیوگرافی می‌گیرد. دربارهٔ بیماری‌ها و داروهایتان هم می‌پرسد. ممکن است پیش از جراحی، پزشکتان هم وضعیت سلامت شما را بررسی کند.
          - title: کاشت ایمپلنت‌ها
            text: دندانپزشک پیش از جراحی دربارهٔ روش بی‌حسی با شما صحبت می‌کند. ایمپلنت‌ها با جراحی در استخوان فک قرار می‌گیرند. تعداد و جای آن‌ها پس از معاینه و عکس رادیوگرافی مشخص می‌شود.
          - title: جوش خوردن استخوان
            text: استخوان باید دور ایمپلنت‌ها رشد کند و آن‌ها را محکم بگیرد. این مرحله معمولاً چند ماه طول می‌کشد. در این مدت ممکن است از دندان مصنوعی موقت استفاده کنید.
          - title: ساخت اوردنچر
            text: دندانپزشک از دهان شما اندازه و قالب می‌گیرد و دندان مصنوعی برای دهان و ایمپلنت‌های شما ساخته می‌شود. ساخت آن معمولاً چند هفته طول می‌کشد.
          - title: وصل کردن و تنظیم
            text: اوردنچر روی ایمپلنت‌ها قرار می‌گیرد و جا افتادن آن بررسی می‌شود. پس از آن، معمولاً جلسه‌های پیگیری لازم است تا اوردنچر بررسی و تنظیم شود.
      - type: content
        text: |-
          ## بعد از جراحی کاشت ایمپلنت‌ها
          بعد از جراحی، درد و تورم ممکن است. مسکن را طبق دستور دندانپزشک مصرف کنید. در دورهٔ بهبود، غذای نرم، خوراکی‌های سرد و سوپ ولرم بخورید. سیگار نکشید، چون دخانیات بهبود را کند می‌کند. اگر درد یا تورم به‌جای کم شدن بیشتر شد، با کلینیک تماس بگیرید.

          ## بعد از گذاشتن اوردنچر
          عادت کردن به دندان مصنوعی تازه ممکن است چند هفته طول بکشد. در این مدت، کمی ناراحتی یا زخم در دهان و بیشتر شدن بزاق ممکن است. تا وقتی راحت شوید، غذای نرم‌تر بخورید. اگر ناراحتی یا زخم ادامه پیدا کرد، با کلینیک تماس بگیرید.

          - اوردنچر را هر صبح و شب بیرون بیاورید و با مسواک نرم و صابون ملایم بشویید. با خمیردندان آن را نشویید، چون ممکن است به آن آسیب بزند.
          - بعد از غذا، اوردنچر را با آب سرد بشویید.
          - اوردنچر را بالای سینک پر از آب یا روی حوله بشویید تا اگر از دستتان افتاد نشکند.
          - لثه، زبان و اطراف ایمپلنت‌ها را هر روز همان‌طور که دندانپزشک آموزش می‌دهد تمیز کنید.
          - شب‌ها اوردنچر را بیرون بیاورید، مگر اینکه دندانپزشک چیز دیگری بگوید. وقتی اوردنچر در دهان نیست، آن را در آب نگه دارید.

          معاینه و تمیز کردن منظم در مطب به سالم ماندن لثهٔ دور ایمپلنت‌ها کمک می‌کند. دندانپزشک در این معاینه‌ها جا افتادن اوردنچر را هم بررسی می‌کند.

          ## خطرها و عوارض
          - عفونت بعد از کاشت ایمپلنت. اگر اطراف ایمپلنت عفونی شود، درمان سخت است و اغلب باید ایمپلنت برداشته شود.
          - شکست ایمپلنت: ایمپلنت ممکن است محکم نماند و از دست برود.
          - التهاب لثه و استخوان دور ایمپلنت (پری‌ایمپلنتیت) که با پلاک شروع می‌شود و ممکن است به از دست رفتن ایمپلنت برسد.
          - آسیب به عصب نزدیک محل جراحی، به‌ویژه در فک پایین، که ممکن است باعث بی‌حسی یا گزگز لب، چانه یا زبان شود. این حالت اغلب بهتر می‌شود، ولی ممکن است ماندگار باشد.
          - زخم یا عفونت در دهان، اگر اوردنچر خوب تمیز یا به‌موقع تنظیم نشود.
          - قطعه‌های اتصال ممکن است با گذشت زمان به تعمیر یا تعویض نیاز داشته باشند. گاهی هم سطح زیرین اوردنچر باید دوباره بازسازی شود (ریلاین) تا خوب جا بیفتد.

          ## چه وقت با کلینیک تماس بگیرید؟
          - بعد از جراحی، درد یا تورم به‌جای کم شدن بیشتر می‌شود.
          - بی‌حسی یا گزگز لب، چانه یا زبان پس از تمام شدن اثر بی‌حسی ادامه دارد.
          - اوردنچر هنگام صحبت کردن صدا می‌دهد، جابه‌جا می‌شود یا حس می‌کنید دیگر خوب جا نمی‌افتد.
          - اوردنچر درد ایجاد می‌کند.
          - اوردنچر ساییده یا شکسته است. اگر شکست، تکه‌هایش را همراه بیاورید.
          - لثه‌هایتان خیلی قرمز است یا خونریزی دارد، یا بوی بد دهان دارید.
    faqs:
      - question: فرق اوردنچر با دندان مصنوعی معمولی چیست؟
        answer: >-
          دندان مصنوعی معمولی روی لثه قرار می‌گیرد. اوردنچر با قطعه‌های اتصال
          روی چند ایمپلنت محکم می‌شود و ایمپلنت‌ها به ثابت ماندن آن کمک
          می‌کنند. هر دو را می‌شود برای تمیز کردن بیرون آورد.
      - question: اوردنچر روی چند ایمپلنت قرار می‌گیرد؟
        answer: >-
          تعداد ایمپلنت‌ها به فک شما و وضعیت استخوان آن بستگی دارد.
          دندانپزشک پس از معاینه و عکس رادیوگرافی تعداد و جای ایمپلنت‌ها را
          مشخص می‌کند. تعداد ایمپلنت‌ها و نوع قطعه‌های اتصال بر دوام اوردنچر،
          نیاز به تعمیر و هزینه اثر دارد.
      - question: درمان اوردنچر چقدر طول می‌کشد؟
        answer: >-
          معمولاً چند ماه. پس از کاشت، استخوان باید دور ایمپلنت‌ها جوش بخورد
          و این کار معمولاً چند ماه طول می‌کشد. ساخت اوردنچر هم معمولاً چند
          هفته زمان می‌برد. زمان درمان شما پس از معاینه مشخص می‌شود.
      - question: آیا کاشت ایمپلنت برای اوردنچر درد دارد؟
        answer: >-
          دندانپزشک پیش از جراحی دربارهٔ روش بی‌حسی با شما صحبت می‌کند.
          بی‌حسی موضعی دارویی است که ناحیهٔ درمان را در طول کار بی‌حس می‌کند.
          بعد از جراحی، درد و تورم ممکن
          است. مسکن را طبق دستور دندانپزشک مصرف کنید.
      - question: چطور به اوردنچر عادت کنم؟
        answer: >-
          عادت کردن معمولاً چند هفته طول می‌کشد. در این مدت ممکن است کمی
          ناراحتی یا زخم در دهان داشته باشید. تا وقتی راحت شوید، غذای نرم‌تر
          بخورید. اگر زخم یا ناراحتی ادامه پیدا کرد، با کلینیک تماس بگیرید.
      - question: اوردنچر چقدر دوام دارد؟
        answer: >-
          اگر خوب از اوردنچر مراقبت کنید و منظم به دندانپزشک سر بزنید، ممکن
          است سال‌ها کار کند، اما همیشگی نیست. قطعه‌های اتصال ممکن است با گذشت زمان به تعمیر یا تعویض نیاز داشته
          باشند. التهاب لثه و استخوان دور ایمپلنت هم ممکن است به از دست رفتن
          ایمپلنت برسد. تمیز کردن روزانه و معاینهٔ منظم به ماندگاری آن کمک
          می‌کند.
      - question: هزینهٔ اوردنچر چقدر است؟
        answer: >-
          هزینه به تعداد ایمپلنت‌ها، وضعیت استخوان، نیاز به افزایش حجم استخوان
          و نوع اوردنچر بستگی دارد. هزینهٔ شما پس از معاینه مشخص می‌شود. پیش از
          شروع درمان، هزینه را از پذیرش بپرسید.
