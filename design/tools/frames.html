<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Storyboard frames generator</title>
<link rel="stylesheet" href="../tokens.css">
<style>
@font-face{font-family:Vazirmatn;src:url(../fonts/Vazirmatn[wght].woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:Estedad;src:url(../fonts/Estedad-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
body{margin:0;background:#ddd;font-family:var(--font-body);color:var(--color-ink);padding:16px;display:flex;flex-wrap:wrap;gap:16px}
.frame{position:relative;background:var(--color-surface);border:1px solid var(--color-line);overflow:hidden;box-sizing:border-box}
.frame.d{width:640px;height:400px}.frame.p{width:200px;height:400px}
.tag{position:absolute;top:8px;inset-inline-start:8px;font-size:11px;color:var(--color-ink-muted);background:var(--color-surface-raised);border:1px solid var(--color-line);border-radius:6px;padding:2px 6px;z-index:5}
.nav{position:absolute;top:0;inset-inline:0;height:28px;border-bottom:1px solid var(--color-line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:9px}
.pill{background:var(--color-brand);color:#fff;border-radius:999px;padding:2px 8px;font-size:9px}
.box{position:absolute;border:1.5px dashed var(--color-line-strong);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--color-ink-muted);padding:4px;box-sizing:border-box}
.text{position:absolute;font-size:10px;line-height:1.6}
.h{font-family:var(--font-display);font-size:16px;color:var(--color-ink);line-height:1.3}
.d .h{font-size:20px}
.btn{display:inline-block;background:var(--color-brand);color:#fff;border-radius:999px;padding:3px 10px;font-size:9px;margin-inline-end:4px}
.btn.s{background:transparent;color:var(--color-brand);border:1px solid var(--color-brand)}
.mark{position:absolute;background:var(--color-brand);opacity:.18;border-radius:30% 30% 30% 30%/40% 40% 40% 40%;clip-path:polygon(0 0,70% 0,100% 45%,100% 100%,30% 100%,0 55%)}
.relief{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9e9e4 60%,#dcdcd6);box-shadow:0 6px 14px rgb(10 36 63/.08)}
.gem{position:absolute;width:8px;height:8px;background:var(--color-ink);transform:rotate(45deg)}
.bar{position:absolute;height:3px;background:var(--color-brand);border-radius:2px}
.arrow{position:absolute;font-size:10px;color:var(--color-brand);font-weight:700}
.cam{position:absolute;bottom:6px;inset-inline-end:8px;font-size:9px;color:var(--color-ink-faint)}
.sticky{position:absolute;bottom:0;inset-inline:0;height:26px;display:flex;border-top:1px solid var(--color-line);background:var(--color-surface-raised);font-size:8px}
.sticky div{flex:1;display:flex;align-items:center;justify-content:center}.sticky div:last-child{background:var(--color-brand);color:#fff}
.warm{background:linear-gradient(180deg,var(--color-surface),var(--color-warm-soft))}
</style>
</head>
<body>
<script>
const frames=[
{id:'00-intro',t:'۰ ورود',d:`<div class="box" style="inset:0;border:0;background:var(--color-surface)"></div><div class="gem" style="top:60px;left:120px"></div><div class="gem" style="top:330px;left:520px"></div><div class="gem" style="top:40px;left:560px"></div><div class="gem" style="top:350px;left:90px"></div><div class="mark" style="width:70px;height:90px;top:150px;left:285px;opacity:.9"></div><div class="bar" style="width:260px;top:265px;left:190px"></div><div class="text" style="top:280px;left:0;right:0;text-align:center;color:var(--color-ink-muted)">میله = خط بارگذاری واقعی؛ الماس‌ها از لبه‌ها می‌آیند</div><div class="cam">هیرو زیر پرده رندر شده است</div>`,p:`<div class="gem" style="top:50px;left:20px"></div><div class="gem" style="top:330px;left:170px"></div><div class="mark" style="width:50px;height:64px;top:150px;left:75px;opacity:.9"></div><div class="bar" style="width:120px;top:235px;left:40px"></div>`},
{id:'01-hero',t:'۱ هیرو ۰ تا ۱۰۰vh',d:`<div class="nav"><span class="pill">رزرو نوبت</span><span>خدمات · پزشکان · قبل و بعد · هزینه و پرداخت · آدرس و ساعات</span><span>لوگو</span></div><div class="text" style="top:70px;right:40px;width:270px"><div class="h">اولین کلینیک دندانپزشکی دیجیتال جنوب تهران</div><div style="margin-top:8px;color:var(--color-ink-muted)">زیرنویس حداکثر ۲۰ کلمه؛ مشاورهٔ اول رایگان</div><div style="margin-top:10px"><span class="btn">رزرو نوبت</span><span class="btn s">تماس با کلینیک</span></div></div><div class="box" style="top:50px;left:40px;width:260px;height:300px;clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,30% 100%,0 70%)">عکس واقعی ۳:۲ در ماسک نشان</div><div class="relief" style="width:90px;height:90px;top:230px;left:260px"></div><div class="gem" style="top:60px;right:330px"></div><div class="gem" style="top:150px;right:320px"></div><div class="cam">دوربین: روبه‌رو، نور سرد سحر</div>`,p:`<div class="nav"><span>☰</span><span>لوگو</span></div><div class="text" style="top:44px;right:12px;left:12px"><div class="h">اولین کلینیک دندانپزشکی دیجیتال جنوب تهران</div><div style="color:var(--color-ink-muted);margin-top:4px">زیرنویس کوتاه</div></div><div class="box" style="top:150px;left:12px;right:12px;height:150px">عکس ۴:۵ با ماسک</div><div class="text" style="top:312px;right:12px"><span class="btn">رزرو نوبت</span><span class="btn s">تماس</span></div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'02-trust',t:'۲ نوار اعتماد ۱۰۰ تا ۱۴۰vh',d:`<div class="box" style="top:150px;left:40px;right:40px;height:90px;border-style:solid;background:var(--color-surface-sunken);border-color:var(--color-line)">مشاورهٔ اول رایگان · نوبت اورژانس همان روز در صورت امکان · (عدد تأییدشده) · (عدد تأییدشده)</div><div class="text" style="top:255px;right:40px;color:var(--color-ink-muted)">شمارنده‌ها یک بار بالا می‌روند؛ دوربین ۳ درجه کج می‌شود</div><div class="relief" style="width:60px;height:60px;top:60px;left:120px"></div>`,p:`<div class="box" style="top:120px;left:12px;right:12px;height:150px;border-style:solid;background:var(--color-surface-sunken);border-color:var(--color-line)">چهار واقعیت در ۲×۲</div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'03-services',t:'۳ خدمات: چرخش افقی ۱۴۰ تا ۴۴۰vh (پین)',d:`<div class="arrow" style="top:40px;right:40px">◀ ریل افقی با اسکرول عمودی</div><div class="mark" style="width:36px;height:46px;top:60px;left:302px;opacity:.9"></div><div class="text" style="top:60px;left:345px;color:var(--color-ink-muted)">نشان به آیکون هر دسته مورف می‌شود</div><div class="box" style="top:130px;right:40px;width:170px;height:200px">زیبایی<br>۶ خدمت</div><div class="box" style="top:130px;right:230px;width:170px;height:200px">جراحی و جایگزینی<br>۵ خدمت</div><div class="box" style="top:130px;right:420px;width:170px;height:200px;opacity:.5">درمان و نگهداری</div><div class="bar" style="width:600px;top:360px;left:20px;opacity:.3"></div><div class="bar" style="width:140px;top:360px;right:20px"></div><div class="relief" style="width:160px;height:160px;top:200px;left:-60px;opacity:.6"></div><div class="cam">پس‌زمینهٔ WebGL با نیم‌سرعت؛ کارت‌ها DOM</div>`,p:`<div class="mark" style="width:30px;height:38px;top:50px;left:85px;opacity:.9"></div><div class="text" style="top:95px;right:12px;left:12px;text-align:center;color:var(--color-ink-muted)">ردیف اسکرول افقی بومی با snap</div><div class="box" style="top:130px;right:12px;width:140px;height:180px">زیبایی</div><div class="box" style="top:130px;right:164px;width:140px;height:180px">جراحی</div><div class="bar" style="width:170px;top:325px;left:15px;opacity:.3"></div><div class="bar" style="width:40px;top:325px;right:15px"></div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'04-tiers',t:'۴ سه سطح ترمیم ۴۴۰ تا ۶۴۰vh (پین، اسکراب)',d:`<div class="relief" style="width:170px;height:150px;top:110px;left:80px;border-radius:40% 40% 45% 45%"></div><div class="text" style="top:160px;left:118px;font-size:9px;color:var(--color-ink-faint)">مولر چینی روی گردان</div><div class="text" style="top:90px;right:40px;width:280px"><div class="h">ترمیم دندان در سه سطح</div><div style="margin-top:6px"><span class="pill" style="background:var(--color-warm);color:var(--color-on-warm)">VIP</span> <span style="color:var(--color-ink-muted)">معمولی · CIP</span></div><div style="margin-top:8px;color:var(--color-ink-muted)">یک خط توضیح هر سطح؛ CTA سطح را با خود می‌برد</div><div style="margin-top:10px"><span class="btn">رزرو نوبت</span></div></div><div class="bar" style="width:6px;height:180px;top:110px;right:14px;opacity:.3"></div><div class="bar" style="width:6px;height:60px;top:170px;right:14px"></div><div class="cam">۵۰٪: VIP؛ ۱۰۰٪: شیدر رنگ‌آمیزی CIP</div>`,p:`<div class="relief" style="width:120px;height:105px;top:60px;left:40px;border-radius:40% 40% 45% 45%"></div><div class="text" style="top:190px;right:12px;left:12px"><div class="h">ترمیم در سه سطح</div><div class="box" style="position:static;height:34px;margin-top:8px">معمولی | VIP | CIP (ضربه‌ای)</div><div style="margin-top:8px"><span class="btn">رزرو نوبت</span></div></div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'05-workflow',t:'۵ فرایند دیجیتال: مورب ۶۴۰ تا ۹۴۰vh (پین)',d:`<div class="arrow" style="top:40px;right:60px">↙ مسیر مورب دوربین</div><div class="box" style="top:50px;right:40px;width:150px;height:112px">اسکن<br>ابر نقطه</div><div class="box" style="top:130px;right:210px;width:150px;height:112px">طراحی<br>وایرفریم</div><div class="box" style="top:210px;right:380px;width:150px;height:112px">ساخت<br>مینا</div><div class="box" style="top:280px;left:40px;width:150px;height:112px;background:var(--color-warm-soft)">لبخند<br>عکس واقعی</div><div class="gem" style="top:100px;right:30px"></div><div class="gem" style="top:180px;right:200px"></div><div class="gem" style="top:260px;right:370px"></div><div class="cam">نور از سرد به گرم</div>`,p:`<div class="box" style="top:40px;right:28px;left:12px;height:70px">اسکن</div><div class="gem" style="top:70px;right:10px"></div><div class="box" style="top:122px;right:28px;left:12px;height:70px">طراحی</div><div class="gem" style="top:152px;right:10px"></div><div class="box" style="top:204px;right:28px;left:12px;height:70px">ساخت</div><div class="gem" style="top:234px;right:10px"></div><div class="box" style="top:286px;right:28px;left:12px;height:70px;background:var(--color-warm-soft)">لبخند</div><div class="gem" style="top:316px;right:10px"></div>`},
{id:'06-cases',t:'۶ قبل و بعد ۹۴۰ تا ۱۰۴۰vh',d:`<div class="box" style="top:60px;right:40px;width:380px;height:260px">قبل | بعد<br>اسلایدر مقایسه با دستگیرهٔ ۴۴px</div><div class="bar" style="width:3px;height:260px;top:60px;right:230px"></div><div class="box" style="top:60px;left:40px;width:150px;height:120px">نمونهٔ ۲</div><div class="box" style="top:200px;left:40px;width:150px;height:120px">نمونهٔ ۳</div><div class="cam">لبهٔ محو با displacement در سطح ۲ و ۳</div>`,p:`<div class="box" style="top:40px;right:12px;left:12px;height:200px">قبل | بعد</div><div class="bar" style="width:3px;height:200px;top:40px;right:100px"></div><div class="text" style="top:255px;right:12px;color:var(--color-brand)">همهٔ نمونه‌ها</div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'07-dentists',t:'۷ پزشکان ۱۰۴۰ تا ۱۱۴۰vh',d:`<div class="box" style="top:50px;right:40px;width:170px;height:290px">پرتره ۴:۵<br>نام · تخصص · شماره نظام</div><div class="box" style="top:50px;right:235px;width:170px;height:290px">پرتره ۴:۵</div><div class="box" style="top:50px;right:430px;width:170px;height:290px">پرتره ۴:۵</div><div class="cam">پارالاکس عمق با اشاره‌گر دقیق؛ پنهان تا انتشار اولین پزشک</div>`,p:`<div class="box" style="top:40px;right:12px;width:150px;height:260px">پرتره</div><div class="box" style="top:40px;right:172px;width:150px;height:260px">پرتره</div><div class="text" style="top:310px;right:12px;left:12px;text-align:center;color:var(--color-ink-muted)">کاروسل snap</div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'08-voices',t:'۸ صدای بیماران ۱۱۴۰ تا ۱۲۴۰vh',d:`<div class="box" style="top:70px;right:60px;width:160px;height:240px;transform:rotateY(12deg)">ویدئو ۱<br>پوستر + پخش</div><div class="box" style="top:50px;right:240px;width:170px;height:280px">ویدئو ۲</div><div class="box" style="top:70px;right:430px;width:160px;height:240px">ویدئو ۳</div><div class="text" style="top:345px;right:60px;font-size:9px;color:var(--color-ink-faint)">با رضایت کتبی بیماران</div>`,p:`<div class="box" style="top:40px;right:12px;left:12px;height:240px">ویدئو ۱</div><div class="text" style="top:300px;right:12px;font-size:9px;color:var(--color-ink-faint)">با رضایت کتبی بیماران</div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'09-firstvisit',t:'۹ اولین مراجعه و پرسش‌ها ۱۲۴۰ تا ۱۳۶۰vh',cls:'warm',d:`<div class="text" style="top:40px;right:40px;width:300px"><div class="h">اولین مراجعه چگونه است؟</div><div style="margin-top:8px;color:var(--color-ink-muted)">۱ گفت‌وگو ۲ معاینه ۳ طرح درمان ۴ تصمیم بدون فشار</div></div><div class="box" style="top:150px;right:40px;width:300px;height:170px">آکاردئون پرسش‌ها (۶)</div><div class="box" style="top:150px;left:40px;width:200px;height:120px;border-style:solid">کنار ثابت: تماس · واتساپ · رزرو</div><div class="cam">نور دنیا گرم می‌شود</div>`,p:`<div class="text" style="top:40px;right:12px;left:12px"><div class="h">اولین مراجعه چگونه است؟</div></div><div class="box" style="top:110px;right:12px;left:12px;height:200px">آکاردئون</div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'10-booking',t:'۱۰ رزرو ۱۳۶۰ تا ۱۴۶۰vh',cls:'warm',d:`<div class="box" style="top:50px;right:40px;width:280px;height:280px;border-style:solid;background:var(--color-surface-raised)">درخواست نوبت<br>شمارهٔ موبایل (تنها فیلد لازم)<br>چیپ خدمت · چیپ زمان<br>[ثبت درخواست]</div><div class="mark" style="width:60px;height:78px;top:140px;left:260px;opacity:.6"></div><div class="box" style="top:50px;left:40px;width:190px;height:180px">نقشهٔ ایستا + مسیریابی</div><div class="text" style="top:245px;left:40px;color:var(--color-ink-muted)">هر روز ۱۰ تا ۲۰</div>`,p:`<div class="box" style="top:40px;right:12px;left:12px;height:230px;border-style:solid;background:var(--color-surface-raised)">فرم یک‌فیلدی</div><div class="box" style="top:285px;right:12px;left:12px;height:70px">نقشه + ساعات</div>`},
{id:'11-footer',t:'۱۱ فوتر: زمین بازی ۱۴۶۰ تا ۱۵۶۰vh',d:`<div class="bar" style="width:560px;top:36px;left:40px;opacity:.25"></div><div class="arrow" style="top:44px;right:60px">↓ قطعات لوگو از خط هدر می‌افتند</div><div class="mark" style="width:60px;height:78px;top:230px;left:120px;opacity:.9"></div><div class="gem" style="top:300px;left:260px"></div><div class="gem" style="top:285px;left:330px"></div><div class="gem" style="top:310px;left:400px"></div><div class="gem" style="top:296px;left:470px"></div><div class="bar" style="width:200px;top:316px;left:200px"></div><div class="text" style="top:120px;right:40px;width:260px;color:var(--color-ink-muted)">بکش و پرت کن؛ بعد از ۶ ثانیه برمی‌گردند. دکمهٔ «پخش دوباره» برای کیبورد</div><div class="box" style="top:340px;left:40px;right:40px;height:50px;border:0;border-top:1px solid var(--color-line);border-radius:0">نشانی · تلفن · ساعات · پروانه · مسئول فنی</div>`,p:`<div class="mark" style="width:44px;height:56px;top:200px;left:30px;opacity:.9"></div><div class="gem" style="top:250px;left:110px"></div><div class="gem" style="top:262px;left:140px"></div><div class="bar" style="width:90px;top:280px;left:90px"></div><div class="text" style="top:60px;right:12px;left:12px;color:var(--color-ink-muted)">لمس و پرتاب</div><div class="box" style="top:320px;left:12px;right:12px;height:60px;border:0;border-top:1px solid var(--color-line);border-radius:0">نشانی · تلفن · ساعات</div>`},
];
for(const f of frames){ for(const v of ['d','p']){ const el=document.createElement('div'); el.className='frame '+v+' '+(f.cls||''); el.dataset.name=f.id+'-'+(v==='d'?'desktop':'phone'); el.innerHTML=`<div class="tag">${f.t} · ${v==='d'?'دسکتاپ':'موبایل'}</div>`+f[v]; document.body.appendChild(el);} }
</script>
</body>
</html>
