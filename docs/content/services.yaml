  # ---- surgery and replacement ----
  - key: implant
    category: surgery-replacement
    nav_label: ایمپلنت دندان
    h1: ایمپلنت دندان
    seo_title: ایمپلنت دندان؛ مراحل و هزینه
    slug: ایمپلنت-دندان
    booking_group: implant
    priority: 1
    search_terms: [ایمپلنت دندان, قیمت ایمپلنت دندان, ایمپلنت جنوب تهران, مراحل ایمپلنت, ماندگاری ایمپلنت]
    summary: جایگزینی دندان از دست رفته با پایه‌ای که در استخوان فک قرار می‌گیرد و روکشی که روی آن ساخته می‌شود.
    seo_description: >-
      ایمپلنت دندان در کلینیک دندانپزشکی سفید: ایمپلنت چیست، برای چه کسی
      مناسب است، مراحل درمان، مراقبت بعد از جراحی، عوارض و ماندگاری.
      خانی‌آباد نو، جنوب تهران.
    sessions: معمولاً چند جلسه در طول چند ماه
    duration: معمولاً چند ماه تا گذاشتن دندان نهایی
    related: [overdenture, extraction, scaling]
    body:
      - type: content
        text: |-
          ## ایمپلنت دندان چیست؟
          ایمپلنت پایه‌ای شبیه پیچ است که با جراحی در استخوان فک بالا یا پایین قرار می‌گیرد و جای ریشهٔ دندان از دست رفته را می‌گیرد. استخوان به مرور دور این پایه رشد می‌کند و آن را محکم نگه می‌دارد. بعد، دندان جدید روی آن ساخته می‌شود.

          برای یک دندان، روکشی روی ایمپلنت قرار می‌گیرد که اندازه، فرم و رنگ آن با دندان‌های کناری هماهنگ می‌شود. اگر همهٔ دندان‌های یک فک از دست رفته باشد، دندان مصنوعی متحرک می‌تواند روی چند ایمپلنت محکم شود. به این درمان [اوردنچر](/خدمات/اوردنچر) می‌گویند.

          ## برای چه کسی مناسب است؟
          - یک یا چند دندان را از دست داده‌اید و می‌خواهید جای آن را با دندانی ثابت پر کنید.
          - دندان مصنوعی متحرکتان ناراحت است و می‌خواهید جایگزین دیگری را بررسی کنید.
          - نمی‌خواهید دندان‌های سالم کناری برای جایگزینی دندان از دست رفته تراش بخورند.

          جای خالی دندان ممکن است جویدن و صحبت کردن را سخت کند. دندان‌های کناری ممکن است به سمت جای خالی جابه‌جا شوند و در بعضی موارد استخوان آن ناحیه تحلیل می‌رود.

          ## چه وقت ایمپلنت مناسب نیست؟
          برای ایمپلنت، سلامت عمومی شما از سنتان مهم‌تر است.

          - اگر رشد فک هنوز تمام نشده است، مثلاً در نوجوانان، کاشت ایمپلنت معمولاً تا پایان رشد عقب می‌افتد.
          - بیماری‌های مزمن مثل دیابت یا سرطان خون ممکن است بهبود بعد از جراحی را مختل کنند. ممکن است پیش از جراحی، پزشکتان هم وضعیت سلامت شما را بررسی کند.
          - مصرف دخانیات بهبود را کند می‌کند.
          - اگر استخوان فک برای نگه داشتن ایمپلنت کافی نباشد، ممکن است پیش از کاشت یا همراه آن به افزایش حجم استخوان نیاز باشد. این کار خودش یک جراحی است و ممکن است عارضه داشته باشد.

          اگر ایمپلنت برای شما مناسب نباشد، دندانپزشک راه‌های دیگر جایگزینی دندان را توضیح می‌دهد.
      - type: callout
        tone: info
        text: انتخاب درمان با معاینه و تشخیص دندانپزشک است. پیش از جراحی، بیماری‌ها، داروها و حساسیت‌های دارویی‌تان را به دندانپزشک بگویید. اگر داروی پوکی استخوان مصرف می‌کنید یا پرتودرمانی سر و گردن داشته‌اید، این را هم بگویید، چون در موارد نادر جراحی ایمپلنت ممکن است به استخوان فک آسیب بزند. اگر سیگار می‌کشید، آن را هم بگویید.
      - type: steps
        items:
          - title: معاینه و بررسی استخوان
            text: دندانپزشک دهان، لثه و استخوان فک را معاینه می‌کند و عکس رادیوگرافی می‌گیرد تا مشکلاتی که در معاینه دیده نمی‌شوند هم پیدا شوند. دربارهٔ بیماری‌ها و داروهایتان هم می‌پرسد.
          - title: کاشت ایمپلنت
            text: دندانپزشک پیش از جراحی دربارهٔ روش بی‌حسی با شما صحبت می‌کند. معمولاً لثه باز می‌شود، جای ایمپلنت در استخوان آماده می‌شود و ایمپلنت در آن قرار می‌گیرد. در پایان، در صورت نیاز لثه بخیه می‌شود.
          - title: جوش خوردن استخوان
            text: استخوان باید دور ایمپلنت رشد کند و آن را محکم بگیرد. این مرحله زمان می‌برد و ممکن است چند ماه طول بکشد. در این مدت ممکن است دندان موقت داشته باشید تا راحت‌تر غذا بخورید و صحبت کنید.
          - title: ساخت دندان جدید
            text: روکش یا دندان مصنوعی برای دهان شما ساخته می‌شود و اندازه، فرم و رنگ آن با دندان‌های دیگرتان هماهنگ می‌شود. ساخت آن کمی زمان می‌برد.
          - title: قرار دادن دندان و نگهداری
            text: دندان جدید روی ایمپلنت قرار می‌گیرد. پس از آن، تمیز کردن روزانه و معاینه و تمیز کردن منظم در مطب به سالم ماندن لثهٔ دور ایمپلنت کمک می‌کند.
      - type: content
        text: |-
          ## بعد از جراحی ایمپلنت
          بعد از جراحی، درد و تورم ممکن است. اگر افزایش حجم استخوان هم انجام شده باشد، احتمال عارضه بیشتر است.

          - مسکن را طبق دستور دندانپزشک مصرف کنید.
          - در دورهٔ بهبود، غذای نرم، خوراکی‌های سرد و سوپ ولرم بخورید.
          - سیگار نکشید. دخانیات بهبود را کند می‌کند.
          - هر روز دندان‌ها و اطراف ایمپلنت را همان‌طور که دندانپزشک آموزش می‌دهد تمیز کنید.

          اگر درد یا تورم به‌جای کم شدن بیشتر شد، با کلینیک تماس بگیرید. اگر بی‌حسی لب، چانه یا زبان پس از تمام شدن اثر بی‌حسی ادامه پیدا کرد، با کلینیک تماس بگیرید.

          ## خطرها و عوارض
          - عفونت بعد از جراحی. اگر اطراف ایمپلنت عفونی شود، درمان سخت است و اغلب باید ایمپلنت برداشته شود.
          - شکست درمان: ایمپلنت ممکن است محکم نماند و از دست برود.
          - التهاب لثه و استخوان دور ایمپلنت (پری‌ایمپلنتیت) که با پلاک شروع می‌شود و اگر کنترل نشود، ممکن است به از دست رفتن ایمپلنت برسد.
          - آسیب به عصب نزدیک محل جراحی، به‌ویژه در فک پایین، که ممکن است باعث بی‌حسی یا گزگز لب، چانه یا زبان شود. این حالت اغلب بهتر می‌شود، ولی ممکن است ماندگار باشد.
          - مشکل سینوس در ایمپلنت فک بالا: اگر ایمپلنت یا افزایش حجم استخوان به سینوس برسد، ممکن است سینوس ملتهب یا عفونی شود. فاصلهٔ محل کاشت تا سینوس پیش از جراحی با عکس رادیوگرافی بررسی می‌شود.

          ایمپلنت درمانی بادوام است، اما همیشگی نیست. سالم ماندن لثه و بافت‌های دور ایمپلنت برای ماندگاری آن مهم است. تمیز کردن روزانه و معاینه و تمیز کردن منظم در مطب به این کار کمک می‌کند.
    faqs:
      - question: آیا ایمپلنت دندان درد دارد؟
        answer: >-
          دندانپزشک پیش از جراحی دربارهٔ روش بی‌حسی با شما صحبت می‌کند.
          بی‌حسی موضعی دارویی است که ناحیهٔ درمان را در طول کار بی‌حس می‌کند.
          بعد از جراحی، درد و تورم ممکن
          است. مسکن را طبق دستور دندانپزشک مصرف کنید و اگر درد یا تورم به‌جای
          کم شدن بیشتر شد، با کلینیک تماس بگیرید.
      - question: مراحل ایمپلنت چقدر طول می‌کشد؟
        answer: >-
          معمولاً چند ماه. پس از کاشت، استخوان باید دور ایمپلنت جوش بخورد و
          این کار ممکن است چند ماه طول بکشد. بعد دندان جدید ساخته می‌شود و روی
          ایمپلنت قرار می‌گیرد. زمان درمان شما به وضعیت استخوان و دهانتان
          بستگی دارد و پس از معاینه مشخص می‌شود.
      - question: ماندگاری ایمپلنت چقدر است؟
        answer: >-
          ایمپلنت درمانی بادوام برای جایگزینی دندان است، اما همیشگی نیست.
          التهاب لثه و استخوان دور ایمپلنت ممکن است به از دست رفتن آن برسد.
          تمیز کردن روزانه و معاینه و تمیز کردن منظم در مطب به سالم ماندن لثهٔ
          دور ایمپلنت و ماندگاری آن کمک می‌کند.
      - question: آیا هر کسی می‌تواند ایمپلنت بگذارد؟
        answer: >-
          نه. در نوجوانانی که رشد فکشان هنوز تمام نشده است، ایمپلنت معمولاً تا
          پایان رشد عقب می‌افتد. برای ایمپلنت، سلامت عمومی شما از سنتان مهم‌تر
          است. بیماری‌های مزمن مثل دیابت ممکن است بهبود بعد از جراحی را مختل کنند و دخانیات
          بهبود را کند می‌کند. استخوان فک هم باید برای نگه داشتن ایمپلنت کافی
          باشد. انتخاب درمان با معاینه و تشخیص دندانپزشک است.
      - question: اگر استخوان فکم کافی نباشد چه می‌شود؟
        answer: >-
          گاهی استخوان برای کاشت ایمپلنت کافی نیست. در این حالت ممکن است پیش
          از کاشت یا همراه آن، حجم استخوان افزایش داده شود. این کار خودش یک
          جراحی است و ممکن است عارضه داشته باشد. دندانپزشک پس
          از معاینه و عکس رادیوگرافی می‌گوید چه راهی برای شما مناسب است.
      - question: بعد از ایمپلنت چه غذایی بخورم؟
        answer: >-
          در دورهٔ بهبود، غذای نرم، خوراکی‌های سرد و سوپ ولرم بخورید و سیگار
          نکشید. دندانپزشک پس از جراحی می‌گوید از چه زمانی می‌توانید به غذای
          معمولی برگردید.
      - question: هزینهٔ ایمپلنت دندان چقدر است؟
        answer: >-
          هزینه به تعداد ایمپلنت‌ها، وضعیت استخوان، نیاز به افزایش حجم استخوان
          و نوع دندانی که روی ایمپلنت ساخته می‌شود بستگی دارد. هزینهٔ شما پس از
          معاینه مشخص می‌شود. پیش از شروع درمان، هزینه را از پذیرش بپرسید.
