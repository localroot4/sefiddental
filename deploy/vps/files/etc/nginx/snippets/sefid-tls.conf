# TLS of every 443 server (deploy/vps): TLS 1.2 and 1.3, forward-secret AEAD ciphers only
# (Mozilla "intermediate" without the DHE suites). No OCSP stapling: Let's Encrypt certificates
# carry no OCSP URL since 2025-05-07 and its responders are off since 2025-08-06.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:sefid_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
