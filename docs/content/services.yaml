  # ---- restorative ----
  - key: restoration
    category: restorative
    nav_label: ترمیم دندان
    h1: "ترمیم دندان در سه سطح: معمولی، VIP و CIP"
    seo_title: ترمیم دندان؛ معمولی، VIP و CIP
    slug: ترمیم-دندان
    alias: /vip
    booking_group: restore
    priority: 1
    search_terms: [ترمیم دندان, پر کردن دندان, ترمیم همرنگ دندان, کامپوزیت ترمیمی, ترمیم VIP, قیمت پر کردن دندان]
    summary: ترمیم پوسیدگی یا شکستگی دندان در سه سطح معمولی، VIP و CIP، که در مواد و جزئیات فرم، سطح و رنگ ترمیم با هم فرق دارند.
    seo_description: >-
      ترمیم دندان در کلینیک دندانپزشکی سفید در سه سطح معمولی، VIP و CIP:
      فرق سطح‌ها، مراحل کار، مراقبت بعد از ترمیم و محدودیت‌های آن. خانی‌آباد نو،
      جنوب تهران.
    sessions: معمولاً یک جلسه
    anesthesia: بی‌حسی موضعی، در صورت نیاز
    recovery: گاهی حساسیت که معمولاً طی چند هفته کم می‌شود
    related: [crown, inlay-onlay, root-canal]
    body:
      - type: content
        text: |-
          ## ترمیم دندان چیست؟
          وقتی بخشی از دندان با پوسیدگی یا شکستگی از دست می‌رود، دندانپزشک بخش آسیب‌دیده را برمی‌دارد و جای آن را با مادهٔ ترمیمی پر می‌کند. ترمیم، شکل دندان را برمی‌گرداند تا دوباره بتوانید با آن غذا بجوید.

          ## برای چه کسی مناسب است؟
          - پوسیدگی کوچک تا متوسط که هنوز به عصب نرسیده است
          - لب‌پریدگی یا شکستگی کوچک دندان
          - ترمیم قدیمی که شکسته یا دور آن دوباره پوسیده است

          ## چه وقت ترمیم کافی نیست؟
          اگر پوسیدگی به عصب رسیده باشد، ممکن است درمان ریشه لازم شود. اگر بخش بزرگی از دندان از دست رفته باشد، اینله و آنله یا روکش ممکن است گزینهٔ مناسب‌تری باشد. دندانپزشک پس از معاینه و در صورت نیاز عکس رادیوگرافی، راه مناسب را پیشنهاد می‌کند.
      - type: callout
        tone: info
        text: انتخاب سطح ترمیم با معاینه و تشخیص دندانپزشک و گفت‌وگو با شماست. هزینهٔ هر سطح را پیش از شروع کار از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک دندان را معاینه می‌کند و اگر لازم بداند، عکس رادیوگرافی می‌گیرد تا پوسیدگی‌هایی که در معاینه دیده نمی‌شوند هم پیدا شوند.
          - title: بی‌حسی
            text: اگر لازم باشد، دندان با بی‌حسی موضعی بی‌حس می‌شود. دندانپزشک پیش از شروع کار مطمئن می‌شود بی‌حسی کافی است. اگر به دارو یا مادهٔ دیگری حساسیت دارید، پیش از بی‌حسی به دندانپزشک بگویید.
          - title: برداشتن پوسیدگی
            text: بخش پوسیده یا شکسته برداشته و دندان برای ترمیم آماده می‌شود.
          - title: ترمیم و شکل‌دهی
            text: مادهٔ ترمیمی جای بخش برداشته‌شده را پر می‌کند و فرم دندان ساخته می‌شود. در سطح CIP رنگ ترمیم با رنگ‌آمیزی و کاراکتردهی (ساختن جزئیات ریز رنگ) به دندان‌های کناری نزدیک‌تر می‌شود.
          - title: پرداخت
            text: سطح ترمیم صاف و پرداخت می‌شود، چون سطح زبر زودتر رنگ می‌گیرد و پلاک روی آن جمع می‌شود.
      - type: content
        text: |-
          ## بعد از ترمیم
          تا وقتی بی‌حسی از بین نرفته است، غذا نجوید تا لب و گونه‌تان را گاز نگیرید. حساسیت در روزهای اول ممکن است و معمولاً با گذشت زمان کم می‌شود.

          اگر هنگام گاز گرفتن درد داشتید، ترمیم لق شد یا شکست، یا درد بیش از دو روز ادامه پیدا کرد، با کلینیک تماس بگیرید.

          ## محدودیت‌های ترمیم
          هیچ ترمیمی همیشگی نیست. اگر پوسیدگی عمیق و نزدیک عصب باشد، یا دندان چند بار ترمیم شده باشد، ممکن است عصب دندان بعداً عفونی شود و درمان ریشه لازم شود. ترمیم ممکن است با گذشت زمان بشکند یا دور آن دوباره پوسیدگی ایجاد شود. مسواک زدن دو بار در روز با خمیردندان فلورایددار، نخ دندان روزانه و معاینهٔ منظم به سالم ماندن ترمیم کمک می‌کند و مشکل را زودتر نشان می‌دهد.
    faqs:
      - question: فرق سطح معمولی، VIP و CIP چیست؟
        answer: >-
          سطح‌ها در مواد و جزئیات فرم، سطح و رنگ ترمیم فرق دارند. سطح معمولی
          ترمیم استاندارد با مواد متداول است. در VIP مواد درجه‌یک به کار می‌رود و فرم و سطح ترمیم
          با دقت بیشتری ساخته می‌شود. CIP همهٔ ویژگی‌های VIP را دارد، به‌علاوهٔ
          رنگ‌آمیزی و کاراکتردهی تا رنگ ترمیم به دندان‌های کناری نزدیک‌تر شود. هیچ سطحی از ترمیم قول تعداد سال مشخصی نمی‌دهد.
      - question: آیا ترمیم دندان درد دارد؟
        answer: >-
          اگر لازم باشد، دندان با بی‌حسی موضعی بی‌حس می‌شود و دندانپزشک پیش از
          شروع کار مطمئن می‌شود بی‌حسی کافی است. بعد از ترمیم، حساسیت در روزهای
          اول ممکن است و معمولاً با گذشت زمان کم می‌شود.
      - question: ترمیم دندان چند جلسه است؟
        answer: >-
          ترمیم معمولاً در یک جلسه انجام می‌شود، چون مادهٔ ترمیمی مستقیم روی
          دندان شکل می‌گیرد و به ساخت در لابراتوار نیاز ندارد. اگر چند دندان
          ترمیم لازم داشته باشند، دندانپزشک ممکن است کار را در چند جلسه
          برنامه‌ریزی کند.
      - question: بعد از ترمیم کی می‌توانم غذا بخورم؟
        answer: >-
          وقتی بی‌حسی کامل از بین رفت. تا آن موقع غذا نجوید تا لب و گونه‌تان را
          گاز نگیرید. اگر ترمیم شما نکتهٔ دیگری لازم داشته باشد، دندانپزشک پس
          از ترمیم به شما می‌گوید.
      - question: ترمیم چقدر دوام دارد؟
        answer: >-
          هیچ ترمیمی همیشگی نیست. دوام ترمیم بیشتر به اندازه و جای آن، خطر
          پوسیدگی و مراقبت شما بستگی دارد و هیچ سطحی از ترمیم قول تعداد سال
          مشخصی نمی‌دهد. مسواک زدن دو بار در روز، نخ دندان و معاینهٔ منظم به
          سالم ماندن ترمیم کمک می‌کند.
      - question: هزینهٔ ترمیم دندان چقدر است؟
        answer: >-
          هزینه به سطح ترمیم، اندازهٔ آن و تعداد دندان‌ها بستگی دارد و پس از
          معاینه مشخص می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
