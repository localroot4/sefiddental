# Page registry seed (freeze decision 49): one row per key of spec-data table 2.8a.
# title is the visible H1; seo_title is the title topic without the suffix
# (docs/seo/keyword-map.md section 1). Hub slugs are owned by the route tree.
# Phase 4 drafts: leads, the home subtext, section headings, journey steps and
# FAQ, the about story. Facts on file only; a `content` block is Markdown
# (`## ` headings, `- ` lists, blank-line paragraphs). Guides stay drafts.
pages:
  - key: home
    slug: ''
    # Phase 4 freeze F6: the fallback H1 until gap 28 closes. The client slogan,
    # kept for that decision: «اولین کلینیک دندانپزشکی دیجیتال جنوب تهران».
    title: کلینیک دندانپزشکی سفید در جنوب تهران
    seo_title: دندانپزشکی دیجیتال جنوب تهران
    # F7: the template renders «مشاورهٔ اول رایگان است.» before this while the
    # free-consultation flag is on; both together stay within 19 words.
    subtext: دندانپزشکی دیجیتال برای بزرگسالان و کودکان در خانی‌آباد نو.
    sections:
      - key: services
        heading: چه کاری می‌توانیم برایتان بکنیم؟
        intro: خدمات کلینیک در پنج گروه آمده است. گروه نزدیک به نیازتان را انتخاب کنید.
      - key: restoration
        heading: ترمیم دندان در سه سطح
        intro: >-
          سه سطح معمولی، VIP و CIP در مواد و دقت کار فرق دارند. سطح مناسب را
          پس از معاینه، با دندانپزشک انتخاب می‌کنید.
      # No intro: the compare component renders the fixed consent line (ui.compare.consent).
      - key: compare
        heading: قبل و بعد درمان
      - key: dentists
        heading: دندانپزشکان کلینیک
        intro: پیش از نوبت، دندانپزشک خود را بشناسید.
      - key: voices
        heading: تجربهٔ بیماران
        intro: بیماران کلینیک از درمان خود می‌گویند. ویدئوها با رضایت آن‌ها منتشر شده‌اند.
      - key: journey
        heading: اولین مراجعه، قدم به قدم
        intro: از ثبت درخواست تا مراقبت بعد از درمان، می‌دانید هر قدم چه پیش می‌آید.
      - key: faq
        heading: پرسش‌های پرتکرار
        intro: پاسخ کوتاه به پرسش‌هایی که پیش از نوبت زیاد می‌شنویم.
    blocks:
      - type: steps
        items:
          - title: ثبت درخواست
            text: >-
              شماره‌تان را در فرم بگذارید یا با کلینیک تماس بگیرید. پذیرش زمان
              نوبت را با شما هماهنگ می‌کند.
          - title: معاینه و مشاوره
            text: >-
              دندانپزشک دندان‌ها و لثه را معاینه می‌کند و گزینه‌های درمان را
              برایتان توضیح می‌دهد. تصمیم با خودتان است.
          - title: درمان
            text: >-
              درمانی که با دندانپزشک انتخاب کرده‌اید انجام می‌شود. پذیرش زمان
              جلسه‌ها را با شما هماهنگ می‌کند.
          - title: مراقبت بعد از درمان
            text: >-
              دندانپزشک نکته‌های مراقبت را به شما می‌گوید. اگر سؤالی داشتید، با
              کلینیک تماس بگیرید.
      - type: faq
        items:
          - question: هزینهٔ درمان چقدر است؟
            answer: >-
              هزینه به نوع درمان و وضعیت دندان‌ها بستگی دارد و پس از معاینه
              مشخص می‌شود. پیش از شروع کار، هزینهٔ درمان را از پذیرش بپرسید.
          - question: آیا درمان درد دارد؟
            answer: >-
              بیشتر درمان‌ها با بی‌حسی موضعی انجام می‌شوند. اگر در طول کار ناراحت
              شدید، به دندانپزشک بگویید. بعد از بعضی درمان‌ها، حساسیت یا درد خفیف
              چند روزه ممکن است.
          - question: کدام بیمه‌ها را می‌پذیرید؟
            answer: >-
              کلینیک با بیمه ایران، بیمه کارآفرین، بیمه پاسارگاد، بیمه البرز و بیمه ما
              همکاری دارد. سهم بیمه به نوع درمان و بیمه‌نامهٔ شما بستگی دارد؛ پیش از
              نوبت از پذیرش بپرسید.
          - question: امکان پرداخت قسطی هست؟
            answer: >-
              دربارهٔ روش‌های پرداخت و اقساط، پیش از شروع درمان از پذیرش بپرسید.
          - question: درمان چند جلسه طول می‌کشد؟
            answer: >-
              به نوع درمان بستگی دارد. بیشتر ترمیم‌ها در یک جلسه انجام می‌شوند.
              درمان‌هایی مثل ایمپلنت یا ارتودنسی چند جلسه در چند ماه طول می‌کشند.
              تعداد جلسه‌های شما پس از معاینه مشخص می‌شود.
          - question: درد شدید دارم؛ چه کنم؟
            answer: >-
              برای بیمارانی که درد شدید دارند، در صورت امکان همان روز نوبت
              می‌دهیم. در ساعات کاری، سریع‌ترین راه تماس تلفنی است. اگر ورم صورت
              به چشم یا گردن رسیده یا نفس کشیدن و قورت دادن سخت شده است، با
              اورژانس ۱۱۵ تماس بگیرید.
