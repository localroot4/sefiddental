# Installed by deploy/vps/provision.sh (not on the CI runner). Security updates, and the service
# restarts needrestart makes after them, at 22:30 to 22:45 UTC (02:00 to 02:15 in Tehran), not at
# Ubuntu's 06:00 to 07:00 UTC (09:30 in Tehran, clinic hours). They end before the 23:30 backup.
[Timer]
OnCalendar=
OnCalendar=*-*-* 22:30:00 UTC
RandomizedDelaySec=15m
