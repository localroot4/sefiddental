# Service taxonomy. Source of truth for seeders, navigation and SEO fields.
# Revised in phase 1 (see docs/ia.md and docs/seo/keyword-map.md, which mirror
# nav_label, h1 and seo_title). Fields marked TODO are written in phase 6 and
# reviewed by the client. Keys are stable; slugs are final unless the client
# objects before seeding.
#
# Phase 4 drafts (final copy and the medical review come in phase 6): every
# summary, the three category pages (intro, faqs, seo_title) and the full
# restoration page (facts, body, faqs, related, seo_description). Only facts
# on file: no prices, no clinic numbers, no device or dentist names. A body
# `content` block is Markdown: `## ` headings, `- ` lists, blank-line
# paragraphs. Category intros separate paragraphs with a blank line.
#
# booking_group maps a service to one of the eight booking chips
# (docs/conversion.md 5.1): exam, cosmetic, implant, restore, root_canal,
# ortho, kids, other. The exact service_key also travels in a hidden field.

categories:
  - key: cosmetic
    title: خدمات زیبایی دندان
    nav_label: زیبایی
    slug: زیبایی
    accent: warm          # category icon accent only, never UI chrome
    icon: sparkle         # Phosphor duotone name; CategoryIcon allowlist
    order: 1
    seo_title: دندانپزشکی زیبایی
    summary: درمان‌هایی برای رنگ، فرم و هماهنگی دندان‌ها و لبخند.
    intro: |-
      درمان‌های زیبایی رنگ، فرم یا فاصلهٔ دندان‌ها را تغییر می‌دهند. بعضی، مثل بلیچینگ، به تراش دندان نیاز ندارند و بعضی، مثل لمینت سرامیکی، معمولاً تراش کمی لازم دارند.

      پیش از هر درمان زیبایی، دندانپزشک سلامت دندان‌ها و لثه را بررسی می‌کند. اگر پوسیدگی یا بیماری لثه باشد، اول همان درمان می‌شود.

      اگر نمی‌دانید از کجا شروع کنید، یک نوبت معاینه بگیرید. دندانپزشک گزینه‌های مناسب دهان شما را توضیح می‌دهد.
    faqs:
      - question: لمینت سرامیکی یا کامپوزیت، کدام برای من مناسب است؟
        answer: >-
          هر دو روی سطح جلوی دندان قرار می‌گیرند. لمینت سرامیکی در لابراتوار
          ساخته می‌شود و رنگش پایدارتر است. کامپوزیت در مطب روی دندان شکل
          می‌گیرد و ترمیم آن ساده‌تر است. انتخاب با معاینه و تشخیص دندانپزشک
          است.
      - question: آیا بلیچینگ به دندان آسیب می‌زند؟
        answer: >-
          بلیچینگ زیر نظر دندانپزشک روشی شناخته‌شده است. بعد از آن ممکن است
          چند روز به سرما و گرما حساس شوید که معمولاً خودبه‌خود کم می‌شود.
          رنگ روکش و ترمیم‌های قبلی با بلیچینگ عوض نمی‌شود.
      - question: درمان زیبایی چند جلسه طول می‌کشد؟
        answer: >-
          به درمان بستگی دارد. کامپوزیت در مطب و معمولاً در همان جلسه روی
          دندان ساخته می‌شود. لمینت سرامیکی در لابراتوار ساخته می‌شود و به بیش
          از یک جلسه نیاز دارد. تعداد جلسه‌های شما پس از معاینه مشخص می‌شود.
  - key: surgery-replacement
    title: جراحی و جایگزینی دندان
    nav_label: جراحی و جایگزینی دندان
    slug: جراحی-و-جایگزینی-دندان
    accent: brand
    icon: bandaids
    order: 2
    seo_title: جراحی و جایگزینی دندان
    summary: ایمپلنت، اوردنچر، کشیدن دندان و جراحی‌های دهان و لثه.
    intro: |-
      وقتی دندانی از دست رفته یا باید کشیده شود، برای جایگزینی آن راه‌هایی هست: ایمپلنت برای یک یا چند دندان، و اوردنچر، یعنی دندان مصنوعی که روی ایمپلنت محکم می‌شود.

      پیش از جراحی، دندانپزشک وضعیت استخوان و لثه را با معاینه و عکس رادیوگرافی بررسی می‌کند و دربارهٔ داروها و بیماری‌هایتان می‌پرسد. فهرست داروهایی را که مصرف می‌کنید همراه بیاورید.

      بعد از هر جراحی، دستور مراقبت را دقیق دنبال کنید. اگر درد یا ورم به‌جای کم شدن بیشتر شد، با کلینیک تماس بگیرید.
    faqs:
      - question: درمان ایمپلنت چقدر طول می‌کشد؟
        answer: >-
          معمولاً چند ماه، چون استخوان باید دور پایهٔ ایمپلنت جوش بخورد. بعد
          از آن روکش روی پایه قرار می‌گیرد. زمان درمان شما به وضعیت استخوان
          بستگی دارد و پس از معاینه مشخص می‌شود.
      - question: آیا کشیدن دندان درد دارد؟
        answer: >-
          کشیدن دندان با بی‌حسی موضعی انجام می‌شود. بعد از آن، چند روز درد و
          ورم خفیف طبیعی است و دندانپزشک می‌گوید چه دارویی مصرف کنید. اگر درد
          بعد از دو سه روز بیشتر شد، با کلینیک تماس بگیرید.
      - question: بعد از کشیدن دندان، جای خالی آن را چه کنم؟
        answer: >-
          جای خالی دندان ممکن است باعث جابه‌جا شدن دندان‌های کناری شود.
          ایمپلنت یکی از راه‌های جایگزینی است. دندانپزشک پس از معاینه می‌گوید
          کدام راه برای شما مناسب است.
  - key: restorative
    title: درمان و نگهداری دندان
    nav_label: درمان و نگهداری
    slug: درمان-دندان
    accent: green
    icon: tooth
    order: 3
    seo_title: درمان و نگهداری دندان
    summary: ترمیم، روکش، درمان ریشه، جرم‌گیری و اینله و آنله، برای نگه داشتن دندان‌های خودتان.
    intro: |-
      هدف این درمان‌ها نگه داشتن دندان‌های خودتان است: پوسیدگی را ترمیم می‌کنند، عصب ملتهب یا عفونی را درمان می‌کنند و دندان ضعیف را با روکش محافظت می‌کنند.

      هرچه پوسیدگی زودتر پیدا شود، درمان ساده‌تر است. معاینه و جرم‌گیری منظم کمک می‌کند مشکل پیش از درد پیدا شود.

      ترمیم دندان در کلینیک سفید در سه سطح معمولی، VIP و CIP انجام می‌شود. سطح‌ها در مواد و دقت کار فرق دارند و انتخاب با معاینه و تشخیص دندانپزشک است.
    faqs:
      - question: ترمیم دندان چقدر دوام دارد؟
        answer: >-
          به اندازه و جای ترمیم و مراقبت شما بستگی دارد. مسواک زدن، نخ دندان
          و معاینهٔ منظم عمر ترمیم را بیشتر می‌کند.
      - question: کی به درمان ریشه (عصب‌کشی) نیاز است؟
        answer: >-
          وقتی پوسیدگی یا ضربه به عصب دندان رسیده و عصب ملتهب یا عفونی شده
          است. درد طولانی با سرما و گرما، درد شبانه یا ورم لثه می‌تواند نشانهٔ
          آن باشد. تشخیص با معاینه و عکس رادیوگرافی است.
      - question: فرق ترمیم و روکش چیست؟
        answer: >-
          ترمیم، بخش پوسیده یا شکستهٔ دندان را پر می‌کند. وقتی بخش بزرگی از
          دندان از دست رفته باشد، روکش کل تاج دندان را می‌پوشاند و از آن
          محافظت می‌کند. اینله و آنله گزینهٔ میان این دو است.
