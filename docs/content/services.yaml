  - key: gum-lift
    category: cosmetic
    nav_label: لیفت لثه
    h1: لیفت لثه و اصلاح لبخند لثه‌ای
    seo_title: لیفت لثه و لبخند لثه‌ای
    slug: لیفت-لثه
    booking_group: cosmetic
    priority: 3
    search_terms: [لیفت لثه, لبخند لثه ای, جراحی زیبایی لثه, کانتورینگ لثه]
    summary: اصلاح خط لثه، وقتی لثه بخش زیادی از دندان‌ها را پوشانده و هنگام لبخند بیش از حد دیده می‌شود.
    seo_description: >-
      لیفت لثه برای لبخند لثه‌ای: علت‌های دیده شدن زیاد لثه، وقتی لیفت لثه
      کافی نیست، مراحل، دوران بهبود و مراقبت. کلینیک دندانپزشکی سفید،
      خانی‌آباد نو.
    recovery: درد و ورم معمولاً تا دو هفته؛ ثبات لبهٔ لثه دست‌کم سه ماه
    related: [smile-design, ceramic-laminate, gum-surgery]
    body:
      - type: content
        text: |-
          ## لیفت لثه چیست؟
          وقتی هنگام لبخند بخش زیادی از لثهٔ بالا دیده می‌شود، به آن لبخند لثه‌ای می‌گویند. لیفت لثه جراحی روی لثه است که لبهٔ لثه را بالاتر می‌برد تا بخش بیشتری از تاج دندان دیده شود و دندان‌ها کوتاه به نظر نرسند. این کار با برداشتن و فرم دادن بخشی از لثه (کانتورینگ لثه) یا با کنار زدن لثه و قرار دادن آن در جای تازه انجام می‌شود. در بسیاری از موارد، استخوان زیر لثه هم کمی شکل داده می‌شود تا لبهٔ لثه دوباره به سمت دندان برنگردد.

          ## چرا لثه زیاد دیده می‌شود؟
          لبخند لثه‌ای چند علت دارد و هر علت درمان خودش را دارد:
          - لثه بعد از رویش دندان‌ها به‌اندازهٔ کافی عقب نرفته و بخشی از تاج دندان را پوشانده است
          - لب بالا هنگام لبخند بیش از حد بالا می‌رود
          - لب بالا کوتاه است یا فک بالا رشد عمودی زیادی دارد
          - لثه بزرگ و پرحجم شده است

          ## برای چه کسی مناسب است؟
          - کسی که دندان‌های جلویش به‌خاطر پوشیده شدن با لثه کوتاه به نظر می‌رسد
          - وقتی پیش از لمینت یا روکش دندان‌های جلو، برای تناسب دندان و لثه لازم است

          ## چه وقت لیفت لثه کافی نیست؟
          اگر علت اصلی، حرکت زیاد لب بالا یا رشد فک بالا باشد، لیفت لثه به‌تنهایی مشکل را حل نمی‌کند. اگر لثه به‌خاطر التهاب یا بیماری لثه بزرگ و پرحجم شده است، اول همان علت درمان می‌شود و دندانپزشک پس از آن دربارهٔ لیفت لثه تصمیم می‌گیرد. برای علت‌های لب و فک روش‌های دیگری، مثل جراحی جابه‌جایی لب یا درمان فک، مطرح است و دندانپزشک پس از معاینه توضیح می‌دهد. اگر علت درست تشخیص داده نشود، نتیجه ممکن است آن چیزی نباشد که انتظار دارید.
      - type: callout
        tone: info
        text: تشخیص علت لبخند لثه‌ای و انتخاب درمان با معاینه و تشخیص دندانپزشک است. هزینه را پیش از شروع کار از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه و تشخیص علت
            text: دندانپزشک لبخند، لب، لثه و دندان‌ها را بررسی می‌کند و با معاینه و عکس رادیوگرافی، جای لبهٔ لثه و استخوان را نسبت به دندان مشخص می‌کند.
          - title: برنامه‌ریزی
            text: اندازهٔ تازهٔ دندان‌ها پیش از جراحی مشخص می‌شود. اگر بعد از آن لمینت یا روکش لازم است، طرح آن هم از اول در نظر گرفته می‌شود.
          - title: جراحی لثه
            text: بخشی از لثه برداشته و فرم داده می‌شود، یا لثه کنار زده و در جای تازه قرار می‌گیرد. در بسیاری از موارد، استخوان زیر لثه هم کمی شکل داده می‌شود.
          - title: پیگیری
            text: در جلسه‌های پیگیری، بهبود لثه بررسی می‌شود. لبهٔ لثه دست‌کم سه ماه زمان لازم دارد تا در جای نهایی‌اش ثابت شود.
      - type: content
        text: |-
          ## بعد از لیفت لثه
          در روزهای اول، درد، ورم و ناراحتی بعد از جراحی لثه شایع است. دارو را همان‌طور که دندانپزشک گفته مصرف کنید و دستور تمیز کردن محل جراحی را دقیق دنبال کنید.

          اگر خونریزی بند نمی‌آید، یا درد و ورم به‌جای کم شدن بیشتر شد، با کلینیک تماس بگیرید.

          اگر قرار است بعد از جراحی لمینت یا روکش ساخته شود، معمولاً دست‌کم سه ماه، و در دندان‌های جلو گاهی تا شش ماه، صبر می‌شود تا لبهٔ لثه ثابت شود.

          ## خطرها و محدودیت‌ها
          - درد، ورم و ناراحتی در روزهای اول بعد از جراحی
          - خونریزی و کبودی در روزهای اول
          - حساسیت دندان‌ها به سرما و لمس بعد از جراحی
          - برگشت بخشی از لثه: در ماه‌های اول، لبهٔ لثه ممکن است کمی به سمت دندان رشد کند. میزان آن به روش جراحی و فاصلهٔ لبهٔ لثه تا استخوان بستگی دارد.
          - اگر استخوان زیر لثه شکل داده شود، این کار ممکن است بر پایداری بافت نگهدارندهٔ دندان اثر بگذارد. دندانپزشک پیش از جراحی بررسی می‌کند که این کار برای شما مناسب است یا نه.
          - اگر علت لبخند لثه‌ای لب یا فک باشد، لیفت لثه به‌تنهایی نتیجهٔ مورد انتظار را نمی‌دهد.
    faqs:
      - question: لبخند لثه‌ای چیست و از کجا بفهمم دارم؟
        answer: >-
          وقتی هنگام لبخند بخش زیادی از لثهٔ بالا دیده می‌شود. در منابع
          دندانپزشکی، دیده شدن بیش از حدود ۳ میلی‌متر لثه را معمولاً لبخند
          لثه‌ای می‌دانند. اینکه درمان لازم است یا نه، به خواست شما و معاینه
          بستگی دارد.
      - question: آیا لیفت لثه درد دارد؟
        answer: >-
          لیفت لثه جراحی روی لثه است و دندانپزشک پیش از کار دربارهٔ بی‌حسی
          توضیح می‌دهد. بعد از جراحی لثه، درد، ورم و ناراحتی در روزهای اول شایع
          است و دندانپزشک می‌گوید چه دارویی مصرف کنید.
      - question: نتیجهٔ لیفت لثه ماندگار است؟
        answer: >-
          لبهٔ لثه در ماه‌های اول ممکن است کمی به سمت دندان برگردد و ممکن است
          تا حدود شش ماه طول بکشد تا ثابت شود. میزان این برگشت به روش جراحی و فاصلهٔ
          لبهٔ لثه تا استخوان در زمان جراحی بستگی دارد. اگر علت لبخند لثه‌ای
          لب یا فک باشد، لیفت لثه به‌تنهایی نتیجهٔ مورد انتظار را نمی‌دهد.
      - question: آیا بعد از لیفت لثه می‌توانم لمینت بگذارم؟
        answer: >-
          لیفت لثه گاهی پیش از لمینت یا روکش دندان‌های جلو انجام می‌شود تا
          تناسب دندان و لثه بهتر شود. ساخت لمینت یا روکش نهایی معمولاً دست‌کم
          سه ماه بعد از جراحی انجام می‌شود تا لبهٔ لثه ثابت شود.
      - question: فرق لیفت لثه با جراحی لثه برای بیماری لثه چیست؟
        answer: >-
          لیفت لثه برای زیبایی لبخند انجام می‌شود تا بخش بیشتری از تاج دندان
          دیده شود. جراحی لثه برای بیماری لثه انجام می‌شود، وقتی جرم‌گیری عمقی و
          درمان‌های ساده‌تر کافی نبوده است.
      - question: هزینهٔ لیفت لثه چقدر است؟
        answer: >-
          هزینه به تعداد دندان‌ها و روش جراحی بستگی دارد و پس از معاینه مشخص
          می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
      - question: بعد از لیفت لثه چه وقت با کلینیک تماس بگیرم؟
        answer: >-
          اگر خونریزی بند نمی‌آید، یا درد و ورم به‌جای کم شدن بیشتر می‌شود، با
          کلینیک تماس بگیرید. اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس
          ۱۱۵ تماس بگیرید.
