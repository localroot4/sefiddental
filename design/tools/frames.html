<!doctype html>
<!--
  Storyboard frames generator for docs/experience/storyboard.md.
  Render: serve the repository root over HTTP, open this page in Chromium at
  a 1400 px wide viewport, light color scheme, device scale factor 2. Save an
  element screenshot of each .frame[data-name] to
  docs/experience/frames/<data-name>.png and a full-page screenshot to
  docs/experience/frames/all-frames.png.
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Storyboard frames generator</title>
<link rel="stylesheet" href="../tokens.css">
<style>
@font-face{font-family:Vazirmatn;src:url(../fonts/Vazirmatn[wght].woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:Estedad;src:url(../fonts/Estedad-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
body{margin:0;background:#ddd;font-family:var(--font-body);color:var(--color-ink);padding:16px;display:flex;flex-wrap:wrap;gap:16px}
.frame{position:relative;background:var(--color-surface);border:1px solid var(--color-line);overflow:hidden;box-sizing:border-box}
.frame.d{width:640px;height:400px}.frame.p{width:200px;height:400px}
.tag{position:absolute;top:8px;inset-inline-start:8px;font-size:11px;color:var(--color-ink-muted);background:var(--color-surface-raised);border:1px solid var(--color-line);border-radius:6px;padding:2px 6px;z-index:5}
.d:has(.nav) .tag{top:36px}.p:has(.nav) .tag{top:auto;bottom:28px}
.nav{position:absolute;top:0;inset-inline:0;height:28px;border-bottom:1px solid var(--color-line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:9px}
.pill{background:var(--color-brand);color:#fff;border-radius:999px;padding:2px 8px;font-size:9px}
.box{position:absolute;border:1.5px dashed var(--color-line-strong);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--color-ink-muted);padding:4px;box-sizing:border-box}
.text{position:absolute;font-size:10px;line-height:1.6}
.h{font-family:var(--font-display);font-size:16px;color:var(--color-ink);line-height:1.3}
.d .h{font-size:20px}
.btn{display:inline-block;background:var(--color-brand);color:#fff;border-radius:999px;padding:3px 10px;font-size:9px;margin-inline-end:4px}
.btn.s{background:transparent;color:var(--color-brand);border:1px solid var(--color-brand)}
.mark{position:absolute;background:var(--color-brand);opacity:.18;border-radius:30% 30% 30% 30%/40% 40% 40% 40%;clip-path:polygon(0 0,70% 0,100% 45%,100% 100%,30% 100%,0 55%)}
.relief{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9e9e4 60%,#dcdcd6);box-shadow:0 6px 14px rgb(10 36 63/.08)}
.gem{position:absolute;width:8px;height:8px;background:var(--color-ink);transform:rotate(45deg)}
.bar{position:absolute;height:3px;background:var(--color-brand);border-radius:2px}
.arrow{position:absolute;font-size:10px;color:var(--color-brand);font-weight:700}
.cam{position:absolute;bottom:6px;inset-inline-end:8px;font-size:9px;color:var(--color-ink-faint)}
.sticky{position:absolute;bottom:0;inset-inline:0;height:26px;display:flex;border-top:1px solid var(--color-line);background:var(--color-surface-raised);font-size:8px}
.sticky div{flex:1;display:flex;align-items:center;justify-content:center}.sticky div:last-child{background:var(--color-brand);color:#fff}
.warm{background:linear-gradient(180deg,var(--color-surface),var(--color-warm-soft))}
.box.photo{border-radius:0;background:var(--color-surface-sunken);align-items:flex-start;padding-top:10px}
.scrim{position:absolute;box-sizing:border-box;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--color-surface) 88%,transparent);font-size:10px;line-height:1.6;z-index:2}
.card{position:absolute;box-sizing:border-box;padding:12px;border-radius:10px;background:var(--color-surface-raised);border:1px solid var(--color-line);box-shadow:0 8px 20px rgb(10 36 63/.12);font-size:10px;line-height:1.5;z-index:2}
.card .ct{font-family:var(--font-display);font-size:13px;color:var(--color-ink)}
.field{height:20px;border:1px solid var(--color-line-strong);border-radius:6px;margin:4px 0 8px;background:var(--color-surface-raised)}
.btn.wide{display:block;text-align:center;margin:0;padding:4px 0}
.facts{position:absolute;inset-inline:0;bottom:0;display:grid;gap:6px 10px;padding:8px 14px;background:color-mix(in srgb,var(--color-surface-raised) 90%,transparent);border-top:1px solid var(--color-line);z-index:2;text-align:start}
.facts div{display:grid;gap:1px;padding-inline-start:6px;border-inline-start:2px solid var(--color-brand)}
.facts b{font-size:9px;font-weight:600;color:var(--color-ink)}.facts span{font-size:7.5px;line-height:1.5;color:var(--color-ink-muted)}
.p .facts{padding:6px 8px;gap:5px 6px}.p .facts b{font-size:7.5px}.p .facts span{font-size:6.5px}
</style>
</head>
<body>
<script>
const frames=[
{id:'00-intro',t:'۰ ورود',d:`<div class="box" style="inset:0;border:0;background:var(--color-surface)"></div><div class="gem" style="top:60px;left:120px"></div><div class="gem" style="top:330px;left:520px"></div><div class="gem" style="top:40px;left:560px"></div><div class="gem" style="top:350px;left:90px"></div><div class="mark" style="width:70px;height:90px;top:150px;left:285px;opacity:.9"></div><div class="bar" style="width:260px;top:265px;left:190px"></div><div class="text" style="top:280px;left:0;right:0;text-align:center;color:var(--color-ink-muted)">میله = خط بارگذاری واقعی؛ الماس‌ها از لبه‌ها می‌آیند</div><div class="cam">هیرو زیر پرده رندر شده است</div>`,p:`<div class="gem" style="top:50px;left:20px"></div><div class="gem" style="top:330px;left:170px"></div><div class="mark" style="width:50px;height:64px;top:150px;left:75px;opacity:.9"></div><div class="bar" style="width:120px;top:235px;left:40px"></div>`},
{id:'01-hero',t:'۱ هیرو (جهت B) ۰ تا ۱۰۰vh',d:`<div class="nav"><span>لوگو</span><span>خدمات · پزشکان · قبل و بعد · هزینه و پرداخت · آدرس و ساعات</span><span class="pill">رزرو نوبت</span></div><div class="box photo" style="top:28px;left:0;right:0;bottom:0;padding-top:262px">عکس واقعی تمام‌عرض (LCP از ۷۴۴px)</div><div class="mark" style="width:72px;height:94px;top:34px;left:10px;background:#fff;opacity:.8"></div><div class="text" style="top:40px;left:88px;width:130px;font-size:8px;line-height:1.5;color:var(--color-ink-faint)">نقش برجستهٔ ایستا (اختیاری؛ روی اولین عکس واقعی سنجیده می‌شود)</div><div class="scrim" style="top:100px;right:28px;width:300px"><div class="h">اولین کلینیک دندانپزشکی دیجیتال جنوب تهران</div><div style="margin-top:6px;color:var(--color-ink-muted)">مشاورهٔ اول رایگان است. در همان جلسه معاینه می‌شوید و برنامهٔ درمان و هزینه را شفاف می‌شنوید.</div><div style="margin-top:10px"><span class="btn s">تماس با کلینیک</span></div></div><div class="card" style="top:100px;left:28px;width:200px"><div class="ct">درخواست نوبت</div><div style="color:var(--color-ink-muted);font-size:8px;margin-top:3px">شماره‌تان را بگذارید. پذیرش زمان دقیق نوبت را هماهنگ می‌کند.</div><div style="font-size:8px;margin-top:6px">شمارهٔ موبایل</div><div class="field"></div><span class="btn wide">ثبت درخواست</span></div><div class="facts" style="grid-template-columns:repeat(4,1fr)"><div><b>مشاورهٔ اول رایگان</b><span>معاینه و برنامهٔ درمان در همان جلسه</span></div><div><b>هر روز ۱۰ تا ۲۰</b><span>به‌جز تعطیلات رسمی</span></div><div><b>تماس پذیرش تا ۱۰ دقیقه</b><span>معمولاً، در ساعات کاری</span></div><div><b>بیمه‌های طرف قرارداد</b><span>ایران، کارآفرین، پاسارگاد، البرز، بیمهٔ ما و سایر بیمه‌ها</span></div></div><div class="cam" style="bottom:62px">دنیای سه‌بعدی پشت عکس است و در خروج هیرو دیده می‌شود</div>`,p:`<div class="box" style="top:28px;left:0;right:0;bottom:0;border:0;border-radius:0;background:var(--color-surface-sunken)"></div><div class="nav"><span>لوگو</span><span>☏ ☰</span></div><div class="scrim" style="top:38px;right:10px;left:10px;padding:10px"><div class="h">اولین کلینیک دندانپزشکی دیجیتال جنوب تهران</div><div style="margin-top:4px;color:var(--color-ink-muted);font-size:9px">مشاورهٔ اول رایگان است؛ معاینه و برنامهٔ درمان در همان جلسه.</div><div style="margin-top:8px"><span class="btn s">تماس با کلینیک</span></div></div><div class="text" style="top:186px;left:12px;font-size:7px;color:var(--color-ink-faint)">LCP = متن هیرو</div><div class="card" style="top:200px;right:10px;left:10px;padding:10px"><div class="ct">درخواست نوبت</div><div style="color:var(--color-ink-muted);font-size:8px;margin-top:2px">شماره‌تان را بگذارید.</div><div style="font-size:8px;margin-top:5px">شمارهٔ موبایل</div><div class="field"></div><span class="btn wide">ثبت درخواست</span><div style="font-size:7px;color:var(--color-ink-faint);margin-top:6px;text-align:center">↓ بعد از کارت: نوار عکس ۴:۵ با چهار واقعیت</div></div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'02-trust',t:'۲ نوار اعتماد و خروج هیرو ۱۰۰ تا ۱۴۰vh',d:`<div class="box photo" style="top:-150px;left:0;right:0;height:300px;padding-top:0;align-items:flex-end;padding-bottom:96px">انتهای عکس هیرو<div class="facts" style="grid-template-columns:repeat(4,1fr)"><div><b>مشاورهٔ اول رایگان</b><span>معاینه و برنامهٔ درمان در همان جلسه</span></div><div><b>هر روز ۱۰ تا ۲۰</b><span>به‌جز تعطیلات رسمی</span></div><div><b>تماس پذیرش تا ۱۰ دقیقه</b><span>معمولاً، در ساعات کاری</span></div><div><b>بیمه‌های طرف قرارداد</b><span>ایران، کارآفرین، پاسارگاد، البرز، بیمهٔ ما و سایر بیمه‌ها</span></div></div></div><div class="card" style="top:-150px;left:28px;width:200px;height:170px"></div><div class="scrim" style="top:-150px;right:28px;width:300px;height:166px"></div><div class="arrow" style="top:66px;right:270px">↑ عکس ۰٫۸۵x · کارت و نوار ۱x</div><div class="bar" style="width:600px;top:330px;left:20px;opacity:.25;transform:rotate(-3deg)"></div><div class="relief" style="width:150px;height:150px;top:190px;left:250px;opacity:.8"></div><div class="relief" style="width:90px;height:90px;top:250px;right:70px;opacity:.6"></div><div class="mark" style="width:70px;height:90px;top:185px;left:60px;opacity:.9"></div><div class="gem" style="top:200px;left:190px"></div><div class="gem" style="top:300px;left:420px"></div><div class="gem" style="top:360px;left:170px"></div><div class="gem" style="top:330px;right:40px"></div><div class="text" style="top:175px;right:40px;width:230px;color:var(--color-ink-muted)">عکس با سرعت ۰٫۸۵ بالا می‌رود؛ دنیای چینی از زیر آن پیدا می‌شود. نوار اعتماد همراه هیرو می‌رود؛ واقعیت‌ها ثابت‌اند، بی شمارنده.</div><div class="cam">دوربین ۳ درجه کج می‌شود؛ نشان بالا می‌رود و قهرمان صحنهٔ ۳ می‌شود</div>`,p:`<div class="card" style="top:-60px;right:10px;left:10px;height:135px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end"><div class="field"></div><span class="btn wide">ثبت درخواست</span></div><div class="box photo" style="top:86px;left:0;right:0;aspect-ratio:4/5;border-radius:0;border-inline:0;align-items:flex-start;padding-top:22px;overflow:hidden">نوار عکس ۴:۵ تمام‌عرض<br>بدون اولویت بارگذاری<div class="facts" style="grid-template-columns:1fr 1fr"><div><b>مشاورهٔ اول رایگان</b><span>معاینه و برنامهٔ درمان در همان جلسه</span></div><div><b>هر روز ۱۰ تا ۲۰</b><span>به‌جز تعطیلات رسمی</span></div><div><b>تماس پذیرش تا ۱۰ دقیقه</b><span>معمولاً، در ساعات کاری</span></div><div><b>بیمه‌های طرف قرارداد</b><span>ایران، کارآفرین، پاسارگاد، البرز، بیمهٔ ما و سایر بیمه‌ها</span></div></div></div><div class="relief" style="width:34px;height:34px;top:338px;left:14px;opacity:.8"></div><div class="mark" style="width:22px;height:28px;top:341px;right:16px;opacity:.9"></div><div class="gem" style="top:352px;left:62px"></div><div class="text" style="top:358px;right:44px;left:58px;text-align:center;font-size:7px;color:var(--color-ink-faint)">دنیا بعد از رفتن نوار عکس</div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
{id:'03-services',t:'۳ خدمات: چرخش افقی ۱۴۰ تا ۴۴۰vh (پین)',d:`<div class="arrow" style="top:40px;right:40px">◀ ریل افقی با اسکرول عمودی</div><div class="mark" style="width:36px;height:46px;top:60px;left:302px;opacity:.9"></div><div class="text" style="top:60px;left:345px;color:var(--color-ink-muted)">نشان به آیکون هر دسته مورف می‌شود</div><div class="box" style="top:130px;right:40px;width:170px;height:200px">زیبایی<br>۶ خدمت</div><div class="box" style="top:130px;right:230px;width:170px;height:200px">جراحی و جایگزینی<br>۵ خدمت</div><div class="box" style="top:130px;right:420px;width:170px;height:200px;opacity:.5">درمان و نگهداری</div><div class="bar" style="width:600px;top:360px;left:20px;opacity:.3"></div><div class="bar" style="width:140px;top:360px;right:20px"></div><div class="relief" style="width:160px;height:160px;top:200px;left:-60px;opacity:.6"></div><div class="cam">پس‌زمینهٔ WebGL با نیم‌سرعت؛ کارت‌ها DOM</div>`,p:`<div class="mark" style="width:30px;height:38px;top:50px;left:85px;opacity:.9"></div><div class="text" style="top:95px;right:12px;left:12px;text-align:center;color:var(--color-ink-muted)">ردیف اسکرول افقی بومی با snap</div><div class="box" style="top:130px;right:12px;width:140px;height:180px">زیبایی</div><div class="box" style="top:130px;right:164px;width:140px;height:180px">جراحی</div><div class="bar" style="width:170px;top:325px;left:15px;opacity:.3"></div><div class="bar" style="width:40px;top:325px;right:15px"></div><div class="sticky"><div>تماس</div><div>واتساپ</div><div>رزرو نوبت</div></div>`},
