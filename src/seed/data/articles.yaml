  # ARTICLE-6
  - slug: بیمه-تکمیلی-دندانپزشکی
    title: بیمهٔ تکمیلی دندانپزشکی؛ پیش از درمان چه چیزهایی را بپرسید؟
    seo_title: بیمه تکمیلی دندانپزشکی؛ چه بپرسید؟
    seo_description: >-
      پوشش بیمه تکمیلی دندانپزشکی به بیمه‌نامهٔ شما بستگی دارد. سقف پرداخت، سهم شما،
      دورهٔ انتظار و استثناها را بشناسید و پیش از درمان از بیمه‌گر بپرسید.
    excerpt: >-
      شرایط هر بیمهٔ تکمیلی فرق دارد و پاسخ دقیق در بیمه‌نامهٔ خود شماست. این
      مقاله بخش‌هایی را که در بیمه‌نامه‌های دندانپزشکی ممکن است ببینید ساده توضیح
      می‌دهد و پرسش‌های پیش از درمان را فهرست می‌کند.
    category: هزینه-و-بیمه
    primary_service: null
    is_medical: false
    body:
      - type: content
        text: |-
          اگر بیمهٔ تکمیلی دارید، احتمالاً می‌خواهید بدانید چه بخشی از هزینهٔ درمان دندان را می‌پردازد. پاسخ کوتاه این است: به بیمه‌نامهٔ شما بستگی دارد. بیمه‌نامه‌های مختلف پوشش‌های متفاوتی دارند.

          این مقاله دربارهٔ هیچ بیمهٔ خاصی نیست. بخش‌هایی را توضیح می‌دهد که انجمن دندانپزشکی آمریکا برای بیمه‌های دندانپزشکی در آمریکا شرح می‌دهد. این بخش‌ها ممکن است در بیمه‌نامهٔ شما نام و جزئیات دیگری داشته باشند یا اصلاً نباشند. پاسخ دقیق را فقط بیمه‌نامهٔ شما و بیمه‌گرتان می‌دهند.

          ## بیمه‌نامهٔ دندانپزشکی چه بخش‌هایی دارد؟
          به گفتهٔ انجمن دندانپزشکی آمریکا، طرح‌های بیمهٔ دندانپزشکی پوشش‌های متفاوتی دارند و احتمالاً هیچ طرحی همهٔ هزینه‌ها را نمی‌پردازد. این بخش‌ها را در بیمه‌نامهٔ خود پیدا کنید:
      - type: table
        caption: بخش‌هایی که ممکن است در بیمه‌نامهٔ دندانپزشکی شما باشد و پرسشی که دربارهٔ هر کدام دارید
        head: [بخش بیمه‌نامه, یعنی چه؟, از بیمه‌گر بپرسید]
        rows:
          - [
              سقف پرداخت,
              بیشترین مبلغی که بیمه در یک دورهٔ بیمه برای درمان دندان می‌پردازد. هزینهٔ بیشتر از سقف با خود شماست.,
              سقف من چقدر است و برای چه دوره‌ای حساب می‌شود؟,
            ]
          - [
              سقف جدا برای بعضی درمان‌ها,
              بعضی بیمه‌نامه‌ها برای درمانی مانند ارتودنسی سقفی برای همهٔ مدت بیمه دارند.,
              ارتودنسی پوشش دارد؟ سقف و محدودیت آن چیست؟,
            ]
          - [
              سهم شما یا فرانشیز,
              درصدی از هزینهٔ درمان‌های تحت پوشش که بیمه نمی‌پردازد و با خود شماست. هزینهٔ درمانی که پوشش ندارد یا بیشتر از سقف است هم با شماست.,
              سهم من برای این درمان چند درصد است؟,
            ]
          - [
              دورهٔ انتظار,
              فاصلهٔ بین شروع بیمه تا روزی که می‌توانید از یک پوشش استفاده کنید.,
              برای این درمان دورهٔ انتظار هست؟ کی تمام می‌شود؟,
            ]
          - [
              استثناها,
              درمان‌هایی که بیمه نمی‌پردازد؛ مثلاً درمان‌های زیبایی مانند سفید کردن دندان. بعضی بیمه‌نامه‌ها ایمپلنت را هم پوشش نمی‌دهند.,
              درمانی که دندانپزشک پیشنهاد کرده، پوشش دارد؟,
            ]
          - [
              محدودیت دفعات,
              بیمه ممکن است یک خدمت را فقط چند بار در یک دوره بپردازد؛ مثلاً جرم‌گیری را.,
              این خدمت چند بار در سال پوشش دارد؟,
            ]
          - [
              پرداخت به اندازهٔ درمان ارزان‌تر,
              اگر برای یک مشکل چند درمان قابل قبول باشد، بیمه ممکن است فقط هزینهٔ درمان ارزان‌تر را بپردازد و تفاوت با شما باشد.,
              اگر درمان دیگری انتخاب کنم، بیمه چه مبلغی می‌پردازد؟,
            ]
          - [
              مشکلی که پیش از بیمه داشته‌اید,
              بعضی بیمه‌نامه‌ها مشکلی را که پیش از شروع بیمه داشته‌اید پوشش نمی‌دهند؛ مثلاً دندانی که پیش‌تر از دست رفته بود.,
              مشکلی که پیش از بیمه داشتم، پوشش دارد؟,
            ]
      - type: content
        text: |-
          به گفتهٔ انجمن دندانپزشکی آمریکا، در بیشتر طرح‌های بیمهٔ دندانپزشکی در آمریکا، سقفی که در یک دوره استفاده نکرده‌اید به دورهٔ بعد منتقل نمی‌شود. تاریخ پایان دورهٔ بیمه را در بیمه‌نامهٔ خود ببینید و از بیمه‌گر بپرسید سقف استفاده‌نشده چه می‌شود.

          ## بیمه چه چیزی را تعیین می‌کند و چه چیزی را نه؟
          شرایط بیمه تعیین می‌کند بیمه چه مبلغی از هزینه را بپردازد. این شرایط نمی‌گویند چه درمانی برای دندان شما لازم است. به گفتهٔ انجمن دندانپزشکی آمریکا، مناسب‌ترین درمان را دندانپزشک و بیمار با هم انتخاب می‌کنند و هزینه یکی از عامل‌های مهم این تصمیم است.

          یک نمونه پر کردن دندان است. انجمن دندانپزشکی آمریکا می‌گوید بعضی بیمه‌ها برای پرکردگی همرنگ دندان‌های عقب، فقط به اندازهٔ پرکردگی فلزی (آمالگام) پرداخت می‌کنند. گاهی هم برای روکش، فقط به اندازهٔ یک پرکردگی بزرگ پرداخت می‌شود. در این حالت تفاوت هزینه با خود بیمار است. به گفتهٔ همین انجمن، درمان ارزان‌تر همیشه به سود شما نیست. پیش از تصمیم، خطرها و فایده‌های هر گزینه را از دندانپزشک بپرسید. دربارهٔ پر کردن دندان و سطح‌های ترمیم در کلینیک سفید، صفحهٔ [ترمیم دندان](/خدمات/ترمیم-دندان) را بخوانید.

          درمان‌های زیبایی هم ممکن است پوشش نداشته باشند. انجمن دندانپزشکی آمریکا لمینت را درمان زیبایی می‌داند و می‌گوید ممکن است بیمه هزینهٔ آن را نپردازد، مگر این‌که از نظر درمانی لازم شناخته شود.
      - type: callout
        tone: info
        text: انتخاب درمان با معاینه و تشخیص دندانپزشک است. پیش از تصمیم، از بیمه‌گر بپرسید برای درمان پیشنهادی چه مبلغی می‌پردازد.
      - type: content
        text: |-
          ## پیش از شروع درمان چه بپرسید؟
          این پرسش‌ها را از بیمه‌گر خود بپرسید. اگر بیمه را از محل کارتان دارید، می‌توانید از کارفرما هم بپرسید.
          - بیمه‌نامهٔ من پوشش دندانپزشکی دارد؟ کدام درمان‌ها را شامل می‌شود؟
          - سقف پرداخت دندانپزشکی من چقدر است و چه مقدار از آن مانده است؟
          - سهم من از هزینهٔ این درمان چند درصد است؟
          - برای این درمان دورهٔ انتظار هست؟
          - دندانپزشک را خودم انتخاب کنم یا فقط مرکزهای خاصی پوشش دارند؟
          - مشکلی که پیش از شروع بیمه داشتم، پوشش دارد؟
          - درمان اورژانسی دندان پوشش دارد؟
          - پیش از شروع درمان می‌توانم بدانم بیمه چه مبلغی می‌پردازد؟
          - برای دریافت سهم بیمه چه مدرکی لازم است؟

          ## برای دریافت سهم بیمه چه مدارکی لازم است؟
          به تعریف انجمن دندانپزشکی آمریکا، درخواست پرداخت از بیمه فهرستی از خدمات انجام‌شده، تاریخ آن‌ها و هزینهٔ هر کدام است. فهرست دقیق مدارک را بیمه‌گر شما تعیین می‌کند. پیش از درمان آن را از بیمه‌گر بپرسید.

          ## در کلینیک سفید از کجا شروع کنید؟
          پیش از نوبت، نام بیمهٔ تکمیلی خود را به پذیرش بگویید. سهم بیمه به نوع درمان و بیمه‌نامهٔ شما بستگی دارد؛ دربارهٔ آن از پذیرش بپرسید. فهرست بیمه‌ها و شرایط پرداخت را در صفحهٔ [هزینه‌ها، بیمه و شرایط پرداخت](/هزینه-و-پرداخت) ببینید.

          هزینهٔ هر درمان پس از معاینه مشخص می‌شود. در [راهنمای اولین مراجعه](/راهنمای-بیمار/اولین-مراجعه) بخوانید برای اولین مراجعه چه چیزهایی همراه بیاورید.
    faqs:
      - question: بیمهٔ تکمیلی همهٔ هزینهٔ دندانپزشکی را می‌پردازد؟
        answer: >-
          معمولاً نه. به گفتهٔ انجمن دندانپزشکی آمریکا، احتمالاً هیچ طرح بیمهٔ
          دندانپزشکی همهٔ هزینه‌ها را نمی‌پردازد. سقف پرداخت، سهم خودتان و
          استثناها را در بیمه‌نامهٔ خود ببینید.
      - question: بیمه هزینهٔ لمینت یا سفید کردن دندان را می‌پردازد؟
        answer: >-
          به بیمه‌نامهٔ شما بستگی دارد. انجمن دندانپزشکی آمریکا سفید کردن دندان را
          از نمونه‌های درمان‌هایی می‌آورد که بیمه ممکن است نپردازد. لمینت هم درمان زیبایی
          شمرده می‌شود و ممکن است پوشش نداشته باشد، مگر این‌که از نظر درمانی لازم
          باشد. پیش از درمان از بیمه‌گر بپرسید.
      - question: دورهٔ انتظار در بیمهٔ دندانپزشکی یعنی چه؟
        answer: >-
          فاصلهٔ بین شروع بیمه تا روزی است که می‌توانید از یک پوشش استفاده کنید.
          مدت آن را در بیمه‌نامهٔ خود ببینید یا از بیمه‌گر بپرسید.
      - question: آیا بیمه تعیین می‌کند چه درمانی انجام شود؟
        answer: >-
          نه. شرایط بیمه تعیین می‌کند بیمه چه مبلغی بپردازد. انتخاب درمان با معاینه
          و تشخیص دندانپزشک است و تصمیم نهایی با خود شماست.
