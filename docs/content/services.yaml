  - key: pediatric
    category: pediatric
    nav_label: دندانپزشکی کودکان
    h1: دندانپزشکی کودکان
    seo_title: دندانپزشکی کودکان در جنوب تهران
    slug: دندانپزشکی-کودکان
    booking_group: kids
    priority: 2
    search_terms: [دندانپزشکی کودکان, دندانپزشکی اطفال جنوب تهران, فیشور سیلانت, فلوراید تراپی]
    summary: معاینه، پیشگیری و درمان دندان‌های شیری و دائمی کودکان.
    seo_description: >-
      دندانپزشکی کودکان در کلینیک دندانپزشکی سفید: معاینهٔ دوره‌ای، فیشور
      سیلانت و وارنیش فلوراید، درمان پوسیدگی دندان شیری و مراقبت در خانه. جنوب
      تهران.
    sessions: بسته به درمان؛ معاینه معمولاً هر ۶ ماه
    duration: وارنیش فلوراید معمولاً چند دقیقه
    anesthesia: بی‌حسی موضعی، در صورت نیاز
    related: [orthodontics, restoration, extraction]
    body:
      - type: content
        text: |-
          ## دندانپزشکی کودکان چیست؟
          دندانپزشکی کودکان به معاینه، پیشگیری و درمان دندان‌های شیری و دائمی کودکان و نوجوانان می‌پردازد. هدف آن این است که پوسیدگی و مشکلات دیگر زود پیدا شوند و دندان‌های کودک سالم بمانند.

          ## چرا دندان‌های شیری مهم‌اند؟
          دندان‌های شیری بالاخره می‌افتند، اما تا آن موقع کار مهمی دارند. کودک با آن‌ها غذا می‌جود و واضح صحبت می‌کند. دندان‌های شیری جای دندان‌های دائمی را هم نگه می‌دارند تا درست بیرون بیایند. اگر دندان شیری با پوسیدگی از دست برود، ممکن است برای دندان دائمی مشکل ایجاد کند.

          پوسیدگی در کودکان شایع است و ممکن است اول هیچ نشانه‌ای نداشته باشد. به همین دلیل معاینهٔ منظم لازم است، حتی وقتی کودک دندان‌درد ندارد.

          ## برای چه کسی مناسب است؟
          - کودک خردسال، از زمانی که دندان‌هایش بیرون می‌آیند. معاینهٔ دندان بهتر است دیرتر از یک‌سالگی نباشد.
          - معاینهٔ دوره‌ای کودکان و نوجوانان، معمولاً هر ۶ ماه یا به فاصله‌ای که دندانپزشک می‌گوید
          - پیشگیری از پوسیدگی با وارنیش فلوراید و فیشور سیلانت
          - درمان پوسیدگی دندان‌های شیری و دائمی
          - کودکی که دندانش درد می‌کند یا با ضربه آسیب دیده است

          ## پیشگیری با وارنیش فلوراید و فیشور سیلانت
          فلوراید تراپی یعنی زدن فلوراید روی دندان در مطب. این فلوراید ممکن است به شکل ژل، فوم یا وارنیش باشد. وارنیش فلوراید لایه‌ای با مقدار زیاد فلوراید است که روی سطح دندان زده می‌شود. فلوراید مینای دندان را در برابر پوسیدگی مقاوم‌تر می‌کند و می‌تواند پوسیدگی بسیار اولیه را برگرداند. وارنیش هم روی دندان شیری و هم روی دندان دائمی زده می‌شود، معمولاً هر ۶ ماه، و بعضی کودکان آن را با فاصلهٔ کوتاه‌تری لازم دارند. زدن آن معمولاً چند دقیقه طول می‌کشد. مرور مطالعه‌ها نشان می‌دهد وارنیش فلوراید پوسیدگی دندان‌های شیری و دائمی را کم می‌کند.

          فیشور سیلانت پوشش نازکی است که روی شیارهای سطح جوندهٔ دندان‌های آسیا زده می‌شود تا غذا و میکروب در این شیارها نماند. معمولاً وقتی دندان‌های آسیای دائمی بیرون می‌آیند زده می‌شود، یعنی برای آسیای دائمی اول حدود ۶ تا ۷ سالگی و برای آسیای دائمی دوم بین ۱۱ تا ۱۴ سالگی. برای زدن آن، دندان تمیز و خشک می‌شود، ژل مخصوصی برای چسبیدن بهتر روی آن زده و شسته می‌شود و سپس سیلانت روی شیارها زده و با نور سخت می‌شود. سیلانت چند سال می‌ماند و دندانپزشک در معاینه‌های دوره‌ای آن را بررسی و در صورت نیاز ترمیم یا تجدید می‌کند. مرور مطالعه‌ها نشان می‌دهد سیلانت رزینی پوسیدگی دندان‌های آسیای دائمی را کم می‌کند.

          سیلانت و وارنیش جای مسواک زدن را نمی‌گیرند. اینکه کدام یک یا هر دو برای کودک شما مناسب است، با معاینه و تشخیص دندانپزشک مشخص می‌شود.
      - type: callout
        tone: info
        text: انتخاب درمان کودک با معاینه و تشخیص دندانپزشک است. اگر کودک بیماری دارد، دارو مصرف می‌کند یا به دارویی حساسیت دارد، پیش از شروع کار به دندانپزشک بگویید.
      - type: steps
        items:
          - title: پرسش از والدین
            text: دندانپزشک دربارهٔ سلامت کودک، داروها، تغذیه، شیشهٔ شیر و عادت مسواک زدن او می‌پرسد.
          - title: معاینه
            text: دندان‌ها، لثه و رشد فک کودک معاینه می‌شود. اگر لازم باشد، عکس رادیوگرافی هم گرفته می‌شود؛ کودکان چون دندان و فکشان در حال رشد است، گاهی بیشتر از بزرگسالان به آن نیاز دارند.
          - title: بررسی خطر پوسیدگی
            text: دندانپزشک بررسی می‌کند کودک چقدر در معرض پوسیدگی است تا برنامهٔ پیشگیری و فاصلهٔ معاینه‌ها را بر همین اساس بگذارد.
          - title: پیشگیری و آموزش
            text: در صورت نیاز، دندانپزشک ممکن است تمیز کردن دندان‌ها، وارنیش فلوراید یا فیشور سیلانت را پیشنهاد کند. والدین هم دربارهٔ مسواک زدن، خمیردندان، تغذیه و عادت‌هایی مثل مکیدن انگشت راهنمایی می‌شوند.
          - title: برنامهٔ درمان و نوبت بعد
            text: اگر پوسیدگی یا مشکل دیگری باشد، دندانپزشک درمان لازم و راه‌های دیگر را توضیح می‌دهد. معاینهٔ بعد معمولاً ۶ ماه بعد است، یا زودتر اگر کودک نیاز داشته باشد.
      - type: content
        text: |-
          ## درمان پوسیدگی دندان کودک
          هر پوسیدگی لزوماً ترمیم لازم ندارد. پوسیدگی بسیار اولیه را گاهی می‌شود با فلوراید و مراقبت در خانه متوقف کرد. اگر در دندان حفره ایجاد شده باشد، معمولاً ترمیم لازم است. اگر پوسیدگی به مغز دندان (پالپ) رسیده باشد، ممکن است درمان عصب دندان لازم شود تا خود دندان نگه داشته شود. گاهی هم دندان باید کشیده شود؛ صفحهٔ [کشیدن دندان](/خدمات/کشیدن-دندان) نکته‌های کشیدن دندان شیری را هم توضیح می‌دهد.

          ترمیم به‌تنهایی جلوی پوسیدگی‌های بعدی را نمی‌گیرد. مسواک زدن با خمیردندان فلورایددار، کم کردن قند و معاینهٔ منظم هم لازم است.

          اگر درمان با بی‌حسی موضعی انجام شود، لب، گونه و زبان کودک تا مدتی بی‌حس می‌ماند. در این مدت مراقب باشید کودک لب، گونه یا زبانش را گاز نگیرد و تا وقتی بی‌حسی از بین نرفته است، به او غذای جویدنی ندهید. از دندانپزشک بپرسید بی‌حسی معمولاً چقدر طول می‌کشد.

          اگر کودک با وجود آماده‌سازی نتواند درمان را روی صندلی دندانپزشکی تحمل کند، دندانپزشک راه‌های دیگر را با شما در میان می‌گذارد. گاهی درمان غیرفوری به نوبت دیگری موکول می‌شود تا کودک آماده‌تر شود.

          ## مراقبت از دندان کودک در خانه
          - از وقتی دندان کودک بیرون می‌آید، روزی دو بار مسواک بزنید؛ یک بار آخر شب پیش از خواب.
          - تا ۳ سالگی، خمیردندان فلورایددار را به اندازهٔ یک دانهٔ برنج بزنید و از ۳ تا ۶ سالگی به اندازهٔ یک نخود.
          - خمیردندان کودک دست‌کم ۱٬۰۰۰ پی‌پی‌ام فلوراید داشته باشد؛ این عدد معمولاً روی جعبه نوشته شده است.
          - بعد از مسواک، کودک خمیردندان را بیرون بریزد، اما دهانش را با آب نشوید تا فلوراید بهتر اثر کند.
          - تا حدود ۷ سالگی، هنگام مسواک زدن کنار کودک باشید و بر کار او نظارت کنید.
          - غذا و نوشیدنی شیرین را کم کنید.
          - در شیشهٔ کودک فقط شیر، شیر خشک یا شیر مادر بریزید، نه آبمیوه یا آب‌قند. کودک شیشهٔ شیرش را پیش از خواب تمام کند و با شیشه در دهان نخوابد.
          - پستانک را در شکر یا عسل نزنید.

          ## اگر دندان کودک ضربه خورد
          اگر دندان شیری کودک با ضربه افتاد، آن را سر جایش برنگردانید، چون ممکن است به دندان دائمی زیر آن آسیب بزند. اگر دندان دائمی افتاد، آن را از تاج، یعنی بخش سفیدی که بیرون از لثه است، بگیرید و به ریشه دست نزنید. اگر کثیف است، آرام در شیر یا بزاق بشویید و سعی کنید سر جایش برگردانید. اگر راحت جا رفت، کودک آرام روی یک دستمال تمیز گاز بگیرد تا دندان سر جایش بماند. اگر جا نرفت، دندان را در شیر بگذارید، یا کودک در ظرف کوچکی تف کند و دندان را در آن بگذارید. در هر حالت، حتی اگر دندان را پیدا نکردید، هرچه زودتر با دندانپزشک تماس بگیرید. هرچه زودتر برسید، شانس نگه داشتن دندان دائمی بیشتر است. صفحهٔ [اورژانس دندانپزشکی](/اورژانس) کارهای فوری را توضیح می‌دهد.

          ## اگر کودک نگران است
          - پیش از نوبت، با لحن مثبت و آرام دربارهٔ دندانپزشکی صحبت کنید و از واژه‌های ترسناک پرهیز کنید.
          - اگر خودتان از دندانپزشکی می‌ترسید، سعی کنید این ترس را به کودک نشان ندهید؛ ترس والدین ممکن است به کودک منتقل شود.
          - اگر کودک قبلاً تجربهٔ بدی داشته یا خیلی می‌ترسد، پیش از شروع کار به دندانپزشک بگویید.
          - معاینه‌های منظم از سال‌های کودکی، کودک را با محیط دندانپزشکی آشنا می‌کند.

          ## چه وقت با کلینیک تماس بگیرید؟
          - کودک دندان‌درد دارد یا هنگام خوردن چیزهای سرد، گرم یا شیرین درد می‌کشد.
          - لکه‌های سفید، قهوه‌ای یا سیاه روی دندان‌های کودک می‌بینید.
          - لثهٔ کودک ورم کرده، دردناک است یا هنگام مسواک خون می‌آید.
          - صورت یا فک کودک ورم کرده یا کودک تب دارد. اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید.
          - دندان کودک با ضربه شکسته یا افتاده است.
    faqs:
      # Article-owned term («اولین دندانپزشکی کودک», keyword map 3) and guide-owned term
      # («ترس از دندانپزشکی», keyword map 1) are not targeted here; link both when they publish (H28).
      - question: معاینهٔ دندان کودک هر چند وقت یک بار لازم است؟
        answer: >-
          معمولاً هر ۶ ماه، یا به فاصله‌ای که دندانپزشک بر اساس خطر پوسیدگی کودک
          می‌گوید. معاینه از زمانی شروع می‌شود که دندان‌های کودک بیرون می‌آیند و
          بهتر است دیرتر از یک‌سالگی نباشد.
      - question: دندان شیری که بالاخره می‌افتد، چرا باید درمان شود؟
        answer: >-
          دندان شیری برای جویدن و صحبت کردن لازم است و جای دندان دائمی را نگه
          می‌دارد تا درست بیرون بیاید. اگر دندان شیری با پوسیدگی از دست برود،
          ممکن است برای دندان دائمی مشکل ایجاد کند. پوسیدگی درمان‌نشده هم ممکن
          است به درد و عفونت برسد.
      - question: فیشور سیلانت چیست و برای چه سنی است؟
        answer: >-
          پوشش نازکی است که روی شیارهای سطح جوندهٔ دندان‌های آسیا زده می‌شود تا
          غذا و میکروب در آن‌ها نماند. معمولاً وقتی دندان‌های آسیای دائمی بیرون
          می‌آیند زده می‌شود، یعنی برای آسیای دائمی اول حدود ۶ تا ۷ سالگی و برای
          آسیای دائمی دوم بین ۱۱ تا ۱۴ سالگی. سیلانت جای مسواک زدن را نمی‌گیرد.
      - question: فلوراید تراپی و وارنیش فلوراید چیست و هر چند وقت لازم است؟
        answer: >-
          فلوراید تراپی یعنی زدن فلوراید روی دندان در مطب، به شکل ژل، فوم یا
          وارنیش. وارنیش فلوراید لایه‌ای با مقدار زیاد فلوراید است که روی سطح
          دندان زده می‌شود و مینای دندان را در برابر پوسیدگی مقاوم‌تر می‌کند. زدن
          آن معمولاً چند دقیقه طول می‌کشد و معمولاً هر ۶ ماه تکرار می‌شود. بعضی
          کودکان آن را با فاصلهٔ کوتاه‌تری لازم دارند و دندانپزشک فاصلهٔ آن را
          می‌گوید.
      - question: برای کودکم چقدر خمیردندان بزنم؟
        answer: >-
          تا ۳ سالگی به اندازهٔ یک دانهٔ برنج و از ۳ تا ۶ سالگی به اندازهٔ یک
          نخود خمیردندان فلورایددار. بعد از مسواک، کودک خمیردندان را بیرون بریزد،
          اما دهانش را با آب نشوید. تا حدود ۷ سالگی بر مسواک زدن او نظارت کنید.
      - question: اگر دندان کودکم با ضربه افتاد چه کنم؟
        answer: >-
          دندان شیری را سر جایش برنگردانید، چون ممکن است به دندان دائمی زیر آن
          آسیب بزند. دندان دائمی را از تاج بگیرید، به ریشه دست نزنید و سعی کنید
          سر جایش برگردانید. اگر جا نرفت، آن را در شیر، یا در ظرفی که کودک در آن
          تف کرده است، نگه دارید. در هر حالت، حتی اگر دندان را پیدا نکردید،
          هرچه زودتر با دندانپزشک تماس بگیرید.
      - question: کودکم نگران نوبت دندانپزشکی است؛ چه کنم؟
        answer: >-
          پیش از نوبت، با لحن مثبت و آرام دربارهٔ دندانپزشکی صحبت کنید و از
          واژه‌های ترسناک پرهیز کنید. اگر کودک قبلاً تجربهٔ بدی داشته یا خیلی
          می‌ترسد، پیش از شروع کار به دندانپزشک بگویید. معاینه‌های منظم، کودک را
          با محیط دندانپزشکی آشنا می‌کند.
      - question: هزینهٔ دندانپزشکی کودکان چقدر است؟
        answer: >-
          هزینه به نوع درمان و تعداد دندان‌ها بستگی دارد و پس از معاینه مشخص
          می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
