  - key: guide-first-visit
    slug: اولین-مراجعه
    title: اولین مراجعه به کلینیک سفید چگونه است؟
    seo_title: اولین مراجعه به دندانپزشکی
    seo_description: >-
      اولین مراجعه به دندانپزشکی چگونه است؟ بخوانید معاینه چه مرحله‌هایی دارد، چه
      مدارکی همراه بیاورید و پیش از شروع درمان چه بپرسید.
    lead: از ثبت درخواست تا پایان اولین جلسه، چه پیش می‌آید و چه همراه بیاورید.
    # Phase 6 copy (G1): general advice from the sources below. No plan or cost promise for the
    # same visit (gaps 25, 50), no free-consultation line (gap 17 is a flag), and the documents
    # list is advice, not the clinic's rule (gap 61).
    blocks:
      - type: content
        text: |-
          ## پیش از نوبت چه کنید؟
          نوبت را در صفحهٔ [رزرو نوبت](/رزرو-نوبت) درخواست کنید یا با کلینیک تماس بگیرید. پذیرش زمان نوبت را با شما هماهنگ می‌کند. نشانی و ساعات کاری کلینیک را در صفحهٔ [آدرس و ساعات](/آدرس) ببینید.

          اگر درد شدید یا ورم صورت دارید، منتظر نوبت عادی نمانید و صفحهٔ [درد شدید دندان](/اورژانس) را ببینید. اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید.

          پیش از نوبت، این‌ها را یادداشت کنید تا در جلسه فراموش نشود:
          - دردی، خونریزی لثه یا مشکل دیگری که در دهان دارید و از چه زمانی شروع شده است
          - بیماری‌هایی که دارید و داروهایی که مصرف می‌کنید، از جمله داروهای بدون نسخه، ویتامین‌ها و مکمل‌ها
          - حساسیت (آلرژی) به دارو یا هر مادهٔ دیگر
          - اگر باردار هستید یا ممکن است باشید، ماه بارداری
          - سؤال‌هایی که از دندانپزشک دارید

          اگر نوبت برای کودک است، صفحهٔ [دندانپزشکی کودکان](/خدمات/دندانپزشکی-کودکان) را هم ببینید.

          ## چه مدارکی همراه بیاورید؟
          این فهرست یک پیشنهاد کلی است:
          - کارت ملی یا کارت شناسایی دیگر
          - اگر بیمهٔ تکمیلی دارید، کارت یا مشخصات بیمه‌نامهٔ آن
          - عکس‌های رادیولوژی قبلی دندان، اگر دارید
          - فهرست داروهایی که مصرف می‌کنید

          دندانپزشک ممکن است به‌جای عکس تازه، از عکس‌های قبلی شما استفاده کند. اگر دربارهٔ مدرک خاصی سؤال دارید، پیش از نوبت از پذیرش بپرسید.

          ## معاینهٔ دندانپزشکی چگونه است؟
          معاینه برای این است که دندانپزشک ببیند دندان‌ها، لثه و دهان شما سالم هستند یا نه. یک معاینهٔ دندانپزشکی معمولاً این مرحله‌ها را دارد:
      - type: steps
        items:
          - title: گفت‌وگو دربارهٔ سلامت شما
            text: >-
              دندانپزشک ممکن است دربارهٔ درد یا خونریزی در دهان، مسواک زدن، بیماری‌ها،
              حساسیت‌ها و داروهای شما، تغذیه و سیگار بپرسد. این اطلاعات کمک می‌کند داروها و درمان
              مناسب شما انتخاب شود.
          - title: معاینهٔ دهان
            text: >-
              دندانپزشک دندان‌ها، لثه و داخل دهان را نگاه می‌کند و لب‌ها، فک و گردن را هم
              بررسی می‌کند تا نشانه‌های پوسیدگی، بیماری لثه یا سرطان دهان را پیدا کند. ممکن است از یک آینهٔ کوچک،
              یک ابزار فلزی باریک و دستگاهی که به‌آرامی هوا می‌دمد کمک بگیرد.
          - title: عکس رادیولوژی، اگر لازم باشد
            text: >-
              دندانپزشک پس از بررسی سابقه و معاینهٔ دهان تصمیم می‌گیرد عکس لازم است یا نه.
              عکس می‌تواند پوسیدگی یا مشکلی را نشان دهد که در معاینه دیده نمی‌شود. اگر
              عکس لازم باشد، دندانپزشک می‌گوید چه عکسی و کجا گرفته شود.
          - title: توضیح یافته‌ها
            text: >-
              دندانپزشک می‌گوید چه دیده است و اگر درمانی لازم باشد، گزینه‌ها را توضیح
              می‌دهد. ممکن است برای کامل شدن برنامهٔ درمان، عکس یا جلسهٔ دیگری لازم باشد.
              ممکن است نکته‌هایی هم برای مراقبت از دهان بگوید. درمان مناسب با معاینه و
              تشخیص دندانپزشک مشخص می‌شود و تصمیم نهایی برای شروع آن با خودتان است.
      - type: callout
        tone: info
        text: >-
          اگر از دندانپزشکی می‌ترسید یا نگران هستید، پیش از شروع معاینه به دندانپزشک
          بگویید. اگر در طول معاینه به مکث یا استراحت نیاز داشتید، آن را هم بگویید.
      - type: content
        text: |-
          ## پیش از شروع درمان چه بپرسید؟
          اگر درمانی لازم باشد، پیش از شروع آن این‌ها را بپرسید:
          - کدام درمان لازم است و چرا؟
          - در طول درمان چه پیش می‌آید؟
          - خطرها و فایده‌های درمان چیست؟
          - هزینهٔ درمان چقدر است و بیمه چه سهمی دارد؟

          هزینهٔ هر درمان پس از معاینه مشخص می‌شود. دربارهٔ هزینه، بیمه و روش‌های پرداخت، صفحهٔ [هزینه‌ها، بیمه و شرایط پرداخت](/هزینه-و-پرداخت) را بخوانید. زمان جلسه‌های درمان را پذیرش با شما هماهنگ می‌کند.
      - type: callout
        tone: warning
        text: >-
          اگر داروی ضدانعقاد (رقیق‌کنندهٔ خون) مثل وارفارین یا آپیکسابان مصرف می‌کنید،
          در اولین مراجعه و پیش از هر درمان آن را به دندانپزشک بگویید و اگر کارت هشدار
          دارو دارید، نشانش دهید.
          مصرف دارو را بدون نظر پزشک خودتان قطع نکنید.
      - type: faq
        items:
          - question: آیا در اولین جلسه عکس رادیولوژی لازم است؟
            answer: >-
              نه همیشه. دندانپزشک پس از بررسی سابقه و معاینه تصمیم می‌گیرد. برای بیمار
              تازه، عکس می‌تواند وضعیت فعلی دهان را نشان دهد و مبنای مقایسه در آینده
              باشد. اگر عکس‌های قبلی دارید، همراه بیاورید.
          - question: عکس رادیولوژی دندان خطر دارد؟
            answer: >-
              دوز تابش عکس‌های دندانپزشکی بسیار کم است و احتمال آسیب آن هم بسیار کم است.
              با این حال، توصیه این است که عکس فقط وقتی گرفته شود که برای تشخیص لازم
              باشد. اگر سؤالی دارید، از دندانپزشک بپرسید.
          - question: در دوران بارداری می‌توانم به دندانپزشکی بروم؟
            answer: >-
              بله. انجمن دندانپزشکی آمریکا مراجعه به دندانپزشک را در دوران بارداری توصیه
              می‌کند. بارداری، ماه آن و داروهایتان را هر چه زودتر به دندانپزشک بگویید،
              حتی اگر هنوز مطمئن نیستید. بی‌حسی موضعی و عکس دندان در بارداری ایمن دانسته
              می‌شوند و بهتر است درمان‌های لازم مثل پر کردن دندان پیش از زایمان انجام شود.
              اگر بارداری پرخطر است، ممکن است دندانپزشک یا پزشکتان بعضی درمان‌ها را به بعد
              موکول کند.
          - question: هر چند وقت یک بار باید معاینه شوم؟
            answer: >-
              به سلامت دهان شما بستگی دارد. فاصلهٔ معاینه‌ها معمولاً بین ۳ ماه تا ۲ سال
              است و برای افراد زیر ۱۸ سال حداکثر یک سال. دندانپزشک بر اساس وضعیت دندان‌ها
              و لثه، زمان معاینهٔ بعدی را پیشنهاد می‌کند.
          - question: هزینهٔ اولین مراجعه چقدر است؟
            answer: >-
              هزینهٔ درمان به نوع درمان و وضعیت دندان‌ها بستگی دارد و پس از معاینه مشخص
              می‌شود. شرایط و هزینهٔ اولین مراجعه را هنگام گرفتن نوبت از پذیرش بپرسید.
    sources:
