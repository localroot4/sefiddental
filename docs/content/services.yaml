  - key: bleaching
    category: cosmetic
    nav_label: بلیچینگ دندان
    h1: بلیچینگ دندان
    seo_title: بلیچینگ و سفید کردن دندان
    slug: بلیچینگ-دندان
    booking_group: cosmetic
    priority: 2
    search_terms: [بلیچینگ دندان, سفید کردن دندان, قیمت بلیچینگ, عوارض بلیچینگ]
    summary: روشن کردن رنگ طبیعی دندان‌ها با ژل سفیدکننده، زیر نظر دندانپزشک.
    seo_description: >-
      بلیچینگ و سفید کردن دندان زیر نظر دندانپزشک در کلینیک دندانپزشکی سفید:
      برای چه کسی مناسب است، مراحل، مراقبت و عوارض بلیچینگ. خانی‌آباد نو،
      جنوب تهران.
    sessions: در مطب معمولاً یک جلسه
    anesthesia: معمولاً لازم نیست
    recovery: حساسیت احتمالی معمولاً چند روز پس از درمان کم می‌شود
    related: [scaling, composite-veneer, ceramic-laminate]
    body:
      - type: content
        text: |-
          ## بلیچینگ دندان چیست؟
          بلیچینگ رنگ طبیعی دندان‌ها را روشن‌تر می‌کند. در این روش ژلی حاوی پراکسید هیدروژن یا کاربامید پراکسید روی دندان‌ها قرار می‌گیرد. این ماده لک‌ها را به ذره‌های کوچک‌تر می‌شکند و رنگ دندان روشن‌تر دیده می‌شود.

          اگر تیرگی دندان‌ها فقط از لک‌های سطحی باشد، [جرم‌گیری و بروساژ](/خدمات/جرم-گیری) یا خمیردندان سفیدکننده ممکن است کافی باشد. بلیچینگ رنگ خود دندان را تغییر می‌دهد.

          ## برای چه کسی مناسب است؟
          بلیچینگ برای دندان‌های طبیعی و سالمی است که با بالا رفتن سن یا با چای، قهوه و سیگار تیره‌تر شده‌اند. دندان‌های زرد معمولاً بهتر به بلیچینگ جواب می‌دهند. دندان‌های قهوه‌ای ممکن است کمتر روشن شوند و دندان‌هایی با رنگ خاکستری ممکن است اصلاً روشن نشوند.

          ## چه وقت بلیچینگ کافی نیست؟
          - روکش، لمینت، ترمیم همرنگ و ایمپلنت با بلیچینگ رنگ عوض نمی‌کنند. اگر این‌ها در دندان‌های جلو باشند، ممکن است بعد از بلیچینگ رنگشان با دندان‌های طبیعی فرق کند.
          - تغییر رنگی که از دارو یا ضربه به دندان باشد، ممکن است با بلیچینگ از بین نرود.
          - اگر فقط یک دندان، به‌ویژه پس از ضربه، تیره شده است، اول باید معاینه شود. این تیرگی ممکن است از آسیب عصب دندان باشد و پیش از هر درمان زیبایی بررسی لازم دارد.
          - اگر پوسیدگی یا بیماری لثه دارید، اول باید درمان شود.
          - بلیچینگ زیبایی معمولاً برای افراد زیر ۱۸ سال انجام نمی‌شود و برای کودکی که هنوز دندان شیری دارد توصیه نمی‌شود. اگر نوجوان شما تغییر رنگ دندان دارد، دندانپزشک پس از معاینه تصمیم می‌گیرد. بلیچینگ در دوران بارداری و شیردهی هم توصیه نمی‌شود.

          اگر رنگ دندان با بلیچینگ روشن نشود، دندانپزشک ممکن است راه دیگری مثل ونیر کامپوزیت یا لمینت را پیشنهاد کند.
      - type: callout
        tone: info
        text: بلیچینگ را فقط زیر نظر دندانپزشک انجام دهید. مواد بلیچینگ قوی‌اند و کیت‌هایی که از جای دیگر یا اینترنت خریده می‌شوند، ممکن است به دندان و لثه آسیب بزنند.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک سلامت دندان‌ها و لثه را بررسی می‌کند و دربارهٔ علت تغییر رنگ، آلرژی و سابقهٔ حساسیت دندان می‌پرسد.
          - title: محافظت از لثه
            text: در مطب، ژل یا پوشش محافظ روی لثه قرار می‌گیرد. در روش خانگی، دندانپزشک قالب اختصاصی می‌دهد و نشان می‌دهد چطور از لثه محافظت کنید.
          - title: ژل سفیدکننده
            text: در مطب، دندانپزشک ژل را روی دندان‌ها می‌گذارد و پس از زمان لازم برمی‌دارد. در روش خانگی، دندانپزشک می‌گوید ژل را چطور و چه مدت در قالب استفاده کنید.
          - title: در طول درمان
            text: اگر سوزش یا ناراحتی در لثه حس کردید، به دندانپزشک بگویید تا محافظ لثه یا قالب را بررسی کند.
      - type: content
        text: |-
          ## بعد از بلیچینگ
          تا مدتی کوتاه ممکن است این عوارض را داشته باشید:

          - حساسیت دندان به سرما یا خوراکی و نوشیدنی شیرین
          - درد لثه یا گلو
          - لکه‌های سفید روی لثه

          این عوارض معمولاً خفیف و گذرا هستند. اگر آزارتان می‌دهند، به دندانپزشک بگویید. ممکن است لازم باشد درمان را عقب بیندازید و بعد دوباره امتحان کنید.

          بلیچینگ همیشگی نیست. اگر توصیه‌های دندانپزشک را رعایت کنید، اثر آن ممکن است حدود سه سال بماند. چای، قهوه و دخانیات دندان‌ها را دوباره تیره می‌کنند. مسواک زدن و نخ دندان هر روز به روشن ماندن دندان‌ها کمک می‌کند.

          ## خطرها و عوارض
          - حساسیت گذرای دندان و تحریک لثه شایع‌ترین عوارض بلیچینگ‌اند و با غلظت بالاتر مادهٔ سفیدکننده بیشتر دیده می‌شوند.
          - استفادهٔ بیش از حد از مواد سفیدکننده می‌تواند به مینای دندان و لثه آسیب بزند.
          - رنگ ترمیم‌ها و روکش‌ها عوض نمی‌شود و ممکن است با دندان‌های روشن‌شده ناهماهنگ شود.
          - بلیچینگ ممکن است چسبیدن کامپوزیت یا لمینت به مینای دندان را ضعیف‌تر کند. اگر بعد از بلیچینگ کامپوزیت یا لمینت لازم است، زمان آن را دندانپزشک تعیین می‌کند.
    faqs:
      - question: عوارض بلیچینگ دندان چیست؟
        answer: >-
          شایع‌ترین عوارض، حساسیت دندان به سرما یا شیرینی و تحریک لثه است.
          این عوارض معمولاً خفیف و گذرا هستند و چند روز پس از درمان کم می‌شوند.
          استفادهٔ بیش از حد از مواد سفیدکننده می‌تواند به مینا و لثه آسیب بزند؛
          برای همین بلیچینگ باید زیر نظر دندانپزشک باشد.
      - question: بلیچینگ چند جلسه است؟
        answer: >-
          بلیچینگ در مطب معمولاً یک جلسه است. در روش خانگی زیر نظر دندانپزشک،
          ژل با قالب اختصاصی در خانه روی دندان‌ها قرار می‌گیرد و درمان چند روز
          تا چند هفته طول می‌کشد. روش و تعداد جلسه‌های شما پس از معاینه مشخص
          می‌شود.
      - question: نتیجهٔ بلیچینگ چقدر می‌ماند؟
        answer: >-
          بلیچینگ همیشگی نیست. اگر توصیه‌های دندانپزشک را رعایت کنید، اثر آن
          ممکن است حدود سه سال بماند. چای، قهوه و دخانیات دندان‌ها را دوباره
          تیره می‌کنند.
      - question: آیا بلیچینگ رنگ روکش، لمینت یا ترمیم را عوض می‌کند؟
        answer: >-
          نه. بلیچینگ فقط رنگ دندان طبیعی را روشن می‌کند. رنگ روکش، لمینت،
          ترمیم همرنگ و ایمپلنت عوض نمی‌شود و ممکن است بعد از بلیچینگ با
          دندان‌های کناری فرق کند. دندانپزشک پیش از درمان این را با شما بررسی
          می‌کند.
      - question: آیا بلیچینگ همهٔ لک‌ها را از بین می‌برد؟
        answer: >-
          نه. دندان‌های زرد معمولاً بهتر جواب می‌دهند، دندان‌های قهوه‌ای کمتر و
          دندان‌هایی با رنگ خاکستری ممکن است روشن نشوند. تغییر رنگی که از دارو
          یا ضربه به دندان باشد، ممکن است با بلیچینگ از بین نرود.
      - question: چه کسانی نباید بلیچینگ کنند؟
        answer: >-
          بلیچینگ زیبایی معمولاً برای افراد زیر ۱۸ سال انجام نمی‌شود و برای
          کودکی که هنوز دندان شیری دارد توصیه نمی‌شود. اگر نوجوان شما تغییر رنگ
          دندان دارد، دندانپزشک پس از معاینه تصمیم می‌گیرد. بلیچینگ در دوران
          بارداری و شیردهی هم توصیه نمی‌شود. اگر پوسیدگی یا بیماری لثه دارید،
          اول باید درمان شود. انتخاب
          درمان با معاینه و تشخیص دندانپزشک است.
      - question: آیا با خمیردندان یا کیت سفیدکننده می‌توانم دندان‌هایم را سفید کنم؟
        answer: >-
          بیشتر خمیردندان‌های سفیدکننده فقط لک‌های سطح دندان را کم می‌کنند و رنگ
          خود دندان را چندان تغییر نمی‌دهند. کیت‌هایی که از جایی جز دندانپزشک
          خریده می‌شوند، به اندازهٔ روش دندانپزشکی اثر نمی‌کنند و ممکن است به
          دندان و لثه آسیب بزنند. پیش از هر روشی با دندانپزشک مشورت کنید.
      - question: قیمت بلیچینگ دندان چقدر است؟
        answer: >-
          هزینه به روش درمان و وضعیت دندان‌های شما بستگی دارد و پس از معاینه
          مشخص می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
