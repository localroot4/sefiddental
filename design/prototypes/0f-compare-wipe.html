<!doctype html>
<!--
  Prototype 0f: the before/after compare wipe.
  Question: does a WebGL displacement wipe feel more premium than a plain
  clip-path slider, and does the DOM clip-path fallback stay fully usable with
  pointer and keyboard when WebGL is off (tier 0, reduced motion, no WebGL)?
  Both images are procedural placeholders drawn on canvas: a muted "before"
  and a brighter "after" with a drawn smile curve. The handle is a 48 px
  slider (role="slider") driven by pointer drag and arrow keys; the WebGL
  path warps a band around the edge with a noise displacement whose strength
  follows the handle velocity, so the wipe is calm at rest. Tiers follow
  docs/experience-direction.md section 3: DPR cap 2.0 / 1.5 / 1.0, in-shader
  grain at tiers 2 and 3, tier 0 is the DOM fallback. No external requests.
-->
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمونه ۰f: مقایسه قبل و بعد</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  @font-face {
    font-family: "Vazirmatn";
    src: url("../fonts/Vazirmatn%5Bwght%5D.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font-body); color: var(--color-ink); background: var(--color-surface);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .caption {
    position: fixed; inset-block-start: var(--space-4); inset-inline: var(--space-4); margin: 0;
    font-size: var(--text-caption); line-height: var(--leading-small); color: var(--color-ink-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  main { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--space-16) var(--space-4) calc(var(--space-4) + 9rem); }
  .compare {
    position: relative; width: min(100%, 960px); aspect-ratio: 16 / 10; max-height: 100%;
    border-radius: var(--radius-media); overflow: hidden; box-shadow: var(--shadow-floating);
    background: var(--color-surface-sunken); touch-action: pan-y; user-select: none; -webkit-user-select: none;
    direction: ltr; /* the stage is a picture: physical left/right positioning */
  }
  .compare canvas, .compare .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .compare .layer canvas { position: static; }
  .layer.before { clip-path: inset(0 0 0 var(--p, 50%)); }
  .dom { display: none; }
  .compare.is-dom .dom { display: block; }
  .compare.is-dom canvas.gl { display: none; }
  .tag {
    position: absolute; inset-block-start: var(--space-4); padding: 6px 14px; border-radius: var(--radius-pill);
    font-size: var(--text-small); font-weight: 600; direction: rtl;
    background: color-mix(in srgb, var(--color-surface-raised) 80%, transparent); color: var(--color-ink);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: var(--shadow-raised); pointer-events: none;
  }
  .tag.before { right: var(--space-4); }
  .tag.after { left: var(--space-4); }
  .handle {
    position: absolute; inset-block: 0; left: var(--p, 50%); width: 0; transform: translateX(0); cursor: ew-resize; outline: none;
  }
  .handle::before {
    content: ""; position: absolute; inset-block: 0; left: -1px; width: 2px;
    background: color-mix(in srgb, #FFFFFF 85%, transparent); box-shadow: 0 0 0 1px rgb(10 36 63 / 0.12);
  }
  .grip {
    position: absolute; top: 50%; left: 50%; width: 48px; height: 48px; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--color-surface-raised); color: var(--color-brand);
    box-shadow: var(--shadow-floating); display: grid; place-items: center;
    transition: transform var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
  }
  .handle:focus-visible .grip { box-shadow: var(--shadow-floating), var(--focus-ring); }
  .handle:active .grip, .compare.is-dragging .grip { transform: translate(-50%, -50%) scale(0.96); }
  .grip svg { width: 22px; height: 22px; }
  .hint { position: fixed; inset-inline: 0; inset-block-end: calc(var(--space-4) + 8.25rem); text-align: center; margin: 0; font-size: var(--text-caption); color: var(--color-ink-muted); pointer-events: none; }
  .panel {
    position: fixed; inset-block-end: var(--space-4); inset-inline-start: var(--space-4);
    display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4);
    background: color-mix(in srgb, var(--color-surface-raised) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--color-line); border-radius: var(--radius-card); box-shadow: var(--shadow-raised);
    font-size: var(--text-small); line-height: var(--leading-small); max-width: calc(100vw - 2 * var(--space-4));
  }
  .panel .row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .panel .label { color: var(--color-ink-muted); min-width: 3.5rem; }
  .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .fps { font-weight: 600; min-width: 9.5rem; display: inline-block; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--color-line); border-radius: var(--radius-input); background: var(--color-surface-sunken); }
  .seg button, .btn {
    min-width: var(--target); min-height: var(--target); padding: 0 var(--space-3); border: 0; border-radius: 10px;
    background: transparent; color: var(--color-ink); font: inherit; cursor: pointer;
    transition: background var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
  }
  .seg button[aria-pressed="true"] { background: var(--color-brand); color: #F7F8F7; }
  .seg button:hover:not([aria-pressed="true"]) { background: var(--color-brand-soft); }
  .btn { border: 1px solid var(--color-line); background: var(--color-surface-raised); }
  .btn:hover { background: var(--color-brand-soft); }
  .seg button:focus-visible, .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .note { color: var(--color-ink-muted); font-size: var(--text-caption); }
  @media (max-width: 743px) {
    main { padding: var(--space-12) var(--space-4) calc(var(--space-4) + 10rem); }
    .compare { aspect-ratio: 4 / 5; }
    .panel { inset-inline: var(--space-4); padding: var(--space-3); }
    .panel .label { min-width: 2.75rem; }
    .caption { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .hint { inset-block-end: calc(var(--space-4) + 9.25rem); }
  }
  @media (prefers-reduced-motion: reduce) { .grip, .seg button, .btn { transition: none; } }
</style>
</head>
<body>
<p class="caption">پرسش: آیا وایپ جابه‌جایی WebGL از اسلایدر clip-path لوکس‌تر است و جایگزین DOM با اشاره‌گر و کیبورد کامل کار می‌کند؟</p>
<main>
  <div class="compare" id="compare" style="--p: 50%">
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="layer dom after" aria-hidden="true"><canvas id="domAfter"></canvas></div>
    <div class="layer dom before" aria-hidden="true"><canvas id="domBefore"></canvas></div>
    <span class="tag before">قبل</span>
    <span class="tag after">بعد</span>
    <div class="handle" id="handle" role="slider" tabindex="0" aria-label="مقایسه قبل و بعد" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="۵۰ درصد" aria-orientation="horizontal">
      <span class="grip" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 3 12l6 6M15 6l6 6-6 6"/></svg>
      </span>
    </div>
  </div>
</main>
<p class="hint">کشیدن دستگیره یا کلیدهای جهت‌نما؛ Home و End برای دو سر</p>

<div class="panel" role="group" aria-label="تنظیمات نمونه">
  <div class="row"><span class="label">فریم</span><span class="fps ltr" id="fps">…</span></div>
  <div class="row">
    <span class="label">کیفیت</span>
    <div class="seg" role="group" aria-label="تیر کیفیت" id="tiers">
      <button type="button" data-tier="0" aria-pressed="false">۰</button>
      <button type="button" data-tier="1" aria-pressed="false">۱</button>
      <button type="button" data-tier="2" aria-pressed="false">۲</button>
      <button type="button" data-tier="3" aria-pressed="true">۳</button>
    </div>
    <button type="button" class="btn" id="theme">تم تاریک</button>
  </div>
  <div class="row note" id="status">در حال آماده‌سازی…</div>
</div>

<script type="module">
import * as THREE from '../vendor/three.js';

const TIERS = {
  0: { webgl: false },
  1: { dpr: 1.0, grain: 0 },
  2: { dpr: 1.5, grain: 0.025 },
  3: { dpr: 2.0, grain: 0.03 },
};
const params = new URLSearchParams(location.search);
const root = document.documentElement;
const compare = document.getElementById('compare');
const glCanvas = document.getElementById('gl');
const handle = document.getElementById('handle');
const fpsEl = document.getElementById('fps');
const statusEl = document.getElementById('status');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);

const state = { tier: 3, theme: 'light', webgl: true, mode: '—', p: 0.5, v: 0, stats: { fps: 0, ms: 0 }, world: null, running: false, raf: 0 };

// ---------- procedural placeholder pictures (1024 x 640)
const W = 1024, H = 640;
function drawPicture(kind) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const after = kind === 'after';
  const bg = g.createLinearGradient(0, 0, W * 0.3, H);
  if (after) { bg.addColorStop(0, '#FBF3E8'); bg.addColorStop(0.55, '#F2E6D8'); bg.addColorStop(1, '#E9D7C3'); }
  else { bg.addColorStop(0, '#CFCBC4'); bg.addColorStop(0.55, '#BDB8B0'); bg.addColorStop(1, '#A9A49C'); }
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // soft light pool behind the smile
  const pool = g.createRadialGradient(W * 0.5, H * 0.52, 40, W * 0.5, H * 0.52, W * 0.42);
  pool.addColorStop(0, after ? 'rgba(255,250,242,0.75)' : 'rgba(225,222,216,0.5)'); pool.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = pool; g.fillRect(0, 0, W, H);
  // lips
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = after ? '#C9736B' : '#9B7A76'; g.lineWidth = after ? 30 : 26;
  g.beginPath(); g.moveTo(W * 0.22, H * 0.46); g.quadraticCurveTo(W * 0.5, H * (after ? 0.82 : 0.72), W * 0.78, H * 0.46); g.stroke();
  g.strokeStyle = after ? '#D98A80' : '#A98B86'; g.lineWidth = after ? 22 : 20;
  g.beginPath(); g.moveTo(W * 0.24, H * 0.45); g.quadraticCurveTo(W * 0.5, H * 0.36, W * 0.76, H * 0.45); g.stroke();
  // teeth row inside the smile
  const n = 10, x0 = W * 0.27, x1 = W * 0.73;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const x = x0 + (x1 - x0) * t;
    const w = (x1 - x0) / n - 6;
    const sag = 1 - Math.pow((t - 0.5) * 2, 2);
    const h = (after ? 86 : 70) * (0.75 + 0.25 * sag) - (after ? 0 : (i % 3) * 7);
    const y = H * 0.47;
    g.fillStyle = after ? '#FAF7F0' : (i % 4 === 1 ? '#D9D2C2' : '#E6E0D2');
    g.beginPath(); g.roundRect(x - w / 2, y, w, h, [4, 4, 14, 14]); g.fill();
    if (!after && i % 3 === 0) { g.fillStyle = 'rgba(120,100,70,0.18)'; g.fillRect(x - w / 2 + 3, y + h - 14, w - 6, 8); }
  }
  // headline tone text block (abstract bars, no real copy)
  g.fillStyle = after ? 'rgba(10,36,63,0.08)' : 'rgba(10,36,63,0.06)';
  for (let i = 0; i < 3; i++) g.fillRect(W * 0.07, H * 0.08 + i * 18, W * (0.26 - i * 0.06), 8);
  return c;
}
const beforePic = drawPicture('before');
const afterPic = drawPicture('after');
// DOM fallback layers reuse the same drawings
for (const [id, src] of [['domBefore', beforePic], ['domAfter', afterPic]]) {
  const c = document.getElementById(id); c.width = W; c.height = H; c.getContext('2d').drawImage(src, 0, 0);
}
function noiseTexture() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); const img = g.createImageData(S, S);
  // smooth value noise, tileable by construction (periodic sums)
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = (x / S) * Math.PI * 2, v = (y / S) * Math.PI * 2;
    let n = 0.5 + 0.22 * Math.sin(u * 3 + Math.cos(v * 2)) + 0.16 * Math.sin(v * 5 + Math.sin(u * 4)) + 0.12 * Math.sin((u + v) * 7);
    n = Math.max(0, Math.min(1, n));
    const i = (y * S + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = n * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace; return t;
}

const WipeShader = {
  uniforms: {
    tBefore: { value: null }, tAfter: { value: null }, tDisp: { value: null },
    uEdge: { value: 0.5 }, uStrength: { value: 0 }, uBand: { value: 0.18 }, uSoft: { value: 0.004 },
    uGrain: { value: 0 }, uTime: { value: 0 }, uAspect: { value: 1.6 }, uCover: { value: new THREE.Vector4(1, 1, 0, 0) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tBefore, tAfter, tDisp; uniform float uEdge, uStrength, uBand, uSoft, uGrain, uTime, uAspect; uniform vec4 uCover;
    varying vec2 vUv;
    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    void main(){
      vec2 uv = vUv * uCover.xy + uCover.zw; // cover-fit the 16:10 picture into the stage
      float d = texture2D(tDisp, uv * vec2(1.0, 1.0 / uAspect) * 1.5 + vec2(0.0, uTime * 0.01)).r - 0.5;
      float band = 1.0 - smoothstep(0.0, uBand, abs(vUv.x - uEdge));
      float warp = d * uStrength * band;
      vec2 uvB = uv + vec2(warp, warp * 0.35);
      vec2 uvA = uv - vec2(warp, warp * 0.35);
      float mask = smoothstep(uEdge - uSoft, uEdge + uSoft, vUv.x + warp * 0.6);
      vec3 before = texture2D(tBefore, uvB).rgb;
      vec3 after = texture2D(tAfter, uvA).rgb;
      vec3 c = mix(after, before, mask);
      // a thin bright seam that fades when the handle rests
      float seam = (1.0 - smoothstep(0.0, 0.0035, abs(vUv.x + warp * 0.6 - uEdge))) * clamp(uStrength * 12.0, 0.0, 1.0);
      c += seam * 0.25;
      if (uGrain > 0.0) { c += (hash(gl_FragCoord.xy + fract(uTime * 0.37) * 731.0) - 0.5) * uGrain; }
      gl_FragColor = vec4(c, 1.0);
    }`,
};

// ---------- WebGL world
function createWorld(tier) {
  const T = TIERS[tier];
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, T.dpr));
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const tb = new THREE.CanvasTexture(beforePic), ta = new THREE.CanvasTexture(afterPic);
  // The shader passes the picture through untouched, so the textures stay raw (no sRGB decode) and no output conversion runs.
  for (const t of [tb, ta]) { t.colorSpace = THREE.NoColorSpace; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; }
  const td = noiseTexture();
  const mat = new THREE.ShaderMaterial({ uniforms: THREE.UniformsUtils.clone(WipeShader.uniforms), vertexShader: WipeShader.vertexShader, fragmentShader: WipeShader.fragmentShader, depthTest: false, depthWrite: false });
  mat.uniforms.tBefore.value = tb; mat.uniforms.tAfter.value = ta; mat.uniforms.tDisp.value = td; mat.uniforms.uGrain.value = T.grain;
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  quad.frustumCulled = false;
  scene.add(quad);

  function resize() {
    const r = compare.getBoundingClientRect();
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, T.dpr));
    renderer.setSize(r.width, r.height, false);
    const stage = r.width / r.height, pic = W / H;
    const u = mat.uniforms;
    if (stage > pic) { const s = pic / stage; u.uCover.value.set(1, s, 0, (1 - s) / 2); }
    else { const s = stage / pic; u.uCover.value.set(s, 1, (1 - s) / 2, 0); }
    u.uAspect.value = stage;
    u.uBand.value = Math.min(0.22, 90 / r.width);
    u.uSoft.value = 1.2 / r.width;
  }
  let t = 0, strength = 0;
  function render(dt) {
    t += dt;
    const target = Math.min(0.06, Math.abs(state.v) * 0.09) + 0.006;
    strength += (target - strength) * (target > strength ? 0.35 : 0.08);
    state.v *= Math.pow(0.001, dt); // velocity decays within about a second
    const u = mat.uniforms;
    u.uEdge.value = state.p; u.uStrength.value = strength; u.uTime.value = t;
    renderer.render(scene, camera);
  }
  function dispose() { tb.dispose(); ta.dispose(); td.dispose(); mat.dispose(); quad.geometry.dispose(); renderer.dispose(); }
  return { resize, render, dispose };
}

// ---------- loop
let last = 0, acc = 0, frames = 0;
function loop(now) {
  if (!state.running) return;
  state.raf = requestAnimationFrame(loop);
  const raw = last ? (now - last) / 1000 : 0.016;
  last = now;
  state.world.render(Math.min(0.1, raw));
  frames++; acc += raw;
  if (acc >= 0.5) {
    state.stats.fps = Math.round(frames / acc); state.stats.ms = Math.round((acc / frames) * 1000 * 10) / 10;
    fpsEl.textContent = `${state.stats.fps} fps · ${state.stats.ms} ms`;
    acc = 0; frames = 0;
  }
}
function start() { if (state.running) return; state.running = true; last = 0; state.raf = requestAnimationFrame(loop); }
function stop() { state.running = false; cancelAnimationFrame(state.raf); }

// ---------- handle: pointer and keyboard
function setP(p, velocity = 0) {
  p = Math.max(0, Math.min(1, p));
  state.v = velocity;
  state.p = p;
  compare.style.setProperty('--p', (p * 100).toFixed(2) + '%');
  const pct = Math.round(p * 100);
  handle.setAttribute('aria-valuenow', String(pct));
  handle.setAttribute('aria-valuetext', `${fa(pct)} درصد`);
}
let dragging = false, lastX = 0, lastT = 0;
function pointerP(e) { const r = compare.getBoundingClientRect(); return (e.clientX - r.left) / r.width; }
compare.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true; compare.classList.add('is-dragging'); compare.setPointerCapture(e.pointerId);
  lastX = e.clientX; lastT = e.timeStamp; setP(pointerP(e), 0); handle.focus({ preventScroll: true });
});
compare.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dt = Math.max(1, e.timeStamp - lastT) / 1000;
  const r = compare.getBoundingClientRect();
  const v = ((e.clientX - lastX) / r.width) / dt; // stage widths per second
  lastX = e.clientX; lastT = e.timeStamp;
  setP(pointerP(e), v);
});
const endDrag = (e) => { if (!dragging) return; dragging = false; compare.classList.remove('is-dragging'); try { compare.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ } };
compare.addEventListener('pointerup', endDrag); compare.addEventListener('pointercancel', endDrag);
handle.addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.1 : 0.02;
  let p = state.p;
  switch (e.key) {
    case 'ArrowLeft': p -= step; break;     // physical left, independent of RTL
    case 'ArrowRight': p += step; break;
    case 'ArrowUp': p += step; break;
    case 'ArrowDown': p -= step; break;
    case 'PageUp': p += 0.1; break;
    case 'PageDown': p -= 0.1; break;
    case 'Home': p = 0; break;
    case 'End': p = 1; break;
    default: return;
  }
  e.preventDefault();
  setP(p, Math.sign(p - state.p) * 1.2);
});

// ---------- tier and theme
function effectiveTier(n) { return reduced.matches ? 0 : n; }
function setTier(n) {
  n = Math.max(0, Math.min(3, Number(n)));
  state.tier = n;
  document.querySelectorAll('#tiers button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.tier) === n)));
  rebuild();
}
function rebuild() {
  stop();
  if (state.world) { state.world.dispose(); state.world = null; }
  const tier = effectiveTier(state.tier);
  const useWebgl = tier > 0 && state.webgl;
  compare.classList.toggle('is-dom', !useWebgl);
  if (useWebgl) {
    try {
      state.world = createWorld(tier); state.world.resize(); start(); state.mode = 'WebGL';
    } catch (err) {
      console.error('WebGL wipe failed, using the DOM fallback:', err);
      state.webgl = false; compare.classList.add('is-dom'); state.mode = 'DOM';
    }
  } else state.mode = 'DOM';
  status();
}
function status() {
  const tier = effectiveTier(state.tier);
  const parts = [];
  if (reduced.matches) parts.push('کاهش حرکت فعال است: تیر ۰');
  if (!state.webgl) parts.push('WebGL در دسترس نیست');
  if (state.mode === 'DOM') { parts.push('حالت: clip-path در DOM'); fpsEl.textContent = '—'; }
  else { const T = TIERS[tier]; parts.push(`تیر ${fa(tier)}: WebGL · DPR ${fa(Math.min(devicePixelRatio || 1, T.dpr).toFixed(1))} · گرین ${T.grain ? 'روشن' : 'خاموش'}`); }
  statusEl.textContent = parts.join(' | ');
}
function setTheme(theme) {
  state.theme = theme === 'dark' ? 'dark' : 'light';
  root.setAttribute('data-theme', state.theme);
  document.getElementById('theme').textContent = state.theme === 'dark' ? 'تم روشن' : 'تم تاریک';
}
document.getElementById('tiers').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTier(b.dataset.tier); });
document.getElementById('theme').addEventListener('click', () => setTheme(state.theme === 'dark' ? 'light' : 'dark'));
window.addEventListener('resize', () => state.world && state.world.resize());
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (state.world) start(); });
reduced.addEventListener('change', rebuild);
glCanvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); stop(); compare.classList.add('is-dom'); statusEl.textContent = 'زمینه WebGL از دست رفت؛ جایگزین DOM فعال شد'; });
glCanvas.addEventListener('webglcontextrestored', () => rebuild());

const ready = (async () => {
  const probe = document.createElement('canvas').getContext('webgl2');
  state.webgl = !!probe;
  if (probe) { const ext = probe.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); }
  setTheme(params.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  if (params.get('panel') === '0') document.querySelector('.panel').style.display = 'none';
  setP(params.has('p') ? Number(params.get('p')) : 0.5);
  setTier(params.get('tier') ?? 3);
  if (state.world) state.world.render(0.016);
})();

window.__proto = {
  ready, setTier, setTheme, setP: (p, v) => setP(p, v),
  getStats: () => ({ ...state.stats, tier: state.tier, effectiveTier: effectiveTier(state.tier), theme: state.theme, mode: state.mode, webgl: state.webgl, running: state.running, p: state.p }),
};
</script>
</body>
