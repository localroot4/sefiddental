              مسواک دو بار در روز و تمیز کردن بین دندان‌ها؛ واترجت ممکن است به تمیز کردن اطراف بریج کمک کند,
            ]
      - type: content
        text: |-
          ## عددهای ماندگاری را چطور بخوانید؟
          در یک مرور سیستماتیک که در سال ۲۰۰۷ منتشر شد، پس از ۱۰ سال حدود ۸۹ درصد بریج‌های معمولی و حدود ۸۹ درصد روکش‌های تکی روی ایمپلنت هنوز در دهان بودند. یعنی در این پژوهش‌ها ماندگاری دو روش نزدیک به هم بود. در همان مرور، مشکلات فنی در درمان‌های روی ایمپلنت بیشتر بود. شایع‌ترین مشکل بریج‌ها پوسیدگی و از بین رفتن عصب دندان‌های تکیه‌گاه بود.

          مرور سیستماتیک دیگری در همان سال هیچ پژوهشی پیدا نکرد که این دو روش را مستقیم با هم مقایسه کرده باشد. پس این عددها راهنمای کلی هستند و پیش‌بینی برای دهان شما نیستند.

          ## خطرهای هر روش
          ایمپلنت با جراحی کار گذاشته می‌شود. اگر محل ایمپلنت عفونی شود، درمان سخت است و اغلب باید ایمپلنت برداشته شود. گاهی هم ایمپلنت محکم نمی‌شود و از دست می‌رود. پلاک ممکن است لثه و استخوان دور ایمپلنت را ملتهب کند (پری‌ایمپلنتیت). اگر این التهاب کنترل نشود، ممکن است به از دست رفتن ایمپلنت برسد.

          در بریج، شایع‌ترین مشکل پوسیدگی دندان‌های تکیه‌گاه و از بین رفتن عصب آن‌ها است. برای همین سالم نگه داشتن این دندان‌ها اهمیت دارد.

          ## کدام برای شما مناسب‌تر است؟
          پاسخ برای همه یکی نیست. دندانپزشک پس از معاینه، این‌ها را در نظر می‌گیرد:
          - سلامت عمومی شما؛ برای ایمپلنت، سلامت عمومی از سن مهم‌تر است.
          - بیماری‌های مزمن و مصرف دخانیات که ممکن است بهبودی بعد از جراحی را کند کنند.
          - مقدار استخوان فک در جای دندان. ایمپلنت به استخوان کافی نیاز دارد. اگر استخوان کافی نباشد، ممکن است برای کاشت ایمپلنت به جراحی افزایش حجم استخوان نیاز باشد. این جراحی هم ممکن است عارضه داشته باشد.
          - سلامت دندان‌های کناری که در بریج تکیه‌گاه دندان جدید می‌شوند.
          - خواست شما؛ اگر نمی‌خواهید از ساختار دندان‌های سالم کناری برداشته شود، دربارهٔ ایمپلنت با دندانپزشک صحبت کنید.

          اگر فکر جراحی نگرانتان می‌کند، راهنمای [ترس از دندانپزشکی](/راهنمای-بیمار/ترس-از-دندانپزشکی) را بخوانید و نگرانی خود را پیش از شروع درمان با دندانپزشک در میان بگذارید.
      - type: callout
        tone: warning
        text: اگر دیابت یا بیماری مزمن دیگری دارید یا دخانیات مصرف می‌کنید، پیش از جراحی ایمپلنت به دندانپزشک بگویید. ممکن است پیش از تعیین زمان جراحی، پزشک هم سلامت عمومی شما را بررسی کند.
      - type: content
        text: |-
          ## مراقبت بعد از درمان
          - بعد از جراحی ایمپلنت، دندانپزشک ممکن است در دورهٔ بهبودی غذای نرم، غذای سرد و سوپ ولرم پیشنهاد کند.
          - هر روز دو بار مسواک بزنید و روزی یک بار بین دندان‌ها را با نخ دندان یا وسیلهٔ بین‌دندانی دیگر تمیز کنید.
          - برای اطراف ایمپلنت، مسواک‌های بین‌دندانی مخصوصی با سیم روکش‌دار هست تا به ایمپلنت خراش نزند. برای اطراف بریج، واترجت (وسیلهٔ تمیز کردن بین دندان‌ها با جریان آب) ممکن است کمک کند.
          - دربارهٔ وسیلهٔ مناسب تمیز کردن، از دندانپزشک خود بپرسید.
          - طبق برنامه‌ای که دندانپزشک می‌گوید، برای معاینه و تمیز کردن در مطب مراجعه کنید. تمیز کردن روزانه در خانه و تمیز کردن منظم در مطب به سالم ماندن لثهٔ دور ایمپلنت کمک می‌کند. در بریج، سالم ماندن دندان‌های تکیه‌گاه برای دوام آن مهم است.

          برای آشنایی بیشتر با مراحل، مراقبت و خطرهای ایمپلنت، صفحهٔ [ایمپلنت دندان](/خدمات/ایمپلنت-دندان) را بخوانید.
    faqs:
      - question: ایمپلنت ماندگارتر است یا بریج؟
        answer: >-
          در یک مرور سیستماتیک که در سال ۲۰۰۷ منتشر شد، پس از ۱۰ سال حدود ۸۹ درصد
          بریج‌های معمولی و حدود ۸۹ درصد روکش‌های تکی روی ایمپلنت هنوز در دهان
          بودند. مرور سیستماتیک دیگری پژوهشی پیدا نکرد که این دو را مستقیم با هم
          مقایسه کرده باشد. ماندگاری بریج به سلامت دندان‌های تکیه‌گاه بستگی دارد و
          ماندگاری ایمپلنت به سالم ماندن لثه و استخوان دور آن.
      - question: آیا برای بریج دندان‌های کناری تراشیده می‌شوند؟
        answer: >-
          در بریج معمولی، بخشی از ساختار دندان‌های دو طرف جای خالی برداشته می‌شود تا
          بریج روی آن‌ها ثابت شود. اگر نمی‌خواهید از دندان‌های سالم کناری برداشته
          شود، دربارهٔ ایمپلنت با دندانپزشک صحبت کنید.
      - question: چه چیزهایی در انتخاب میان ایمپلنت و بریج اثر دارد؟
        answer: >-
          سلامت عمومی، مقدار استخوان فک و سلامت دندان‌های کناری. برای ایمپلنت،
          سلامت عمومی از سن مهم‌تر است. بیماری‌هایی مثل دیابت یا سرطان خون و مصرف
          دخانیات ممکن است بهبودی بعد از جراحی را کند کنند. استخوان فک هم باید برای
          نگه داشتن ایمپلنت کافی باشد. در بریج، دندان‌های دو طرف جای خالی باید سالم
          و محکم باشند. دندانپزشک پس از معاینه می‌گوید کدام راه برای شما مناسب است.
