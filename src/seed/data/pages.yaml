    lead: >-
      فرم‌های سایت چه اطلاعاتی از شما نگه می‌دارند، چه کسانی آن را می‌بینند و تا کی
      می‌ماند. شمارهٔ شما فقط برای هماهنگی نوبت استفاده می‌شود.
    blocks:
      - type: content
        text: |-
          ## این صفحه دربارهٔ چیست؟
          این صفحه دربارهٔ سایت کلینیک دندانپزشکی سفید است: اطلاعاتی که از فرم نوبت و فرم درخواست فوری به کلینیک می‌رسد، کسانی که آن را می‌بینند و مدت نگه‌داری آن. اگر روش نگه‌داری یا استفاده از اطلاعات تغییر کند، این صفحه را پیش از آن به‌روز می‌کنیم.

          ## فرم‌ها چه چیزهایی را نگه می‌دارند؟
          - شمارهٔ موبایل شما، که لازم است
          - نام شما، اگر نوشته باشید
          - خدمتی که انتخاب کرده‌اید، و سطح ترمیم یا دندانپزشک اگر انتخاب شده باشد
          - زمانی که برای تماس یا نوبت ترجیح می‌دهید
          - توضیح شما، تا ۵۰۰ نویسه؛ چون ممکن است دربارهٔ سلامت شما باشد، فقط آنچه لازم است بنویسید
          - در درخواست فوری، نشانه‌هایی که علامت زده‌اید
          - صفحه‌ای که فرم را از آن فرستاده‌اید، و برچسب کمپین تبلیغاتی اگر در نشانی آن صفحه بوده باشد
          - نوع دستگاه شما (موبایل، تبلت یا رایانه)، بدون مشخصات کامل مرورگر
          - یک کد یک‌طرفه از نشانی آی‌پی شما برای جلوگیری از سوءاستفاده؛ خود نشانی آی‌پی نگه داشته نمی‌شود
          - یک کد یک‌طرفه از شناسهٔ کوکی فرم، تا فقط همان مرورگر ببیند درخواستش قبلاً ثبت شده است؛ خود شناسه نگه داشته نمی‌شود
          - زمان ثبت درخواست

          پذیرش کلینیک هم وضعیت درخواست، یادداشت‌ها، نام کسی که پیگیری کرده و زمان آن، مهلت تماس با شما، نتیجهٔ تماس در درخواست فوری و پاسخ شما به «از کجا با ما آشنا شدید؟» را اضافه می‌کند. اگر در کمتر از ۱۰ دقیقه دوباره درخواست بفرستید، درخواست تازه به درخواست قبلی اضافه می‌شود و چیزی پاک نمی‌شود. اگر یک درخواست بیش از ۲۰ بار تکرار شود، از تکرارهای بعدی فقط شمارشان نگه داشته می‌شود.

          ## این اطلاعات برای چیست؟
          شمارهٔ شما فقط برای هماهنگی نوبت استفاده می‌شود. باقی اطلاعات برای همین هماهنگی، و برای جلوگیری از هرزنامه و سوءاستفاده از فرم‌ها به کار می‌رود.

          ## چه کسانی آن را می‌بینند؟
          - کارکنان کلینیک که حساب کاربری دارند، با نقش «مدیر» یا «ویراستار پذیرش». هر حساب رمز عبور و کد تأیید دومرحله‌ای دارد.
          - در فهرست درخواست‌ها بخشی از شماره پنهان است. شمارهٔ کامل داخل خود درخواست و در دکمه‌های تماس و واتساپ کارکنان است.
          - فقط «مدیر» می‌تواند درخواست‌ها را، با شماره، نام و توضیح، به‌صورت فایل دریافت کند. این فایل روی سرور نگه داشته نمی‌شود.
          - کد آی‌پی و کد مرورگر را فقط «مدیر» می‌بیند، و فقط «مدیر» می‌تواند درخواستی را حذف کند.
          - سامانهٔ کلینیک ثبت می‌کند چه کسی کدام بخش درخواست را تغییر داده است، بدون خود مقدارها.
          - پیامی که کلینیک از ثبت درخواست می‌گیرد فقط شمارهٔ درخواست و شماره‌ای را دارد که بخشی از آن پنهان است، نه نام یا توضیح شما.
          - پیامک به شما فقط وقتی فرستاده می‌شود که کلینیک آن را روشن کرده باشد، و به هر شماره حداکثر یک پیامک در ۲۴ ساعت.
          - اطلاعات شما روی سرور سایت نگه داشته می‌شود. آن را به کسی نمی‌فروشیم و برای تبلیغات به کسی نمی‌دهیم.

          ## تا کی نگه داشته می‌شود؟
          درخواست‌ها تا وقتی «مدیر» آن‌ها را حذف کند می‌مانند. درخواست حذف‌شده اول به سطل بازیافت می‌رود و بعد پاک می‌شود. نسخهٔ پشتیبان شبانهٔ پایگاه داده ۱۴ روز و نسخهٔ پشتیبان روزانهٔ سرویس میزبانی ۷ روز نگه داشته می‌شود. گزارش‌های فنی سرور شمارهٔ تلفن ندارند.

          ## پیوند به سرویس‌های دیگر
          واتساپ و برنامه‌های مسیریابی (گوگل‌مپ، نشان، بلد و ویز) فقط وقتی اطلاعاتی می‌گیرند که خودتان روی پیوند آن‌ها بزنید. سایت هیچ نقشه یا قلمی از سرویس‌های دیگر بارگذاری نمی‌کند.

          ## کوکی و حافظهٔ مرورگر
          - یک کوکی با یک شناسهٔ تصادفی، برای محافظت فرم‌ها در برابر هرزنامه. این کوکی ۲۴ ساعت می‌ماند، نام یا شماره‌ای در آن نیست و کدهای صفحه نمی‌توانند آن را بخوانند.
          - اگر مرورگر شما فرم را بدون اجرای کدهای صفحه بفرستد، یک کوکی رمزگذاری‌شده حداکثر ۱۰ دقیقه نتیجهٔ ارسال را نگه می‌دارد تا صفحهٔ بعد آن را نشان دهد. اگر فرم خطا داشته باشد، آنچه نوشته‌اید هم در آن است، از جمله شماره، نام و توضیح. این کوکی با باز شدن همان صفحه پاک می‌شود و کدهای صفحه نمی‌توانند آن را بخوانند.
          - انتخاب پوستهٔ روشن یا تیره و تنظیم کیفیت گرافیک در حافظهٔ مرورگر خودتان می‌ماند. برای این‌که آزمون کیفیت گرافیک هر بار تکرار نشود، نام کارت گرافیک دستگاه و نتیجهٔ آزمون هم آن‌جا ذخیره می‌شود. پایین‌ترین کیفیتی که سایت در یک بازدید به آن رسیده، و روشن بودن حالت عیب‌یابی، در حافظهٔ موقت مرورگر می‌ماند و با بستن زبانه پاک می‌شود. این‌ها از مرورگر شما بیرون نمی‌روند.
          - آمار بازدید سایت را خودمان می‌شماریم: فقط شمار روزانهٔ کارها، مثل زدن دکمهٔ تماس، با نوع صفحه، جای دکمه در صفحه و خدمت مربوط. این شمارش کوکی، نشانی آی‌پی یا اطلاعات شخصی ندارد.
