    blocks:
      - type: steps
        items:
          - title: ثبت درخواست
            text: >-
              شماره‌تان را در فرم بگذارید یا با کلینیک تماس بگیرید. پذیرش زمان
              نوبت را با شما هماهنگ می‌کند.
          - title: معاینه و مشاوره
            text: >-
              دندانپزشک دندان‌ها و لثه را معاینه می‌کند و گزینه‌های درمان را
              برایتان توضیح می‌دهد. تصمیم با خودتان است.
          - title: درمان
            text: >-
              درمانی که با دندانپزشک انتخاب کرده‌اید انجام می‌شود. پذیرش زمان
              جلسه‌ها را با شما هماهنگ می‌کند.
          - title: مراقبت بعد از درمان
            text: >-
              دندانپزشک نکته‌های مراقبت را به شما می‌گوید. اگر سؤالی داشتید، با
              کلینیک تماس بگیرید.
      - type: faq
        items:
          - question: هزینهٔ درمان چقدر است؟
            answer: >-
              هزینه به نوع درمان و وضعیت دندان‌ها بستگی دارد و پس از معاینه
              مشخص می‌شود. پیش از شروع کار، هزینهٔ درمان را از پذیرش بپرسید.
          - question: آیا درمان درد دارد؟
            answer: >-
              بیشتر درمان‌ها با بی‌حسی موضعی انجام می‌شوند. اگر در طول کار ناراحت
              شدید، به دندانپزشک بگویید. بعد از بعضی درمان‌ها، حساسیت یا درد خفیف
              چند روزه ممکن است.
          - question: کدام بیمه‌ها را می‌پذیرید؟
            answer: >-
              کلینیک با بیمه ایران، بیمه کارآفرین، بیمه پاسارگاد، بیمه البرز و بیمه ما
              همکاری دارد. سهم بیمه به نوع درمان و بیمه‌نامهٔ شما بستگی دارد؛ پیش از
              نوبت از پذیرش بپرسید.
          - question: امکان پرداخت قسطی هست؟
            answer: >-
              دربارهٔ روش‌های پرداخت و اقساط، پیش از شروع درمان از پذیرش بپرسید.
          - question: درمان چند جلسه طول می‌کشد؟
            answer: >-
              به نوع درمان بستگی دارد. بیشتر ترمیم‌ها در یک جلسه انجام می‌شوند.
              درمان‌هایی مثل ایمپلنت یا ارتودنسی چند جلسه در چند ماه طول می‌کشند.
              تعداد جلسه‌های شما پس از معاینه مشخص می‌شود.
          - question: درد شدید دارم؛ چه کنم؟
            answer: >-
              برای بیمارانی که درد شدید دارند، در صورت امکان همان روز نوبت
              می‌دهیم. در ساعات کاری، سریع‌ترین راه تماس تلفنی است. اگر ورم صورت
              به چشم یا گردن رسیده یا نفس کشیدن و قورت دادن سخت شده است، با
              اورژانس ۱۱۵ تماس بگیرید.
