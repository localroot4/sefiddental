  # ARTICLE-4
  - slug: ماندگاری-پر-کردن-دندان
    title: ماندگاری پر کردن دندان؛ پرکردگی چند سال دوام می‌آورد؟
    seo_title: ماندگاری پر کردن دندان چقدر است؟
    seo_description: >-
      ماندگاری پر کردن دندان چقدر است؟ عددهای پژوهش‌ها، عامل‌هایی که عمر
      پرکردگی را کم یا زیاد می‌کنند و نشانه‌هایی که باید جدی بگیرید را ساده بخوانید.
    excerpt: >-
      هیچ پرکردگی همیشگی نیست، اما در پژوهش‌ها بیشتر ترمیم‌ها سال‌ها کار کرده‌اند.
      این مقاله می‌گوید پژوهش‌ها دربارهٔ ماندگاری پر کردن دندان چه می‌گویند، چه چیزی عمر آن
      را بیشتر می‌کند و چه زمانی باید به دندانپزشک سر بزنید.
    category: حفظ-دندان-طبیعی
    tags: [ماندگاری-درمان, مراقبت-در-خانه]
    primary_service: restoration
    is_medical: true
    body:
      - type: content
        text: |-
          پر کردن دندان یا ترمیم، جای بخشی از دندان را پر می‌کند که با پوسیدگی یا شکستگی از دست رفته است. بسیاری از بیماران می‌پرسند پرکردگی چند سال دوام می‌آورد. پاسخ کوتاه این است: هیچ پرکردگی همیشگی نیست، اما در پژوهش‌ها بیشتر ترمیم‌ها سال‌ها کار کرده‌اند.

          دوام هر ترمیم به اندازه و جای آن، خطر پوسیدگی و عادت‌های شما بستگی دارد. عددهای این مقاله نتیجهٔ چند پژوهش هستند، نه قولی دربارهٔ دندان شما.

          ## پژوهش‌ها دربارهٔ ماندگاری پرکردگی چه می‌گویند؟
          پژوهش‌های این مقاله دربارهٔ ترمیم همرنگ دندان یا کامپوزیت هستند. خلاصهٔ آن‌ها این است:
          - در پژوهش‌هایی که در این مقاله آمده، پس از هفت تا ده سال حدود هفت تا نه ترمیم از هر ده ترمیم هنوز کار می‌کردند.
          - در دندان‌های عقب، شکست سالانهٔ ترمیم‌ها معمولاً حدود ۱ تا ۲٫۵ درصد بود.
          - شایع‌ترین دلیل‌های شکست، شکستن ترمیم یا دندان و پوسیدگی دوباره در کنار ترمیم بود.
      - type: table
        caption: ماندگاری پرکردگی در چند پژوهش
        head: [پژوهش, دندان‌ها, یافته]
        rows:
          - [
              مرور نظام‌مند پژوهش‌ها در بزرگسالان,
              دندان‌های عقب,
              هر سال حدود ۱٫۶ درصد ترمیم‌ها از دست رفتند,
            ]
          - [
              پیگیری ۲۹ ساله (به نقل انجمن دندانپزشکی آمریکا),
              دندان‌های عقب,
              حدود ۹۲ درصد پس از ۶ سال، ۸۲ درصد پس از ۱۲ سال و ۷۱ درصد پس از ۲۹ سال هنوز کار می‌کردند,
            ]
          - [
              پیگیری بیماران یک مطب تا ۳۳ سال,
              دندان‌های عقب,
              حدود نیمی از ترمیم‌ها (۴۸ درصد) بدون هیچ درمان دوباره‌ای ماندند و ۷۳ درصد با تعمیر یا بدون آن هنوز کار می‌کردند؛ بیشتر درمان‌ها بعد از شکست، تعمیر بود,
            ]
          - [
              مرور نظام‌مند پژوهش‌ها,
              دندان‌های جلو,
              شکست سالانه در پژوهش‌های مختلف از صفر تا ۴٫۱ درصد بود,
            ]
      - type: content
        text: |-
          بخشی از این پژوهش‌ها در شرایط کنترل‌شدهٔ پژوهشی انجام شده‌اند و یکی از مرورها کیفیت شواهد را پایین دانست. نتیجه در دهان هر نفر ممکن است متفاوت باشد.

          ## چه چیزی دوام پرکردگی را کم یا زیاد می‌کند؟
          به گزارش انجمن دندانپزشکی آمریکا، پژوهش‌ها عادت‌های بیمار را مهم‌ترین عامل در دوام ترمیم کامپوزیت دانسته‌اند. پژوهش‌ها این عامل‌ها را هم نشان داده‌اند:
          - خطر پوسیدگی: در کسانی که خطر پوسیدگی بالاتری دارند، ترمیم بیشتر شکست می‌خورد. خوراکی و نوشیدنی شیرین زیاد و تمیز نکردن مرتب دندان‌ها، خطر پوسیدگی را بالا می‌برد.
          - اندازهٔ ترمیم: هرچه ترمیم بزرگ‌تر باشد و بخش‌های بیشتری از دندان را بپوشاند، خطر شکست آن بیشتر است.
          - جای دندان: در یک پژوهش بلندمدت، ترمیم دندان‌های آسیای فک بالا بیشتر شکست خورد.
          - دندان‌قروچه: فشار دادن و ساییدن دندان‌ها روی هم ممکن است دندان را فرسوده کند یا بشکند و باعث افتادن ترمیم شود.
          - روش کار: یک مرور نظام‌مند نتیجه گرفت که فارغ از نوع ماده، موفقیت ترمیم بیشتر به اجرای درست روش کار، دانش و مهارت دندانپزشک و عامل‌های بیمار بستگی دارد.

          دندانپزشک نوع مادهٔ ترمیم را با توجه به اندازه و جای حفره انتخاب می‌کند. پیش از درمان، دربارهٔ گزینه‌ها با دندانپزشک صحبت کنید.

          ## ظاهر طبیعی پرکردگی
          ترمیم کامپوزیت همرنگ دندان است و برای کسانی مناسب است که می‌خواهند پرکردگی طبیعی‌تر دیده شود. در کلینیک سفید، ترمیم دندان در سه سطح معمولی، VIP و CIP انجام می‌شود. در سطح VIP، شکل ترمیم و رویهٔ آن با دقت بیشتری ساخته می‌شود و در سطح CIP رنگ ترمیم هم به دندان‌های کناری نزدیک‌تر می‌شود. تفاوت سطح‌ها را در صفحهٔ [ترمیم دندان](/خدمات/ترمیم-دندان) بخوانید.

          ترمیم همرنگ هم با گذشت زمان ممکن است رنگ بگیرد، ساییده شود یا لبه‌اش بپرد. در پژوهشی که ترمیم‌ها را تا ۳۳ سال پیگیری کرد، بسیاری از ترمیم‌های قدیمی نشانه‌های متوسط تا زیاد کهنگی داشتند و باز هم از نظر دندانپزشکی قابل قبول بودند.

          ## سطح‌های ترمیم چه قولی نمی‌دهند؟
          - این سه سطح نام خدمت‌های این کلینیک هستند و پژوهشی دوام آن‌ها را با هم مقایسه نکرده است. هیچ سطحی ترمیم را همیشگی نمی‌کند. دوام ترمیم در هر سطح به همان عامل‌هایی بستگی دارد که بالاتر گفتیم: خطر پوسیدگی، اندازه و جای ترمیم، دندان‌قروچه و مراقبت شما.
          - در پژوهشی که ترمیم‌ها را تا ۳۳ سال پیگیری کرد، میان کامپوزیت‌های مختلف تفاوت معناداری در موفقیت ترمیم دیده نشد.
          - هیچ سطحی جای مسواک، نخ دندان و معاینهٔ منظم را نمی‌گیرد.
      - type: callout
        tone: info
        text: انتخاب نوع و سطح ترمیم با معاینه و تشخیص دندانپزشک است. هزینهٔ هر سطح را پیش از شروع کار از پذیرش بپرسید.
      - type: content
        text: |-
          ## چطور عمر پرکردگی را بیشتر کنید؟
          - روزی دو بار با خمیردندان فلورایددار مسواک بزنید. بعد از مسواک، خمیردندان را تف کنید و دهان را با آب نشویید.
          - هر روز بین دندان‌ها را با نخ دندان یا برس بین‌دندانی تمیز کنید.
          - خوراکی و نوشیدنی شیرین را کم کنید و سیگار نکشید.
          - اگر دندان‌قروچه دارید، به دندانپزشک بگویید. ممکن است محافظ دهانی پیشنهاد کند که شب‌ها روی دندان‌ها می‌گذارید تا از آن‌ها محافظت کند.
          - حتی اگر مشکلی ندارید، برای معاینهٔ منظم بیایید. دندانپزشک می‌گوید هر چند وقت یک بار لازم است. پوسیدگی کنار ترمیم ممکن است سال‌ها بعد ایجاد شود؛ در یک مرور نظام‌مند، این پوسیدگی اغلب سه سال یا بیشتر بعد از ترمیم دیده شد.

          برای مراقبت روزهای اول بعد از ترمیم، [راهنمای مراقبت بعد از درمان](/راهنمای-بیمار/مراقبت-بعد-از-درمان) را بخوانید.

          ## چه وقت پرکردگی را به دندانپزشک نشان دهید؟
          اگر یکی از این نشانه‌ها را دارید، نوبت معاینه بگیرید:
          - ترمیم لق شده، شکسته یا افتاده است.
          - دندان ترمیم‌شده درد می‌کند، یا حساسیت آن به داغ، سرد یا شیرین چند هفته بعد از ترمیم کم نشده یا بدتر شده است. حساسیت کمی در روزهای اول بعد از ترمیم تازه ممکن است و معمولاً با گذشت زمان کم می‌شود.
          - روی دندان لکهٔ سفید، قهوه‌ای یا سیاه تازه می‌بینید.
          - دندان‌هایتان را روی هم فشار می‌دهید یا می‌سایید و دندانی آسیب دیده یا حساس شده است.

          اگر درد شدید یا ورم صورت دارید، منتظر نوبت عادی نمانید و صفحهٔ [درد شدید دندان](/اورژانس) را ببینید. اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید.

          ترمیمی که رنگ گرفته یا ساییده شده، لزوماً به تعویض نیاز ندارد. در پژوهش ۳۳ ساله، بیشتر درمان‌ها بعد از شکست، تعمیر ترمیم بود و نه تعویض کامل آن. اگر بخش بزرگی از دندان شکسته یا پوسیده باشد، ممکن است دندانپزشک [اینله و آنله](/خدمات/اینله-و-آنله) یا [روکش دندان](/خدمات/روکش-دندان) پیشنهاد کند. اگر پوسیدگی به عصب دندان رسیده باشد، ممکن است [درمان ریشه](/خدمات/درمان-ریشه) لازم شود. تصمیم با معاینه و تشخیص دندانپزشک است.
    faqs:
      - question: پر کردن دندان چند سال دوام می‌آورد؟
        answer: >-
          عدد ثابتی ندارد. در پژوهش‌ها، پس از هفت تا ده سال حدود هفت تا نه ترمیم از
          هر ده ترمیم هنوز کار می‌کردند. دوام ترمیم شما به اندازه و جای آن، خطر پوسیدگی و
          مراقبت شما بستگی دارد. این عددها قولی دربارهٔ دندان شما نیستند.
      - question: آیا ترمیم VIP یا CIP بیشتر دوام می‌آورد؟
        answer: >-
          پژوهشی دوام این سه سطح را با هم مقایسه نکرده است. سطح‌ها در مواد، دقت کار
          و رنگ ترمیم فرق دارند. هیچ سطحی ترمیم را همیشگی نمی‌کند. دوام ترمیم در هر
          سطح بیشتر به خطر پوسیدگی، اندازه و جای ترمیم، دندان‌قروچه و مراقبت شما
          بستگی دارد. انتخاب سطح با معاینه و تشخیص دندانپزشک است.
      - question: آیا پرکردگی باید هر چند سال عوض شود؟
        answer: >-
          نه لزوماً. ترمیمی که رنگ گرفته یا ساییده شده، لزوماً به تعویض نیاز
          ندارد و گاهی می‌شود آن را تعمیر کرد. دندانپزشک در معاینهٔ منظم وضعیت ترمیم
          را بررسی می‌کند و می‌گوید تعمیر یا تعویض لازم است یا نه.
      - question: آیا دندان‌قروچه به پرکردگی آسیب می‌زند؟
        answer: >-
          ممکن است. فشار دادن و ساییدن دندان‌ها روی هم ممکن است دندان را فرسوده کند
          یا بشکند و باعث افتادن ترمیم شود. اگر دندان‌قروچه دارید، به دندانپزشک بگویید. ممکن
          است محافظ دهانی پیشنهاد کند که شب‌ها روی دندان‌ها می‌گذارید.
      - question: اگر پرکردگی افتاد یا شکست، چه کنم؟
        answer: >-
          با کلینیک تماس بگیرید و نوبت معاینه بگیرید. ترمیم لق یا شکسته ممکن است
          باعث درد دندان شود. تا زمان معاینه، با سمت دیگر دهان بجوید و خوراکی سفت،
          شیرین، خیلی داغ یا خیلی سرد نخورید. اگر صورت یا فک ورم کرده یا تب دارید،
          منتظر نوبت عادی نمانید. اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس
          ۱۱۵ تماس بگیرید.
