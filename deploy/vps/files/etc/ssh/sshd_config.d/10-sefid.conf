# Installed by deploy/vps/provision.sh. sshd uses the first value it reads for each keyword, so
# this file sorts before 50-cloud-init.conf (which may set PasswordAuthentication yes) and before
# the rest of sshd_config. provision.sh checks the effective values with "sshd -T".
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers deploy
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
# Only the database tunnel of the deploy workflow (ssh -L <port>:127.0.0.1:5432).
AllowTcpForwarding local
PermitOpen 127.0.0.1:5432
ClientAliveInterval 300
