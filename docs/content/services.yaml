  - key: scaling
    category: restorative
    nav_label: جرم‌گیری
    h1: جرم‌گیری و بروساژ دندان
    seo_title: جرم‌گیری دندان
    slug: جرم-گیری
    booking_group: other
    priority: 2
    search_terms: [جرم گیری دندان, قیمت جرم گیری, بروساژ دندان, هر چند وقت جرم گیری]
    summary: پاک کردن جرم و رسوب دندان‌ها و پرداخت سطح آن‌ها (بروساژ)؛ در کنار مسواک و نخ دندان روزانه، به درمان التهاب لثه کمک می‌کند.
    seo_description: >-
      جرم‌گیری و بروساژ دندان در کلینیک دندانپزشکی سفید: جرم چیست، مراحل
      کار، حساسیت بعد از آن و هر چند وقت یک بار لازم است. خانی‌آباد نو، جنوب
      تهران.
    sessions: معمولاً یک جلسه
    anesthesia: گاهی موضعی، برای جرم‌گیری عمقی
    recovery: گاهی حساسیت خفیف، معمولاً تا حدود یک هفته
    related: [gum-surgery, restoration, bleaching]
    body:
      - type: content
        text: |-
          ## جرم‌گیری چیست؟
          پلاک لایهٔ چسبنده‌ای از میکروب‌هاست که مدام روی دندان‌ها تشکیل می‌شود. اگر با مسواک و نخ دندان پاک نشود، سفت می‌شود و به جرم تبدیل می‌شود. جرم بیشتر کنار لثه جمع می‌شود، با مسواک زدن پاک نمی‌شود و فقط با جرم‌گیری در مطب دندانپزشکی برداشته می‌شود.

          در جرم‌گیری، جرم و پلاک با ابزار دستی یا دستگاه اولتراسونیک از سطح دندان‌ها برداشته می‌شود. در بروساژ، سطح دندان‌ها با خمیر مخصوص پرداخت می‌شود تا رسوب و لکه‌های سطحی کم شود.

          ## برای چه کسی مناسب است؟
          - جرم یا رسوب روی دندان‌ها، به‌ویژه کنار لثه
          - لثه‌ای که هنگام مسواک زدن یا نخ دندان خون می‌آید، یا قرمز و متورم است
          - لکه‌های سطحی روی دندان‌ها

          ## چه وقت جرم‌گیری کافی نیست؟
          اگر بیماری لثه پیشرفته باشد و بین لثه و دندان فضایی به نام پاکت ایجاد شده باشد، جرم‌گیری معمولی کافی نیست. در این حالت ممکن است جرم‌گیری عمقی زیر لثه و صاف کردن سطح ریشه لازم شود، و در موارد شدیدتر جراحی لثه. جرم‌گیری پوسیدگی را هم درمان نمی‌کند و دندان پوسیده ترمیم لازم دارد. دندانپزشک پس از معاینه، درمان مناسب را پیشنهاد می‌کند.
      - type: callout
        tone: info
        text: نیاز به جرم‌گیری و نوع آن را دندانپزشک پس از معاینه می‌گوید. هزینه را پیش از شروع کار از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک دندان‌ها، لثه و دهان را معاینه می‌کند و دربارهٔ سلامت عمومی و عادت‌های مسواک زدن شما می‌پرسد. اگر بیماری قلبی دارید، مثل دریچهٔ مصنوعی قلب یا سابقهٔ عفونت دریچهٔ قلب، پیش از جرم‌گیری بگویید؛ برای بعضی از این بیماران، پیش از کارهایی که لثه را درگیر می‌کنند، مصرف آنتی‌بیوتیک توصیه می‌شود.
          - title: جرم‌گیری
            text: جرم و پلاک با دستگاه اولتراسونیک یا ابزار دستی از سطح دندان‌ها و کنار لثه برداشته می‌شود.
          - title: بروساژ
            text: سطح دندان‌ها با خمیر مخصوص پرداخت می‌شود تا رسوب و لکه‌های سطحی کم شود.
          - title: آموزش مراقبت
            text: دندانپزشک روش تمیز کردن دندان‌ها و فاصلهٔ بین آن‌ها را توضیح می‌دهد و زمان مراجعهٔ بعدی را پیشنهاد می‌کند.
      - type: content
        text: |-
          ## بعد از جرم‌گیری
          ممکن است دندان‌ها مدتی به سرما و گرما حساس باشند. جرم‌گیری ممکن است حساسیت دندان ایجاد کند یا به سطح دندان آسیب بزند. اگر حساسیت ادامه پیدا کرد، به دندانپزشک بگویید. بعد از جرم‌گیری عمقی زیر لثه، یکی دو روز درد، تا حدود یک هفته حساسیت و ورم، حساس بودن یا خونریزی لثه ممکن است. این نشانه‌ها معمولاً با گذشت زمان کم می‌شوند.

          دو بار در روز با خمیردندان فلورایددار مسواک بزنید و هر روز بین دندان‌ها را با نخ دندان یا مسواک بین‌دندانی تمیز کنید. اگر درد، ورم یا خونریزی بیشتر شد یا درد بیش از دو روز ادامه پیدا کرد، با کلینیک تماس بگیرید.
    faqs:
      - question: هر چند وقت یک بار جرم‌گیری لازم است؟
        answer: >-
          فاصلهٔ یکسانی برای همه نیست. دندانپزشک در معاینهٔ دوره‌ای، با توجه به
          جرم دندان‌ها و سلامت لثهٔ شما، می‌گوید کی جرم‌گیری لازم است. فاصلهٔ
          معاینه‌های دوره‌ای هم برای هر کس فرق دارد و ممکن است از سه ماه تا دو
          سال باشد (برای زیر ۱۸ سال حداکثر یک سال). در پژوهش‌ها، بزرگسالانی
          بررسی شدند که بیماری شدید لثه نداشتند و منظم به دندانپزشک می‌رفتند.
          برای آن‌ها، جرم‌گیری هر شش یا دوازده ماه، در مقایسه با نداشتن برنامهٔ
          ثابت جرم‌گیری، در التهاب لثه تفاوت چندانی ایجاد نکرد و فقط جرم را کمی
          کمتر کرد.
      - question: آیا جرم‌گیری درد دارد؟
        answer: >-
          جرم‌گیری معمولی ممکن است حساسیت ایجاد کند. اگر جرم زیر لثه باشد و
          جرم‌گیری عمقی لازم شود، ممکن است با بی‌حسی موضعی انجام شود. بعد از آن،
          یکی دو روز درد و تا حدود یک هفته حساسیت ممکن است. اگر نگران درد هستید، پیش از شروع کار به دندانپزشک
          بگویید.
      - question: فرق جرم‌گیری و بروساژ چیست؟
        answer: >-
          جرم‌گیری، جرم سفت‌شده و پلاک را با ابزار دستی یا دستگاه اولتراسونیک
          برمی‌دارد. در بروساژ، سطح دندان‌ها با خمیر مخصوص پرداخت می‌شود تا
          رسوب و لکه‌های سطحی کم شود.
      - question: آیا بعد از جرم‌گیری دندان‌ها حساس می‌شوند؟
        answer: >-
          ممکن است. جرم‌گیری می‌تواند حساسیت موقت به سرما و گرما ایجاد کند،
          به‌ویژه جرم‌گیری عمقی زیر لثه. اگر ادامه پیدا کرد، به دندانپزشک بگویید؛ خمیردندان ضدحساسیت یکی از
          راه‌های درمان آن است.
      - question: آیا جرم‌گیری دندان‌ها را سفید می‌کند؟
        answer: >-
          جرم‌گیری و بروساژ جرم و لکه‌های سطحی را برمی‌دارد، اما رنگ خود دندان
          را روشن نمی‌کند. برای روشن کردن رنگ دندان، بلیچینگ درمان جداگانه‌ای
          است و انتخاب آن با معاینه و تشخیص دندانپزشک است.
      - question: لثه‌ام هنگام مسواک زدن خون می‌آید؛ جرم‌گیری لازم است؟
        answer: >-
          خونریزی لثه هنگام مسواک زدن یا نخ دندان از نشانه‌های بیماری لثه است؛
          یک نوبت معاینه بگیرید. در مرحلهٔ اول بیماری لثه، تمیز کردن دندان‌ها در
          مطب همراه با مسواک زدن و نخ دندان روزانه معمولاً التهاب را برطرف
          می‌کند. اگر بیماری پیشرفته باشد، درمان بیشتری لازم است.
      - question: هزینهٔ جرم‌گیری چقدر است؟
        answer: >-
          هزینه به نوع جرم‌گیری و وضعیت لثه بستگی دارد و پس از معاینه مشخص
          می‌شود. پیش از شروع کار، هزینه را از پذیرش بپرسید.
