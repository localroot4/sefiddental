# Installed by deploy/vps/provision.sh into /etc/postgresql/<version>/main/conf.d/.
# IPv4 loopback only: DATABASE_URL and the sshd PermitOpen use 127.0.0.1. Conservative memory
# for 2 GB of RAM (plus 2 GB swap) shared with the app (MemoryMax=1400M) and nginx.
listen_addresses = '127.0.0.1'
password_encryption = scram-sha-256
max_connections = 30
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
timezone = 'UTC'
log_timezone = 'UTC'
