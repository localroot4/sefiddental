  - key: root-canal
    category: restorative
    nav_label: درمان ریشه
    h1: درمان ریشه (عصب‌کشی)
    seo_title: عصب‌کشی دندان (درمان ریشه)
    slug: درمان-ریشه
    booking_group: root_canal
    priority: 2
    emergency_link: true
    search_terms: [عصب کشی دندان, درمان ریشه, قیمت عصب کشی, عصب کشی چند جلسه است]
    summary: درمان عصب دندان که آسیب جبران‌ناپذیر دیده یا عفونی شده است، برای نگه داشتن خود دندان.
    seo_description: >-
      درمان ریشه (عصب‌کشی) در کلینیک دندانپزشکی سفید: چه وقت لازم است، مراحل
      کار، چند جلسه طول می‌کشد، مراقبت بعد از درمان و نقش روکش. خانی‌آباد نو،
      جنوب تهران.
    sessions: یک جلسه یا بیشتر، بسته به وضعیت دندان
    duration: هر جلسه معمولاً یک تا دو ساعت یا بیشتر
    anesthesia: معمولاً بی‌حسی موضعی
    recovery: حساسیت و ناراحتی معمولاً طی چند روز تا دو هفته کم می‌شود
    related: [crown, extraction, restoration]
    body:
      - type: content
        text: |-
          ## درمان ریشه چیست؟
          درون هر دندان بافت نرمی به نام پالپ هست که عصب‌ها و رگ‌های خونی دندان در آن قرار دارند. اگر پالپ آسیب جبران‌ناپذیر ببیند (التهاب برگشت‌ناپذیر) یا عفونی شود، در درمان ریشه (عصب‌کشی) دندانپزشک پالپ آسیب‌دیده را برمی‌دارد، داخل دندان و کانال‌های ریشه را تمیز و شکل‌دهی می‌کند و آن‌ها را پر و مهروموم می‌کند تا دوباره عفونی نشوند. هدف درمان ریشه نگه داشتن خود دندان است، به‌جای کشیدن آن.

          ## چه وقت درمان ریشه لازم می‌شود؟
          پالپ ممکن است به این دلیل‌ها ملتهب یا عفونی شود:
          - پوسیدگی عمیق
          - ترک یا شکستگی دندان
          - ضربه به دندان، حتی وقتی ترک یا لب‌پریدگی دیده نمی‌شود
          - درمان‌های مکرر روی همان دندان
          - بیماری لثه یا آبسهٔ دندان، یعنی جمع شدن چرک در دندان یا لثه

          دندان‌دردی که بیش از دو روز ادامه دارد یا با مسکن آرام نمی‌شود، و دندان‌دردی همراه با تب، درد هنگام گاز گرفتن، قرمزی لثه، طعم بد در دهان یا ورم گونه یا فک، نشانه‌هایی هستند که باید دندانپزشک دندان را ببیند. اینکه درمان ریشه لازم است یا نه، با معاینه و تشخیص دندانپزشک و عکس رادیوگرافی مشخص می‌شود.

          ## چه وقت درمان ریشه راه مناسب یا کافی نیست؟
          اگر دندان آن‌قدر آسیب دیده باشد که نشود آن را ترمیم کرد، ممکن است دندانپزشک [کشیدن دندان](/خدمات/کشیدن-دندان) را پیشنهاد کند. این تصمیم با توجه به ارزش نگه داشتن دندان، امکان ترمیم آن و راه‌های دیگر گرفته می‌شود.

          آنتی‌بیوتیک جای درمان ریشه را نمی‌گیرد. وقتی عصب دندان دچار التهاب برگشت‌ناپذیر شده است، درمان رایج برداشتن عصب ملتهب است و شواهد موجود نشان نمی‌دهد که آنتی‌بیوتیک این دندان‌درد را کم کند. اگر عفونت گسترش یافته باشد، دندانپزشک ممکن است آنتی‌بیوتیک هم تجویز کند.

          درمان ریشه به‌تنهایی کار را تمام نمی‌کند. بعد از آن، دندان به ترمیم نهایی یا روکش نیاز دارد تا از آن محافظت شود.
      - type: callout
        tone: info
        text: انتخاب بین درمان ریشه و راه‌های دیگر با معاینه و تشخیص دندانپزشک است. هزینه را پیش از شروع کار از پذیرش بپرسید.
      - type: steps
        items:
          - title: معاینه و عکس
            text: دندانپزشک دندان را معاینه می‌کند و عکس رادیوگرافی می‌گیرد تا وضعیت دندان و استخوان اطراف ریشه را ببیند.
          - title: بی‌حسی و جدا کردن دندان
            text: دندان و ناحیهٔ اطراف آن با بی‌حسی موضعی بی‌حس می‌شود. یک ورقهٔ نازک لاستیکی دور دندان قرار می‌گیرد تا دندان در طول کار خشک و تمیز بماند. اگر به لاتکس یا دارویی حساسیت دارید، پیش از شروع به دندانپزشک بگویید.
          - title: برداشتن پالپ
            text: دندانپزشک از بالای دندان راهی به داخل آن باز می‌کند و پالپ ملتهب یا عفونی را از داخل دندان و کانال‌های ریشه برمی‌دارد. اگر آبسه وجود داشته باشد، چرک آن تخلیه می‌شود.
          - title: تمیز کردن کانال‌ها
            text: داخل دندان و هر کانال ریشه تمیز و برای پر شدن شکل داده می‌شود. ممکن است داروی ضدمیکروب هم در دندان گذاشته شود.
          - title: پر کردن کانال‌ها
            text: کانال‌ها با ماده‌ای لاستیک‌مانند پر و مهروموم می‌شوند تا دوباره عفونی نشوند. سپس معمولاً پرکردگی موقت روی دندان گذاشته می‌شود تا ترمیم نهایی انجام شود. اگر درمان در چند جلسه انجام شود، بین جلسه‌ها هم پرکردگی موقت گذاشته می‌شود.
          - title: ترمیم نهایی
            text: در جلسهٔ بعد، پرکردگی موقت برداشته می‌شود و ترمیم دائمی یا روکش جای آن را می‌گیرد. گاهی یک پست، یعنی میلهٔ کوچکی از فلز یا پلاستیک، داخل کانال ریشه گذاشته می‌شود تا ترمیم بهتر سر جایش بماند.
      - type: content
        text: |-
          ## بعد از درمان ریشه
          تا چند ساعت بعد از درمان، فک و صورت ممکن است بی‌حس باشد. تا بی‌حسی کامل از بین نرفته است، غذا نجوید تا لب و گونه‌تان را گاز نگیرید.

          دندان و ناحیهٔ اطراف آن ممکن است چند روز حساس، دردناک یا کمی متورم باشد. این حالت معمولاً طی چند روز تا دو هفته بهتر می‌شود. اگر درد دارید، مسکنی مثل استامینوفن یا ایبوپروفن به اندازهٔ توصیه‌شده کمک می‌کند. اگر نمی‌دانید کدام مسکن برای شما مناسب است، از دندانپزشک بپرسید.

          - مراقب باشید ضربه‌ای به دهانتان نخورد.
          - دندانی که درمان ریشه شده از دندان سالم ضعیف‌تر است. ترمیم نهایی یا روکش را عقب نیندازید و به جلسه‌های پیگیری بیایید. پرکردگی موقت برای مدت کوتاه است و ترمیم نهایی باید در اولین فرصت انجام شود.
          - اگر آنتی‌بیوتیک برایتان تجویز شده است، آن را طبق دستور مصرف کنید.
          - دو بار در روز با خمیردندان فلورایددار مسواک بزنید، هر روز بین دندان‌ها را تمیز کنید و برای معاینه‌های منظم بیایید.

          ## خطرها و محدودیت‌ها
          درمان ریشه بیشتر وقت‌ها دندان را نگه می‌دارد، ولی نتیجهٔ آن قطعی نیست. در مرور پژوهش‌ها، ۸۶ تا ۹۳ درصد دندان‌هایی که درمان ریشه شده بودند، دو تا ده سال بعد هنوز در دهان بودند.

          - اگر عفونت برگردد، ممکن است درمان دوبارهٔ ریشه یا جراحی روی نوک ریشه لازم شود. در یک مرور پژوهش‌ها، درد و ورم هفتهٔ اول بعد از جراحی بیشتر از درمان دوبارهٔ ریشه بود. گاهی هم دندان باید کشیده شود.
          - دندانی که درمان ریشه شده ممکن است بشکند. برای ترمیم نهایی، دندانپزشک بسته به مقدار دندانی که باقی مانده است، ترمیم یا [روکش دندان](/خدمات/روکش-دندان) را پیشنهاد می‌کند.

          ## چه وقت با کلینیک تماس بگیرید؟
          - درد یا ورم بعد از چند روز بیشتر می‌شود، یا با مسکن آرام نمی‌شود.
          - تب دارید یا ورم به گونه یا فک رسیده است.
          - پرکردگی موقت افتاده یا شکسته است.
          - در مصرف داروی تجویزشده مشکل دارید.
      - type: callout
        tone: warning
        text: اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید. اگر دور چشم یا گردن ورم کرده است، دهانتان به‌سختی باز می‌شود یا داخل دهان خیلی ورم کرده است، همین حالا به اورژانس بیمارستان بروید.
    faqs:
      - question: آیا درمان ریشه درد دارد؟
        answer: >-
          پیش از شروع، دندان با بی‌حسی موضعی بی‌حس می‌شود و دندانپزشک مطمئن
          می‌شود بی‌حسی کافی است. دردی که پیش از درمان داشتید، معمولاً بعد از
          درمان از بین می‌رود. دندان ممکن است چند روز حساس باشد؛ اگر درد بیشتر
          شد یا با مسکن آرام نشد، با کلینیک تماس بگیرید.
      - question: عصب‌کشی چند جلسه است؟
        answer: >-
          درمان ریشه ممکن است در یک جلسه یا چند جلسه انجام شود و این به وضعیت
          دندان بستگی دارد. هر جلسه ممکن است یک تا دو ساعت یا بیشتر باشد. در
          پژوهش‌ها، نتیجهٔ درمان یک‌جلسه‌ای و چندجلسه‌ای در عکس یک سال بعد
          تفاوتی نداشت، ولی بعد از درمان یک‌جلسه‌ای، درد در هفتهٔ اول بیشتر
          گزارش شد. تعداد جلسه‌ها را دندانپزشک پس از معاینه می‌گوید. ترمیم نهایی یا روکش
          ممکن است جلسهٔ جداگانه‌ای لازم داشته باشد.
      - question: آیا بعد از عصب‌کشی روکش لازم است؟
        answer: >-
          همیشه نه. دندانی که درمان ریشه شده از دندان سالم ضعیف‌تر است و به
          ترمیم نهایی نیاز دارد. انتخاب بین ترمیم و روکش بیشتر به مقدار دندانی
          که باقی مانده است بستگی دارد. در یک مرور پژوهش‌ها، دندان‌هایی که بعد
          از درمان ریشه روکش شدند بیشتر در دهان ماندند، ولی پژوهش‌های مقایسه‌ای
          هنوز برای نتیجه‌گیری قطعی کافی نیست. دندانپزشک پس از معاینه، ترمیم یا
          روکش را پیشنهاد می‌کند.
      - question: دندان عصب‌کشی‌شده چقدر دوام دارد؟
        answer: >-
          با مراقبت درست، دندان درمان‌شده ممکن است سال‌ها بماند. در مرور
          پژوهش‌ها، ۸۶ تا ۹۳ درصد این دندان‌ها دو تا ده سال بعد هنوز در دهان
          بودند. ترمیم نهایی به‌موقع، مسواک زدن دو بار در روز، تمیز کردن بین
          دندان‌ها و معاینهٔ منظم به ماندن دندان کمک می‌کند.
      - question: آیا آنتی‌بیوتیک جای عصب‌کشی را می‌گیرد؟
        answer: >-
          نه. وقتی عصب دندان دچار التهاب برگشت‌ناپذیر شده است، درمان رایج
          برداشتن عصب ملتهب است. شواهد موجود نشان نمی‌دهد که آنتی‌بیوتیک این
          دندان‌درد را کم کند. اگر عفونت گسترش یافته باشد، دندانپزشک ممکن است
          آنتی‌بیوتیک هم تجویز کند.
      - question: اگر درمان ریشه را انجام ندهم چه می‌شود؟
        answer: >-
          اگر پالپ عفونی درمان نشود، عفونت ممکن است به بافت‌های اطراف ریشه
          برسد و درد، ورم و آبسه ایجاد کند. آبسهٔ دندان خودبه‌خود خوب نمی‌شود.
          عفونت می‌تواند به استخوانی که دندان را نگه می‌دارد آسیب بزند و ممکن
          است لازم شود دندان کشیده شود.
      - question: آیا دندان شیری هم عصب‌کشی می‌شود؟
        answer: >-
          دندان شیری هم ممکن است درمان عصب لازم داشته باشد. نوع درمان به سلامت
          عصب بستگی دارد. اگر عصب سالم باشد یا التهاب آن برگشت‌پذیر باشد،
          درمان‌هایی مثل پالپوتومی به کار می‌رود. اگر التهاب برگشت‌ناپذیر باشد
          یا عصب از بین رفته باشد، معمولاً درمان‌هایی مثل پالپکتومی به کار
          می‌رود؛ گاهی پالپوتومی هم ممکن است و گاهی کشیدن دندان بهتر است.
          انتخاب درمان با معاینه و تشخیص دندانپزشک است.
      - question: هزینهٔ عصب‌کشی چقدر است؟
        answer: >-
          هزینه به دندان و وضعیت آن و ترمیمی که بعد از درمان لازم است بستگی
          دارد و پس از معاینه مشخص می‌شود. پیش از شروع کار، هزینهٔ درمان ریشه
          و ترمیم نهایی یا روکش را از پذیرش بپرسید.
