services:
  # ---- cosmetic ----
  - key: ceramic-laminate
    category: cosmetic
    nav_label: لمینت سرامیکی
    h1: لمینت سرامیکی دندان
    seo_title: لمینت سرامیکی؛ مراحل و هزینه
    slug: لمینت-سرامیکی
    booking_group: cosmetic
    priority: 1
    search_terms: [لمینت سرامیکی, لمینت دندان, قیمت لمینت دندان, لمینت دندان جنوب تهران, عوارض لمینت]
    summary: پوسته‌های نازک سرامیکی که روی سطح جلوی دندان چسبانده می‌شوند تا رنگ و فرم دندان‌های جلو تغییر کند.
    seo_description: >-
      لمینت سرامیکی دندان در کلینیک دندانپزشکی سفید: لمینت چیست و برای چه
      کسی مناسب است، مراحل کار، مراقبت و عوارض لمینت. خانی‌آباد نو، جنوب
      تهران.
    sessions: معمولاً بیش از یک جلسه
    recovery: ممکن است چند روز طول بکشد تا به لمینت عادت کنید
    related: [composite-veneer, smile-design, bleaching]
    body:
      - type: content
        text: |-
          ## لمینت سرامیکی چیست؟
          لمینت سرامیکی پوستهٔ نازکی از سرامیک است که برای هر دندان جداگانه ساخته می‌شود و روی سطح جلوی آن می‌چسبد. لمینت فقط سطح جلوی دندان را می‌پوشاند، اما روکش کل تاج دندان را می‌پوشاند. لمینت سرامیکی محکم است، ظاهری طبیعی دارد و در برابر لک و سایش از کامپوزیت مقاوم‌تر است.

          ## برای چه کسی مناسب است؟
          - لب‌پریدگی یا شکستگی دندان‌های جلو
          - تغییر رنگ دندان
          - دندان کج یا بدفرم
          - فاصلهٔ بین دندان‌ها

          ## چه وقت لمینت انتخاب مناسبی نیست؟
          - اگر پوسیدگی یا بیماری لثه دارید، اول باید درمان شود. لمینت روی دندان ناسالم ممکن است مشکل را بدتر کند.
          - اگر دندان‌قروچه دارید، دندان‌هایتان را روی هم فشار می‌دهید یا دندان‌های بالا بیش از اندازه روی دندان‌های پایین را می‌پوشانند، لمینت ممکن است انتخاب مناسبی نباشد.
          - لمینت جای دندان را عوض نمی‌کند و فقط سطح جلوی آن را می‌پوشاند. اگر دندان‌ها خیلی نامرتب‌اند، [ارتودنسی](/خدمات/ارتودنسی) ممکن است انتخاب مناسب‌تری باشد.
          - اگر دندان شکستگی بزرگی دارد، ممکن است روکش یا درمان دیگری لازم باشد.

          [کامپوزیت دندان](/خدمات/کامپوزیت-دندان) هم روی سطح جلوی دندان قرار می‌گیرد. ممکن است تراش کمتر و جلسه‌های کمتری لازم داشته باشد، اما در برابر لک و سایش به اندازهٔ لمینت مقاوم نیست. انتخاب درمان با معاینه و تشخیص دندانپزشک است.
      - type: callout
        tone: info
        text: لمینت برگشت‌پذیر نیست، چون برای چسباندن آن کمی از مینای دندان برداشته می‌شود. پیش از تصمیم، انتظارات و نگرانی‌هایتان را با دندانپزشک در میان بگذارید.
      - type: steps
        items:
          - title: معاینه
            text: دندانپزشک سلامت دندان‌ها و لثه را بررسی می‌کند. اگر پوسیدگی یا بیماری لثه باشد، اول همان درمان می‌شود.
          - title: انتخاب رنگ
            text: رنگ لمینت با کمک دندانپزشک انتخاب می‌شود تا با دندان‌های طبیعی شما هماهنگ باشد.
          - title: آماده‌سازی دندان
            text: مقدار کمی از مینای سطح جلو و کناره‌های دندان برداشته می‌شود تا لمینت روی آن بنشیند.
          - title: قالب‌گیری و ساخت
            text: از دندان قالب یا اسکن گرفته می‌شود و لمینت در لابراتوار دندانسازی برای دندان شما ساخته می‌شود. تا آماده شدن آن ممکن است لمینت موقت روی دندان قرار بگیرد.
          - title: امتحان و چسباندن
            text: لمینت روی دندان امتحان می‌شود تا اندازه و فرم آن بررسی شود. پس از اصلاحات لازم، دندان تمیز و لمینت به آن چسبانده می‌شود.
      - type: content
        text: |-
          ## بعد از لمینت
          ممکن است چند روز طول بکشد تا به لمینت عادت کنید. اگر هنگام بستن دهان دندان‌ها درست روی هم نمی‌نشینند، به دندانپزشک بگویید تا آن را اصلاح کند.

          - ناخن نجوید و چیزهای سفت یا خوراکی‌های خیلی سفت را گاز نگیرید.
          - اگر ورزشی می‌کنید که ممکن است به دهان ضربه بزند، محافظ دهان بگذارید.
          - قهوه، چای و نوشیدنی‌های پررنگ ممکن است لمینت را لک یا رنگی کنند. در مصرف آن‌ها احتیاط کنید.
          - دو بار در روز با خمیردندان فلورایددار مسواک بزنید و هر روز بین دندان‌ها را تمیز کنید.

          ## خطرها و عوارض
          - لمینت ممکن است با گذشت زمان لب‌پر شود، ترک بخورد، ساییده یا لق شود و به چسباندن دوباره، تعمیر یا تعویض نیاز پیدا کند.
          - زیر و اطراف لمینت هم ممکن است پوسیدگی ایجاد شود.
          - به‌ندرت عصب دندان آسیب می‌بیند و درمان ریشه لازم می‌شود.

          اگر لمینت لق شد یا شکست، با کلینیک تماس بگیرید.
    faqs:
      - question: آیا برای لمینت سرامیکی دندان تراشیده می‌شود؟
        answer: >-
          بله. معمولاً مقدار کمی از مینای سطح جلو و کناره‌های دندان برداشته
          می‌شود تا لمینت روی آن بنشیند. به همین دلیل لمینت برگشت‌پذیر نیست.
          مقدار تراش برای دندان شما پس از معاینه مشخص می‌شود.
      - question: لمینت سرامیکی چند جلسه است؟
        answer: >-
          معمولاً بیش از یک جلسه. ابتدا دندان آماده و قالب‌گیری می‌شود و
          لمینت در لابراتوار ساخته می‌شود. در جلسهٔ بعد، لمینت امتحان و
          چسبانده می‌شود. تعداد جلسه‌های شما پس از معاینه مشخص می‌شود.
      - question: عوارض لمینت چیست؟
        answer: >-
          لمینت برگشت‌پذیر نیست. ممکن است با گذشت زمان لب‌پر شود، ترک بخورد،
          ساییده یا لق شود و به چسباندن دوباره، تعمیر یا تعویض نیاز پیدا کند.
          زیر و اطراف لمینت هم پوسیدگی ممکن است. به‌ندرت هم عصب دندان آسیب
          می‌بیند و به درمان ریشه نیاز پیدا می‌کند. چند روز هم ممکن است طول
          بکشد تا به آن عادت کنید.
      - question: لمینت سرامیکی چقدر دوام دارد؟
        answer: >-
          لمینت سرامیکی بادوام است، اما همیشگی نیست. ماندگاری آن در هر فرد
          متفاوت است. ناخن نجویدن، گاز
          نگرفتن چیزهای سفت، محافظ دهان هنگام ورزش و مسواک و نخ دندان منظم به
          عمر آن کمک می‌کند. اگر دندان‌قروچه دارید، پیش از درمان به دندانپزشک
          بگویید.
      - question: آیا رنگ لمینت تغییر می‌کند؟
        answer: >-
          لمینت سرامیکی در برابر لک از کامپوزیت مقاوم‌تر است، اما قهوه و چای
          ممکن است آن را لک یا رنگی کنند. رنگ لمینت با بلیچینگ عوض نمی‌شود. اگر به
          سفید کردن دندان‌ها هم فکر می‌کنید، پیش از انتخاب رنگ لمینت به
          دندانپزشک بگویید.
      - question: آیا لمینت برای همه مناسب است؟
        answer: >-
          نه. اگر پوسیدگی یا بیماری لثه دارید، اول باید درمان شود. برای کسی که
          دندان‌قروچه دارد یا دندان‌های بالایش بیش از اندازه روی دندان‌های پایین
          را می‌پوشانند، لمینت ممکن است انتخاب مناسبی نباشد. انتخاب درمان با
          معاینه و تشخیص دندانپزشک است.
      - question: قیمت لمینت دندان چقدر است؟
        answer: >-
          هزینه به تعداد دندان‌ها و وضعیت دهان شما بستگی دارد و پس از معاینه
          مشخص می‌شود. لمینت سرامیکی معمولاً از کامپوزیت گران‌تر است. پیش از
          شروع کار، هزینه را از پذیرش بپرسید.
