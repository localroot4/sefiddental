              جراحی دارد؛ عفونت، محکم نشدن ایمپلنت و التهاب لثه و استخوان دور آن (پری‌ایمپلنتیت) ممکن است. مشکلات فنی مثل شل شدن پیچ یا پایه، شکستن یا لب‌پریدگی چینی روکش و جدا شدن روکش هم بیشتر دیده شد,
              پوسیدگی دندان‌های تکیه‌گاه و از بین رفتن عصب آن‌ها شایع‌ترین مشکل بود,
            ]
          - [
