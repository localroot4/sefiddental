  - key: about
    slug: درباره-ما
    title: درباره کلینیک دندانپزشکی سفید
    seo_title: درباره ما
    lead: کلینیک دندانپزشکی سفید، یک کلینیک دندانپزشکی دیجیتال در خانی‌آباد نو، جنوب تهران است.
    blocks:
      - type: content
        text: |-
          ## کلینیک سفید کجاست؟
          کلینیک دندانپزشکی سفید یک شعبه دارد: تهران، خانی‌آباد نو، خیابان میعاد شمالی، ابتدای کوچه صابر.

          ## چه خدماتی دارد؟
          در کلینیک، خدمات زیبایی دندان، جراحی و جایگزینی دندان، ترمیم و نگهداری دندان، ارتودنسی و دندانپزشکی کودکان انجام می‌شود. ترمیم دندان در سه سطح معمولی، VIP و CIP انجام می‌شود.

          ## چطور کار می‌کنیم؟
          انتخاب درمان همیشه با معاینه و تشخیص دندانپزشک است. پیش از شروع درمان، دربارهٔ گزینه‌ها و هزینه سؤال کنید؛ تصمیم با خودتان است.

          کلینیک با بیمه ایران، بیمه کارآفرین، بیمه پاسارگاد، بیمه البرز و بیمه ما همکاری دارد.
