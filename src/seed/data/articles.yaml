  # ARTICLE-5
  - slug: درد-بعد-از-عصب-کشی
    title: درد بعد از عصب‌کشی؛ چه چیزی طبیعی است و چه زمانی باید تماس بگیرید؟
    seo_title: درد بعد از عصب‌کشی تا کی طبیعی است؟
    seo_description: >-
      درد بعد از عصب‌کشی چند روز طبیعی است؟ ببینید درد معمولاً چقدر طول می‌کشد،
      چه چیزی کمک می‌کند و کدام نشانه‌ها یعنی باید با دندانپزشک تماس بگیرید.
    excerpt: >-
      کمی درد و حساسیت بعد از عصب‌کشی شایع است و در بیشتر بیماران طی چند روز کم
      می‌شود. این مقاله می‌گوید چه دردی طبیعی است، چه چیزی کمک می‌کند و کدام
      نشانه‌ها یعنی باید با دندانپزشک تماس بگیرید.
    category: حفظ-دندان-طبیعی
    tags: [مراقبت-در-خانه]
    primary_service: root-canal
    is_medical: true
    body:
      - type: content
        text: |-
          عصب‌کشی یا درمان ریشه، عصب و بافت آسیب‌دیده یا عفونی داخل دندان را برمی‌دارد. بعد داخل دندان تمیز و پر می‌شود تا دوباره عفونی نشود. هدف این درمان نگه داشتن خود دندان است.

          بعد از درمان، دردی که پیش از آن داشتید معمولاً از بین می‌رود. با این حال، کمی درد یا حساسیت در روزهای اول بعد از عصب‌کشی شایع است. این مقاله می‌گوید چه دردی طبیعی است، معمولاً چقدر طول می‌کشد، چه چیزی کمک می‌کند و کدام نشانه‌ها یعنی باید با دندانپزشک تماس بگیرید. دستوری که دندانپزشک خودتان بعد از درمان می‌دهد همیشه مقدم است.

          ## چه دردی بعد از عصب‌کشی طبیعی است؟
          - تا چند ساعت بعد از درمان، فک و صورت ممکن است بی‌حس باشد. تا بی‌حسی از بین نرفته است، غذا نجوید و نوشیدنی داغ ننوشید؛ ممکن است لب، گونه یا زبانتان آسیب ببیند و متوجه نشوید.
          - دندان و اطراف آن ممکن است چند روز حساس باشد.
          - اطراف دندان ممکن است کمی متورم و دردناک باشد. این حالت معمولاً طی حدود دو هفته بهتر می‌شود.

          درد طبیعی، دردی است که روزبه‌روز کمتر می‌شود. دردی که بیشتر می‌شود یا با ورم صورت یا تب همراه است، باید بررسی شود. نشانه‌های آن را پایین‌تر آورده‌ایم.

          ## درد بعد از عصب‌کشی چقدر طول می‌کشد؟
          یک مرور نظام‌مند، نتیجهٔ ۷۲ پژوهش را دربارهٔ درد پیش و پس از درمان ریشه کنار هم گذاشت. در این پژوهش‌ها، هم سهم بیمارانی که درد داشتند و هم شدت درد، بعد از درمان خیلی کم شد:
      - type: table
        caption: درد پیش و پس از درمان ریشه در یک مرور نظام‌مند پژوهش‌ها
        head: [زمان, بیمارانی که درد داشتند, میانگین شدت درد از ۱۰۰]
        rows:
          - [پیش از درمان, حدود ۸۱ درصد, ۵۴؛ درد متوسط]
          - [یک روز بعد از درمان, حدود ۴۰ درصد, ۲۴]
          - [یک هفته بعد از درمان, حدود ۱۱ درصد, ۵؛ درد خیلی کم]
      - type: content
        text: |-
          یعنی در بیشتر بیماران، درد در روز اول بعد از درمان کم شد و تا یک هفته به کمترین حد رسید. این عددها میانگین پژوهش‌ها هستند، نه قولی دربارهٔ دندان شما.

          دردی که ماه‌ها بماند کم است. در مرور دیگری، حدود ۵ درصد دندان‌ها شش ماه یا بیشتر بعد از درمان هنوز درد داشتند و در پژوهش‌هایی با گزارش دقیق‌تر، کمی بیشتر از ۷ درصد. علت همهٔ این دردها خود دندان نیست: در یک مرور، در حدود نیمی از این موارد نشانه‌ای از مشکل دندانی پیدا نشد. برای همین، دردی که می‌ماند باید معاینه شود تا دندانپزشک علت آن را بررسی کند. اگر علت در خود دندان نباشد، انتظار نمی‌رود درمان دوبارهٔ دندان این درد را خوب کند.

          ## چه چیزی به کم شدن درد کمک می‌کند؟
          - اگر درد دارید، مسکنی مثل استامینوفن یا ایبوپروفن را طبق دستور دندانپزشک یا داروساز بخورید. بیشتر از مقدار توصیه‌شده نخورید؛ مقدار بیشتر اثر بهتری ندارد و می‌تواند خطرناک باشد.
          - ایبوپروفن برای همه مناسب نیست. اگر زخم معده، آسم، بیماری قلب، کبد یا کلیه یا مشکل انعقاد خون دارید، داروی رقیق‌کنندهٔ خون مثل وارفارین می‌خورید یا باردارید، پیش از مصرف از داروساز یا پزشک بپرسید.
          - ایبوپروفن را هم‌زمان با مسکن‌های ضدالتهاب دیگر، مثل ناپروکسن یا آسپرین، نخورید.
          - استامینوفن را هم‌زمان با داروهای دیگری که استامینوفن دارند، مثل بعضی داروهای سرماخوردگی، نخورید.
          - به کودکان زیر ۱۶ سال آسپرین ندهید.
          - تا وقتی دندان حساس است، غذای نرم بخورید و با آن دندان نجوید. خوراکی شیرین، خیلی داغ یا خیلی سرد نخورید.
          - تا گذاشتن ترمیم دائم یا روکش، با آن دندان چیز سفت نجوید؛ دندانی که درمان ریشه شده ممکن است از دندان سالم ضعیف‌تر باشد.
          - با مسواک نرم مسواک بزنید و مراقب باشید ضربه‌ای به دهانتان نخورد.
          - سیگار نکشید؛ سیگار ممکن است بعضی مشکلات دندان را بدتر کند.

          اگر عفونت پخش شده باشد، ممکن است دندانپزشک آنتی‌بیوتیک بدهد. در این صورت آن را طبق دستور مصرف کنید و اگر در خوردن آن مشکلی داشتید، به دندانپزشک خبر دهید. آنتی‌بیوتیک مسکن نیست: در دو پژوهش کوچک روی دندان‌هایی که عصبشان مرده بود و درد داشتند، خوردن آنتی‌بیوتیک بعد از درمان ریشه درد ۲۴ ساعت بعد را کم نکرد. شواهد این پژوهش‌ها قوی نیست.

          روی دندان ممکن است ترمیم موقت باشد. این ترمیم تا گذاشتن ترمیم دائم یا [روکش دندان](/خدمات/روکش-دندان) از دندان محافظت می‌کند؛ ترمیم دائم یا روکش دندان را از آسیب بیشتر محافظت می‌کند. ترمیم دائم را هر چه زودتر، در نوبتی که دندانپزشک می‌دهد، انجام دهید و جلسه‌های پیگیری را از دست ندهید.

          برای نکته‌های روزهای اول بعد از درمان ریشه و درمان‌های دیگر، [راهنمای مراقبت بعد از درمان](/راهنمای-بیمار/مراقبت-بعد-از-درمان) را بخوانید. دربارهٔ خود این درمان و مراحل آن، صفحهٔ [درمان ریشه](/خدمات/درمان-ریشه) را ببینید.
      - type: callout
        tone: info
        text: درمان، دارو و زمان نوبت بعدی با معاینه و تشخیص دندانپزشک است. اگر دستوری را فراموش کردید یا مطمئن نیستید، با کلینیک تماس بگیرید.
      - type: content
        text: |-
          ## چه زمانی با دندانپزشک تماس بگیرید؟
          اگر یکی از این نشانه‌ها را دارید، با دندانپزشکی که درمان را انجام داده است یا با کلینیک تماس بگیرید:
          - درد یا ورم به‌جای کم شدن، بیشتر می‌شود.
          - درد با مسکن آرام نمی‌شود.
          - یک هفته گذشته و هنوز درد زیادی دارید.
          - گونه یا فک ورم کرده است.
          - تب دارید، لثه قرمز شده یا مزهٔ بدی در دهان حس می‌کنید.
          - ترمیم موقت افتاده، یا دندان یا ترمیم آن شکسته یا لق شده است.
          - هفته‌ها یا ماه‌ها بعد، دندان درمان‌شده دوباره درد گرفته است.
          - بی‌حسی یا گزگز لب، چانه یا زبان بعد از چند ساعت بهتر نشده است.

          اگر ورم صورت با تب، لرز یا حال عمومی بد همراه است، همین امروز باید معاینه شوید. اگر کلینیک بسته است، به اورژانس بیمارستان بروید.

          اگر دردتان شدید است و با مسکن آرام نمی‌شود، صفحهٔ [درد شدید دارید؟](/اورژانس) را ببینید.
      - type: callout
        tone: warning
        text: >-
          اگر تورم تنفس یا بلع را سخت کرده است، با اورژانس ۱۱۵ تماس بگیرید. اگر اطراف
          چشم یا گردن ورم کرده، چشم درد گرفته یا دیدتان ناگهان مشکل پیدا کرده، داخل دهان
          خیلی ورم کرده، یا باز کردن دهان یا حرف زدن سخت شده است، با ۱۱۵ تماس بگیرید یا
          به اورژانس بیمارستان بروید. خودتان رانندگی نکنید.
    faqs:
      - question: درد بعد از عصب‌کشی چند روز طول می‌کشد؟
        answer: >-
          معمولاً چند روز. در یک مرور نظام‌مند پژوهش‌ها، درد بیشتر بیماران در روز اول
          بعد از درمان کم شد و تا یک هفته به کمترین حد رسید. ورم و درد اطراف دندان
          معمولاً طی حدود دو هفته بهتر می‌شود. اگر درد به‌جای کم شدن بیشتر شد، با کلینیک
          تماس بگیرید.
      - question: برای درد بعد از عصب‌کشی چه مسکنی بخورم؟
        answer: >-
          مسکن‌هایی مثل استامینوفن یا ایبوپروفن به کار می‌روند. آن‌ها را طبق دستور
          دندانپزشک یا داروساز بخورید و بیشتر از مقدار توصیه‌شده نخورید. ایبوپروفن برای
          همه مناسب نیست؛ اگر زخم معده، آسم، بیماری قلب، کبد یا کلیه یا مشکل انعقاد خون
          دارید، داروی رقیق‌کنندهٔ خون می‌خورید یا باردارید، پیش از مصرف از داروساز یا
          پزشک بپرسید. اگر بیماری کبد یا کلیه دارید، پیش از خوردن استامینوفن هم بپرسید.
      - question: آیا بعد از عصب‌کشی باید آنتی‌بیوتیک بخورم؟
        answer: >-
          نه همیشه. اگر عفونت پخش شده باشد، ممکن است دندانپزشک آنتی‌بیوتیک بدهد؛ در این
          صورت آن را طبق دستور مصرف کنید. آنتی‌بیوتیک مسکن نیست. در دو پژوهش کوچک روی
          دندان‌هایی که عصبشان مرده بود و درد داشتند، خوردن آنتی‌بیوتیک بعد از درمان ریشه
          درد ۲۴ ساعت بعد را کم نکرد. شواهد این پژوهش‌ها قوی نیست.
      - question: آیا ورم بعد از عصب‌کشی طبیعی است؟
        answer: >-
          کمی ورم و درد اطراف دندان ممکن است پیش بیاید و معمولاً طی حدود دو هفته بهتر
          می‌شود. اگر گونه یا فک ورم کرد، ورم بیشتر شد یا تب دارید، با کلینیک تماس
          بگیرید. اگر تورم تنفس یا بلع را سخت کرده یا به چشم یا گردن رسیده است، با
          اورژانس ۱۱۵ تماس بگیرید.
      - question: اگر ترمیم موقت افتاد، چه کنم؟
        answer: >-
          با کلینیک تماس بگیرید. ترمیم موقت تا گذاشتن ترمیم دائم یا روکش از دندان محافظت
          می‌کند. تا زمان معاینه، با آن طرف نجوید و خوراکی شیرین، خیلی داغ یا خیلی سرد
          نخورید.
      - question: اگر ماه‌ها بعد دندان عصب‌کشی‌شده درد گرفت، چه کنم؟
        answer: >-
          برای معاینه نوبت بگیرید. دردی که ماه‌ها بماند کم است؛ در یک مرور پژوهش‌ها،
          حدود ۵ درصد دندان‌ها شش ماه یا بیشتر بعد از درمان هنوز درد داشتند. علت همهٔ این
          دردها خود دندان نیست، برای همین معاینه لازم است تا دندانپزشک علت را بررسی کند.
